<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#087f5b">
<meta name="description" content="Rivers Bayelsa Community in Diaspora – The Gambia (RIBACOM)">
<title>RIBACOM | Rivers Bayelsa Community in Diaspora – The Gambia</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--green:#087f5b;--green2:#0b9a70;--blue:#075985;--ink:#17323b;--muted:#667781;--bg:#f5f8f7;--card:#fff;--line:#dce7e3;--danger:#c62828;--warning:#a15c00;--success:#087f5b;--shadow:0 8px 28px rgba(20,50,45,.08);--radius:16px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif;line-height:1.5}button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:var(--green);text-decoration:none}.hidden{display:none!important}.container{width:min(1180px,94%);margin:auto}.site-header{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 2px 12px rgba(0,0,0,.04)}.header-inner{min-height:68px;display:flex;align-items:center;gap:14px}.brand{display:flex;align-items:center;gap:10px;min-width:0}.crest{width:48px;height:48px;border-radius:50%;background:linear-gradient(145deg,#087f5b,#075985);color:#fff;display:grid;place-items:center;font-weight:800;border:3px solid #d9eee8;overflow:hidden}.crest img{width:100%;height:100%;object-fit:cover}.brand-text{min-width:0}.brand-name{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.brand-motto{font-size:11px;color:var(--muted)}.desktop-nav{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap}.nav-btn,.icon-btn,.btn{border:0;border-radius:10px;padding:10px 13px;background:transparent;color:var(--ink)}.nav-btn:hover,.icon-btn:hover{background:#eef7f4}.btn{background:var(--green);color:#fff;font-weight:700}.btn:hover{background:#066c4e}.btn.secondary{background:#e8f2ef;color:var(--green)}.btn.danger{background:var(--danger)}.btn.small{padding:7px 10px;font-size:13px}.main{min-height:calc(100vh - 130px);padding:22px 0 70px}.hero{background:linear-gradient(135deg,#087f5b,#075985);color:#fff;border-radius:22px;padding:34px;margin-bottom:20px}.hero h1{margin:0 0 10px;font-size:clamp(28px,5vw,46px)}.hero p{max-width:760px;margin:0 0 18px;opacity:.94}.hero-actions{display:flex;gap:10px;flex-wrap:wrap}.hero .btn.secondary{background:#fff;color:var(--green)}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:20px 0 12px}.section-head h2,.section-head h3{margin:0}.grid{display:grid;gap:16px}.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}.grid-4{grid-template-columns:repeat(4,minmax(0,1fr))}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}.card h3,.card h4{margin-top:0}.muted{color:var(--muted)}.small-text{font-size:13px}.stat{font-size:30px;font-weight:800}.badge{display:inline-flex;align-items:center;padding:4px 9px;border-radius:999px;background:#e7f4ef;color:var(--green);font-size:12px;font-weight:700}.badge.warning{background:#fff2dc;color:var(--warning)}.badge.danger{background:#fde8e8;color:var(--danger)}.badge.blue{background:#e7f2fb;color:var(--blue)}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:13px;font-weight:700}.field input,.field select,.field textarea{width:100%;border:1px solid #cbdad5;border-radius:10px;background:#fff;padding:11px 12px;outline:none}.field textarea{min-height:110px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(8,127,91,.1)}.form-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.alert{padding:11px 13px;border-radius:10px;background:#edf7f3;color:var(--green);margin:10px 0}.alert.error{background:#fdecec;color:var(--danger)}.alert.warning{background:#fff4df;color:var(--warning)}.table-wrap{overflow:auto}.data-table{width:100%;border-collapse:collapse;background:#fff}.data-table th,.data-table td{padding:11px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.data-table th{font-size:12px;color:var(--muted);text-transform:uppercase}.empty{text-align:center;padding:35px;color:var(--muted)}.loading{text-align:center;padding:45px;color:var(--muted)}.gallery-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.gallery-item{overflow:hidden;border-radius:14px;background:#fff;border:1px solid var(--line)}.gallery-item img{display:block;width:100%;height:210px;object-fit:cover}.gallery-caption{padding:10px}.publication-cover{width:100%;height:190px;object-fit:cover;border-radius:10px;background:#edf3f1}.footer{background:#103d37;color:#e9f7f3;padding:28px 0}.footer-grid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:20px}.drawer-backdrop,.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:80}.drawer{position:fixed;right:0;top:0;bottom:0;width:min(360px,90%);background:#fff;z-index:81;padding:20px;overflow:auto;box-shadow:-8px 0 30px rgba(0,0,0,.15)}.drawer-head{display:flex;justify-content:space-between;align-items:center}.drawer-nav{display:grid;gap:7px;margin-top:18px}.drawer-nav button{text-align:left}.modal{position:fixed;z-index:91;left:50%;top:50%;transform:translate(-50%,-50%);width:min(720px,94%);max-height:90vh;overflow:auto;background:#fff;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.25);padding:20px}.modal-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.toast{position:fixed;right:16px;bottom:18px;z-index:120;max-width:360px;background:#17323b;color:#fff;padding:12px 15px;border-radius:10px;box-shadow:var(--shadow)}.bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:60;padding:6px}.bottom-nav>div{display:grid;grid-template-columns:repeat(4,1fr)}.bottom-nav button{border:0;background:none;padding:8px 2px;font-size:11px;color:var(--muted)}.bottom-nav button.active{color:var(--green);font-weight:700}.admin-bar{background:#eaf6f2;border:1px solid #c9e6dc;padding:12px;border-radius:12px;margin-bottom:16px}.quick-actions{display:flex;flex-wrap:wrap;gap:8px}.preview-img{width:100%;max-height:280px;object-fit:cover;border-radius:12px}.notification-unread{border-left:4px solid var(--green)}.id-card{background:linear-gradient(135deg,#063f31,#087f5b);color:#fff;border-radius:18px;padding:20px;min-height:230px}.id-card .id-number{font-size:22px;font-weight:800;letter-spacing:1px}.pill-row{display:flex;flex-wrap:wrap;gap:8px}.search-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.search-row input{flex:1;min-width:180px;border:1px solid var(--line);border-radius:10px;padding:10px}.offline{position:fixed;left:12px;bottom:12px;background:#a15c00;color:#fff;padding:8px 11px;border-radius:8px;z-index:130;font-size:12px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:900px){.desktop-nav{display:none}.grid-3,.grid-4{grid-template-columns:repeat(2,minmax(0,1fr))}.gallery-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.bottom-nav{display:block}.main{padding-bottom:90px}.footer-grid{grid-template-columns:1fr 1fr}}
@media(max-width:620px){.brand-name{font-size:13px}.brand-motto{font-size:10px}.crest{width:42px;height:42px}.grid-2,.grid-3,.grid-4,.form-grid,.footer-grid,.gallery-grid{grid-template-columns:1fr}.hero{padding:24px}.card{padding:15px}.section-head{align-items:flex-start;flex-direction:column}.data-table th,.data-table td{padding:8px;font-size:12px}}
</style>
</head>
<body>
<header class="site-header"><div class="container header-inner"><div class="brand"><div class="crest" id="headerLogo">R</div><div class="brand-text"><div class="brand-name">Rivers Bayelsa Community in Diaspora – The Gambia</div><div class="brand-motto">TRUTH • UNITY • SERVICE</div></div></div><nav class="desktop-nav" id="desktopNav"></nav><button class="icon-btn" id="menuButton" aria-label="Open menu">☰</button></div></header>
<main id="mainContent" class="main container"><div class="loading">Loading RIBACOM…</div></main>
<footer class="footer"><div class="container footer-grid"><div><strong>RIBACOM</strong><p class="small-text">Rivers Bayelsa Community in Diaspora – The Gambia.<br>TRUTH • UNITY • SERVICE</p></div><div><strong>Community</strong><p class="small-text">Peace • Unity • Progress</p></div><div><strong>Support</strong><p class="small-text" id="footerContact">Community administration</p></div></div></footer>
<div id="drawerBackdrop" class="drawer-backdrop hidden"></div><aside id="drawer" class="drawer hidden"><div class="drawer-head"><strong>RIBACOM Menu</strong><button class="icon-btn" onclick="closeDrawer()">✕</button></div><div id="drawerNav" class="drawer-nav"></div></aside>
<div id="modalBackdrop" class="modal-backdrop hidden"></div><div id="globalModal" class="modal hidden" role="dialog" aria-modal="true"><div class="modal-head"><strong id="modalTitle">RIBACOM</strong><button class="icon-btn" onclick="closeModal()">✕</button></div><div id="modalBody"></div></div>
<div id="toast" class="toast hidden"></div><div id="offlineIndicator" class="offline hidden">You are offline</div>
<div class="bottom-nav"><div id="bottomNav"></div></div>
<script>
/* ============================================================
   RIBACOM FINAL CONSOLIDATED APPLICATION
   Sections 1–19 consolidated into one clean HTML document.
   ============================================================ */
const SUPABASE_URL='YOUR_SUPABASE_PROJECT_URL';
const SUPABASE_ANON_KEY='YOUR_SUPABASE_ANON_KEY';
const supabaseClient=(window.supabase&&SUPABASE_URL.startsWith('http'))?window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY):null;
const APP={name:'Rivers Bayelsa Community in Diaspora – The Gambia',acronym:'RIBACOM',motto:'TRUTH • UNITY • SERVICE',version:'2026.10',logoUrl:'',contactEmail:'',contactPhone:''};
const State={session:null,user:null,member:null,application:null,digitalId:null,admin:false,adminRole:null,settings:{},screen:'home',initialized:false,loading:false};
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const text=v=>esc(v);
const fmtDate=v=>v?new Date(v).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}):'—';
const fmtDateTime=v=>v?new Date(v).toLocaleString(undefined,{dateStyle:'medium',timeStyle:'short'}):'—';
const money=v=>Number(v||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
function toast(message,error=false){const e=$('toast');e.textContent=message;e.classList.remove('hidden');e.style.background=error?'#c62828':'#17323b';clearTimeout(window.__toast);window.__toast=setTimeout(()=>e.classList.add('hidden'),3500)}
function openModal(title,body){$('modalTitle').textContent=title;$('modalBody').innerHTML=body;$('modalBackdrop').classList.remove('hidden');$('globalModal').classList.remove('hidden')}
function closeModal(){$('modalBackdrop').classList.add('hidden');$('globalModal').classList.add('hidden');$('modalBody').innerHTML=''}
function openDrawer(){$('drawerBackdrop').classList.remove('hidden');$('drawer').classList.remove('hidden')}
function closeDrawer(){$('drawerBackdrop').classList.add('hidden');$('drawer').classList.add('hidden')}
function requireSupabase(){if(!supabaseClient){toast('Add your Supabase URL and anon key before using the database.',true);return false}return true}
function errMsg(e){return e?.message||e?.error_description||'An unexpected error occurred.'}
function sanitize(v,max=5000){return String(v??'').trim().slice(0,max)}
function email(v){return String(v||'').trim().toLowerCase()}
function validEmail(v){return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)}
function amount(v){const n=Number(v);return Number.isFinite(n)&&n>=0?n:0}
function fileOk(file,types=['image/jpeg','image/png','image/webp','application/pdf'],max=10*1024*1024){return !!file&&types.includes(file.type)&&file.size<=max}
async function uploadFile(bucket,file,folder=''){if(!requireSupabase())throw new Error('Supabase is not configured');if(!fileOk(file))throw new Error('Unsupported file or file is larger than 10MB.');const clean=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');const path=(folder?folder+'/':'')+Date.now()+'_'+crypto.randomUUID()+'_'+clean;const {error}=await supabaseClient.storage.from(bucket).upload(path,file,{upsert:false});if(error)throw error;const {data}=supabaseClient.storage.from(bucket).getPublicUrl(path);return data.publicUrl}
async function safeInsert(table,payload){const {data,error}=await supabaseClient.from(table).insert(payload).select().single();if(error)throw error;return data}
async function safeUpdate(table,id,payload){const {data,error}=await supabaseClient.from(table).update(payload).eq('id',id).select().single();if(error)throw error;return data}
async function safeDelete(table,id){const {error}=await supabaseClient.from(table).delete().eq('id',id);if(error)throw error}
async function getSession(){if(!requireSupabase())return null;const {data,error}=await supabaseClient.auth.getSession();if(error)throw error;return data.session}
async function isAdmin(){if(!State.user||!supabaseClient)return false;const {data,error}=await supabaseClient.from('ribacom_admin_roles').select('*').eq('user_id',State.user.id).eq('is_active',true).maybeSingle();if(!error&&data){State.admin=true;State.adminRole=data.role||data.admin_role||'admin';return true}State.admin=false;State.adminRole=null;return false}
async function loadSettings(){if(!supabaseClient)return;try{const {data}=await supabaseClient.from('ribacom_site_settings').select('*');(data||[]).forEach(r=>{const k=r.setting_key||r.key;if(k)State.settings[k]=r.setting_value??r.value??''});Object.assign(APP,{logoUrl:State.settings.logo_url||APP.logoUrl,contactEmail:State.settings.contact_email||'',contactPhone:State.settings.contact_phone||''});applyBrand()}catch(e){console.warn('Settings:',e.message)}}
function applyBrand(){if(APP.logoUrl)$('headerLogo').innerHTML='<img src="'+esc(APP.logoUrl)+'" alt="RIBACOM crest">';if(APP.contactEmail||APP.contactPhone)$('footerContact').textContent=[APP.contactEmail,APP.contactPhone].filter(Boolean).join(' • ')}
function publicRoutes(){return ['home','about','constitution','leadership','youth','events','announcements','publications','gallery','login','register','reset']}
function memberRoutes(){return ['dashboard','profile','digital-id','payments','welfare','notifications']}
function adminRoutes(){return ['admin','admin-members','admin-applications','admin-payments','admin-welfare','admin-events','admin-announcements','admin-publications','admin-gallery','admin-notifications','admin-settings','admin-system-health']}
function canVisit(s){return publicRoutes().includes(s)||(!State.user&&['login','register','reset'].includes(s))||(State.user&&memberRoutes().includes(s))||(State.admin&&adminRoutes().includes(s))}
async function navigateTo(screen,opts={}){if(!canVisit(screen)){toast(State.user?'Access denied.':'Please sign in to continue.',true);screen=State.user?'dashboard':'home'}State.screen=screen;closeDrawer();await renderScreen(screen,opts);updateNavigation()}
function navItems(){const base=[['home','Home'],['about','About'],['constitution','Constitution'],['events','Events'],['announcements','Announcements'],['publications','Publications'],['gallery','Gallery']];if(State.user)base.push(['dashboard','Dashboard'],['notifications','Notifications']);if(State.admin)base.push(['admin','Admin']);return base}
function updateNavigation(){const items=navItems();$('desktopNav').innerHTML=items.map(([s,l])=>'<button class="nav-btn" onclick="navigateTo(\''+s+'\')">'+l+'</button>').join('')+(!State.user?'<button class="btn small" onclick="navigateTo(\'login\')">Login</button>':'<button class="btn small" onclick="logout()">Logout</button>');$('drawerNav').innerHTML=items.map(([s,l])=>'<button class="nav-btn" onclick="navigateTo(\''+s+'\')">'+l+'</button>').join('')+(State.user?'<button class="btn" onclick="logout()">Logout</button>':'<button class="btn" onclick="navigateTo(\'login\')">Login</button>');$('bottomNav').innerHTML=[['home','Home'],[State.user?'dashboard':'login',State.user?'Dashboard':'Login'],['events','Events'],[State.user?'notifications':'about',State.user?'Alerts':'About']].map(([s,l])=>'<button class="'+(State.screen===s?'active':'')+'" onclick="navigateTo(\''+s+'\')">'+l+'</button>').join('')}
function page(title,subtitle=''){return '<div class="section-head"><div><h2>'+text(title)+'</h2>'+(subtitle?'<div class="muted">'+text(subtitle)+'</div>':'')+'</div></div>'}
function card(title,body,actions=''){return '<div class="card"><h3>'+text(title)+'</h3>'+body+(actions?'<div class="form-actions">'+actions+'</div>':'')+'</div>'}
function empty(msg='No records found.'){return '<div class="card empty">'+text(msg)+'</div>'}

/* PUBLIC */
async function renderHome(){const [events,anns]=await Promise.all([queryPublic('events',4),queryPublic('announcements',4)]);return '<div class="hero"><h1>'+text(APP.name)+'</h1><p>Welcome to the official RIBACOM community platform for members, families and leadership in The Gambia.</p><div class="hero-actions"><button class="btn secondary" onclick="navigateTo(\'register\')">Apply for Membership</button><button class="btn secondary" onclick="navigateTo(\'about\')">Learn About RIBACOM</button></div></div><div class="grid grid-3"><div class="card"><h3>Truth</h3><p>Transparent community administration and responsible records.</p></div><div class="card"><h3>Unity</h3><p>Building cooperation among Rivers and Bayelsa people in The Gambia.</p></div><div class="card"><h3>Service</h3><p>Supporting members through welfare, information and community programmes.</p></div></div>'+page('Upcoming Events')+'<div class="grid grid-2">'+(events.length?events.map(eventCard).join(''):empty('No events published yet.'))+'</div>'+page('Latest Announcements')+'<div class="grid grid-2">'+(anns.length?anns.map(announcementCard).join(''):empty('No announcements published yet.'))+'</div>'}
async function renderAbout(){let content='RIBACOM is a community association serving Rivers and Bayelsa people in Diaspora in The Gambia.';try{if(supabaseClient){const {data}=await supabaseClient.from('ribacom_about_content').select('*').limit(1).maybeSingle();if(data)content=data.content||data.message||data.body||content}}catch(e){}return page('About RIBACOM')+'<div class="card"><p>'+text(content)+'</p></div>'}
async function renderConstitution(){return page('Constitution','Community governance and reference documents')+card('Constitution', '<p class="muted">The constitution and approved governance information will be displayed here as documents become available.</p>')}
async function renderLeadership(){return page('Leadership')+card('Community Leadership','<p class="muted">Leadership information can be maintained by the administration.</p>')}
async function renderYouth(){return page('Youth')+card('Youth Programmes','<p class="muted">Youth activities and programmes will appear here.</p>')}
async function queryPublic(table,limit=50){if(!supabaseClient)return[];try{let q=supabaseClient.from(table).select('*').order('created_at',{ascending:false}).limit(limit);const r=await q;return r.error?[]:(r.data||[])}catch(e){return[]}}
function eventCard(x){return '<div class="card"><span class="badge blue">Event</span><h3>'+text(x.title||x.name||'Untitled event')+'</h3><p>'+text(x.description||'')+'</p><div class="small-text muted">'+fmtDate(x.event_date||x.date)+' • '+text(x.time||'')+'</div><div class="small-text">'+text(x.location||'')+'</div></div>'}
function announcementCard(x){return '<div class="card"><span class="badge">Announcement</span><h3>'+text(x.title||'Announcement')+'</h3><p>'+text(x.message||x.content||x.description||'')+'</p><div class="small-text muted">'+fmtDate(x.created_at)+'</div></div>'}
function publicationCard(x){return '<div class="card">'+(x.cover_image_url||x.image_url?'<img class="publication-cover" src="'+esc(x.cover_image_url||x.image_url)+'" alt="">':'')+'<span class="badge blue">Publication</span><h3>'+text(x.title||'Publication')+'</h3><p>'+text(x.description||x.content||'')+'</p><button class="btn small" onclick="openPublication('+esc(JSON.stringify(x))+')">View</button></div>'}
function galleryCard(x){const u=x.image_url||x.url;return '<div class="gallery-item">'+(u?'<img src="'+esc(u)+'" alt="'+text(x.caption||'RIBACOM gallery')+'" loading="lazy">':'')+'<div class="gallery-caption">'+text(x.caption||'')+'</div></div>'}
async function renderEvents(){const data=await queryPublic('events',100);return page('Events')+'<div class="grid grid-2">'+(data.length?data.map(eventCard).join(''):empty('No events published yet.'))+'</div>'}
async function renderAnnouncements(){const data=await queryPublic('announcements',100);return page('Announcements')+'<div class="grid grid-2">'+(data.length?data.map(announcementCard).join(''):empty('No announcements published yet.'))+'</div>'}
async function renderPublications(){const data=await queryPublic('publications',100);return page('Publications')+'<div class="grid grid-3">'+(data.length?data.map(publicationCard).join(''):empty('No publications available yet.'))+'</div>'}
async function renderGallery(){const data=await queryPublic('gallery',100);return page('Gallery')+'<div class="gallery-grid">'+(data.length?data.map(galleryCard).join(''):empty('No gallery images available yet.'))+'</div>'}
function openPublication(x){const u=x.file_url||x.pdf_url||x.document_url;openModal(x.title||'Publication','<p>'+text(x.description||x.content||'')+'</p>'+(u?'<p><a class="btn" href="'+esc(u)+'" target="_blank" rel="noopener">Open publication</a></p>':''))}

/* AUTH + MEMBERSHIP */
function authForm(type){const register=type==='register';return page(register?'Membership Registration':'Member Login')+'<div class="card" style="max-width:680px;margin:auto"><div id="authAlert"></div><form onsubmit="'+(register?'handleRegister(event)':'handleLogin(event)')+';return false"><div class="form-grid">'+(register?'<div class="field"><label>First name *</label><input name="first_name" required></div><div class="field"><label>Middle name</label><input name="middle_name"></div><div class="field"><label>Last name *</label><input name="last_name" required></div><div class="field"><label>Phone *</label><input name="phone" required></div>':'')+'<div class="field"><label>Email *</label><input name="email" type="email" required></div><div class="field"><label>Password *</label><input name="password" type="password" minlength="8" required></div>'+(register?'<div class="field"><label>State of origin</label><input name="state_of_origin"></div><div class="field"><label>Local Government Area</label><input name="local_government_area"></div><div class="field"><label>Address</label><input name="address"></div><div class="field"><label>Occupation</label><input name="occupation"></div><div class="field"><label>Category</label><select name="category"><option value="adult">Adult</option><option value="youth">Youth</option><option value="student">Student</option><option value="family">Family</option></select></div>':'')+'</div><div class="form-actions"><button class="btn" type="submit">'+(register?'Submit Registration':'Sign In')+'</button><button class="btn secondary" type="button" onclick="navigateTo(\''+(register?'login':'register')+'\')">'+(register?'Already registered? Login':'Create account')+'</button></div><button class="nav-btn" type="button" onclick="navigateTo(\'reset\')">Forgot password?</button></form></div>'}
function authAlert(msg,error=false){$('authAlert').innerHTML='<div class="alert '+(error?'error':'')+'">'+text(msg)+'</div>'}
async function handleLogin(ev){if(!requireSupabase())return;const f=new FormData(ev.target);const e=email(f.get('email'));const p=String(f.get('password')||'');if(!validEmail(e)||p.length<8)return authAlert('Enter a valid email and password.',true);try{const {error}=await supabaseClient.auth.signInWithPassword({email:e,password:p});if(error)throw error;toast('Signed in successfully.');await loadCurrentUser();await navigateTo('dashboard')}catch(e){authAlert(errMsg(e),true)}}
async function handleRegister(ev){if(!requireSupabase())return;const f=new FormData(ev.target);const e=email(f.get('email'));const p=String(f.get('password')||'');if(!validEmail(e)||p.length<8)return authAlert('Use a valid email and a password of at least 8 characters.',true);try{const {data,error}=await supabaseClient.auth.signUp({email:e,password:p});if(error)throw error;const u=data.user;if(u)await safeInsert('ribacom_membership_applications',{applicant_id:u.id,first_name:sanitize(f.get('first_name'),100),middle_name:sanitize(f.get('middle_name'),100),last_name:sanitize(f.get('last_name'),100),phone:sanitize(f.get('phone'),40),email:e,state_of_origin:sanitize(f.get('state_of_origin'),100),local_government_area:sanitize(f.get('local_government_area'),100),address:sanitize(f.get('address'),300),occupation:sanitize(f.get('occupation'),120),category:sanitize(f.get('category'),50),application_status:'pending'});authAlert('Registration submitted. Check your email if confirmation is required, then sign in.');ev.target.reset()}catch(e){authAlert(errMsg(e),true)}}
async function handleReset(ev){ev.preventDefault();const e=email(new FormData(ev.target).get('email'));if(!validEmail(e))return toast('Enter a valid email.',true);try{const {error}=await supabaseClient.auth.resetPasswordForEmail(e,{redirectTo:location.origin});if(error)throw error;toast('Password reset email sent.')}catch(e){toast(errMsg(e),true)}}
async function loadCurrentUser(){State.session=await getSession();State.user=State.session?.user||null;State.member=null;State.application=null;State.digitalId=null;State.admin=false;if(!State.user){updateNavigation();return}try{const m=await supabaseClient.from('ribacom_members').select('*').eq('user_id',State.user.id).maybeSingle();State.member=m.data||null}catch(e){}try{const a=await supabaseClient.from('ribacom_membership_applications').select('*').eq('applicant_id',State.user.id).order('created_at',{ascending:false}).limit(1).maybeSingle();State.application=a.data||null}catch(e){}try{const d=await supabaseClient.from('ribacom_digital_ids').select('*').eq('member_id',State.member?.id||'').maybeSingle();State.digitalId=d.data||null}catch(e){}await isAdmin();updateNavigation()}
async function logout(){if(supabaseClient)await supabaseClient.auth.signOut();State.session=null;State.user=null;State.member=null;State.application=null;State.digitalId=null;State.admin=false;toast('You have been signed out.');navigateTo('home')}
function resetForm(){return '<form onsubmit="handleReset(event);return false"><div class="field"><label>Email</label><input name="email" type="email" required></div><div class="form-actions"><button class="btn">Send reset email</button></div></form>'}

/* MEMBER */
async function renderDashboard(){await loadCurrentUser();const m=State.member,a=State.application;return page('Member Dashboard','Your RIBACOM account overview')+'<div class="grid grid-4"><div class="card"><div class="muted">Membership</div><div class="stat">'+text(m?.membership_number||'Pending')+'</div><span class="badge">'+text(m?.membership_status||a?.application_status||'Pending')+'</span></div><div class="card"><div class="muted">Profile</div><div class="stat">'+(m?'Active':'—')+'</div><button class="btn small" onclick="navigateTo(\'profile\')">Open profile</button></div><div class="card"><div class="muted">Digital ID</div><div class="stat">'+(State.digitalId?'Ready':'—')+'</div><button class="btn small" onclick="navigateTo(\'digital-id\')">View ID</button></div><div class="card"><div class="muted">Notifications</div><div class="stat" id="notificationStat">…</div><button class="btn small" onclick="navigateTo(\'notifications\')">View alerts</button></div></div><div class="grid grid-2"><div class="card"><h3>Quick actions</h3><div class="quick-actions"><button class="btn" onclick="navigateTo(\'payments\')">Payments</button><button class="btn secondary" onclick="navigateTo(\'welfare\')">Welfare</button><button class="btn secondary" onclick="navigateTo(\'profile\')">Profile</button></div></div><div class="card"><h3>Membership status</h3><p>'+(a?text(a.application_status||'pending'):'No application record found.')+'</p></div></div>'}
async function renderProfile(){const m=State.member||{};return page('My Profile')+'<div class="card"><form onsubmit="saveProfile(event);return false"><div class="form-grid"><div class="field"><label>First name</label><input name="first_name" value="'+text(m.first_name||'')+'" required></div><div class="field"><label>Middle name</label><input name="middle_name" value="'+text(m.middle_name||'')+'"></div><div class="field"><label>Last name</label><input name="last_name" value="'+text(m.last_name||'')+'" required></div><div class="field"><label>Phone</label><input name="phone" value="'+text(m.phone||'')+'"></div><div class="field"><label>State of origin</label><input name="state_of_origin" value="'+text(m.state_of_origin||'')+'"></div><div class="field"><label>LGA</label><input name="local_government_area" value="'+text(m.local_government_area||'')+'"></div><div class="field full"><label>Address</label><input name="address" value="'+text(m.address||'')+'"></div></div><div class="form-actions"><button class="btn">Save profile</button></div></form></div>'}
async function saveProfile(ev){if(!State.member?.id)return toast('Your member record is not active yet.',true);const f=new FormData(ev.target);try{await safeUpdate('ribacom_members',State.member.id,Object.fromEntries(['first_name','middle_name','last_name','phone','state_of_origin','local_government_area','address'].map(k=>[k,sanitize(f.get(k),300)])));await loadCurrentUser();toast('Profile updated.')}catch(e){toast(errMsg(e),true)}}
async function renderDigitalId(){const d=State.digitalId,m=State.member;return page('Digital ID')+(d?'<div class="id-card"><div class="small-text">RIBACOM DIGITAL ID</div><div class="id-number">'+text(d.id_number||d.membership_number||m?.membership_number||'—')+'</div><p>'+text(m?.first_name||'')+' '+text(m?.last_name||'')+'</p><div class="small-text">Issued: '+fmtDate(d.issued_date||d.created_at)+'</div></div>':card('Digital ID','<p class="muted">Your digital ID will appear here after membership approval and issuance.</p>'))}
async function renderPayments(){let data=[];if(supabaseClient&&State.user){try{const r=await supabaseClient.rpc('my_payments');data=r.data||[]}catch(e){const r=await supabaseClient.from('payments').select('*').eq('user_id',State.user.id).order('created_at',{ascending:false});data=r.data||[]}}let methods=[];try{const r=await supabaseClient.from('payment_settings').select('*').eq('active',true);methods=r.data||[]}catch(e){}return page('Payments','Submit and track community payments')+'<div class="grid grid-2"><div class="card"><form onsubmit="submitPayment(event);return false"><div class="form-grid"><div class="field"><label>Payment type</label><select name="payment_type"><option>Membership</option><option>Annual Dues</option><option>Welfare Levy</option><option>Donation</option><option>Other</option></select></div><div class="field"><label>Amount</label><input name="amount" type="number" min="0" step="0.01" required></div><div class="field"><label>Payment method</label><select name="payment_method">'+(methods.length?methods.map(x=>'<option value="'+text(x.name||x.method||x.payment_method)+'">'+text(x.name||x.method||x.payment_method)+'</option>').join(''):'<option>Wave</option><option>APS Wallet</option><option>Afrimoney</option><option>QMoney</option><option>Bank Transfer</option><option>Cash</option>')+'</select></div><div class="field"><label>Reference</label><input name="reference"></div><div class="field full"><label>Notes</label><textarea name="notes"></textarea></div></div><div class="form-actions"><button class="btn">Submit payment</button></div></form></div><div class="card"><h3>Payment history</h3>'+(data.length?'<div class="table-wrap"><table class="data-table"><thead><tr><th>Date</th><th>Type</th><th>Amount</th><th>Status</th></tr></thead><tbody>'+data.map(x=>'<tr><td>'+fmtDate(x.created_at)+'</td><td>'+text(x.payment_type||'')+'</td><td>'+money(x.amount)+'</td><td><span class="badge">'+text(x.status||'pending')+'</span></td></tr>').join('')+'</tbody></table></div>':empty('No payment records yet.'))+'</div></div>'}
async function submitPayment(ev){const f=new FormData(ev.target);const payload={p_payment_type:sanitize(f.get('payment_type'),80),p_amount:amount(f.get('amount')),p_payment_method:sanitize(f.get('payment_method'),80),p_reference:sanitize(f.get('reference'),150),p_notes:sanitize(f.get('notes'),1000)};try{const {error}=await supabaseClient.rpc('submit_payment',payload);if(error)throw error;toast('Payment submitted.');ev.target.reset();navigateTo('payments')}catch(e){toast(errMsg(e),true)}}
async function renderWelfare(){const r=await supabaseClient.from('welfare_requests').select('*').eq('user_id',State.user.id).order('created_at',{ascending:false});const data=r.data||[];return page('Welfare','Submit a welfare request and track its review')+'<div class="grid grid-2"><div class="card"><form onsubmit="submitWelfare(event);return false"><div class="form-grid"><div class="field"><label>Request type</label><select name="request_type"><option>Emergency</option><option>Medical</option><option>Bereavement</option><option>Family Support</option><option>Other</option></select></div><div class="field"><label>Subject</label><input name="subject" required></div><div class="field"><label>Amount requested</label><input name="amount" type="number" min="0" step="0.01"></div><div class="field"><label>Contact phone</label><input name="phone"></div><div class="field full"><label>Details</label><textarea name="description" required></textarea></div><div class="field full"><label>Additional information</label><textarea name="additional_information"></textarea></div></div><div class="form-actions"><button class="btn">Submit request</button></div></form></div><div><h3>My requests</h3>'+(data.length?data.map(welfareCard).join(''):empty('No welfare requests yet.'))+'</div></div>'}
function welfareCard(x){return '<div class="card"><span class="badge">'+text(x.status||'pending')+'</span><h3>'+text(x.subject||'Welfare request')+'</h3><p>'+text(x.description||'')+'</p><div class="small-text muted">'+fmtDateTime(x.created_at)+'</div></div>'}
async function submitWelfare(ev){const f=new FormData(ev.target);try{await safeInsert('welfare_requests',{user_id:State.user.id,request_type:sanitize(f.get('request_type'),80),subject:sanitize(f.get('subject'),150),description:sanitize(f.get('description'),5000),amount_requested:amount(f.get('amount')),contact_phone:sanitize(f.get('phone'),40),additional_information:sanitize(f.get('additional_information'),2000),status:'pending'});toast('Welfare request submitted.');ev.target.reset();navigateTo('welfare')}catch(e){toast(errMsg(e),true)}}
async function renderNotifications(){let data=[];try{const r=await supabaseClient.from('notifications').select('*').or('user_id.eq.'+State.user.id+',user_id.is.null').order('created_at',{ascending:false});data=r.data||[]}catch(e){}return page('Notifications','Community and personal notifications')+(data.length?data.map(notificationCard).join(''):empty('No notifications.'))}
function notificationCard(x){const unread=x.is_read===false||x.read===false;return '<div class="card '+(unread?'notification-unread':'')+'"><div class="section-head"><span class="badge">'+(unread?'Unread':'Read')+'</span><span class="small-text muted">'+fmtDateTime(x.created_at)+'</span></div><h3>'+text(x.title||'Notification')+'</h3><p>'+text(x.message||x.content||'')+'</p>'+(unread&&x.id?'<button class="btn small" onclick="markNotificationRead(\''+x.id+'\')">Mark as read</button>':'')+'</div>'}
async function markNotificationRead(id){try{let r=await supabaseClient.from('notifications').update({is_read:true}).eq('id',id);if(r.error)r=await supabaseClient.from('notifications').update({read:true}).eq('id',id);if(r.error)throw r.error;await navigateTo('notifications')}catch(e){toast(errMsg(e),true)}}

/* ADMIN */
async function adminGuard(){if(!State.user){await navigateTo('login');return false}if(!State.admin){toast('Administrator access required.',true);await navigateTo('dashboard');return false}return true}
async function renderAdmin(){if(!(await adminGuard()))return '';const counts={};for(const [k,t] of [['members','ribacom_members'],['applications','ribacom_membership_applications'],['payments','payments'],['welfare','welfare_requests'],['events','events'],['announcements','announcements'],['publications','publications'],['gallery','gallery'],['notifications','notifications']]){try{const r=await supabaseClient.from(t).select('*',{count:'exact',head:true});counts[k]=r.count||0}catch(e){counts[k]=0}}return page('Admin Dashboard','Community administration')+'<div class="admin-bar"><strong>Admin role:</strong> '+text(State.adminRole||'admin')+'</div><div class="grid grid-4">'+Object.entries(counts).map(([k,v])=>'<div class="card"><div class="muted">'+text(k)+'</div><div class="stat">'+v+'</div></div>').join('')+'</div><div class="card"><h3>Management</h3><div class="quick-actions">'+[['admin-members','Members'],['admin-applications','Applications'],['admin-payments','Payments'],['admin-welfare','Welfare'],['admin-events','Events'],['admin-announcements','Announcements'],['admin-publications','Publications'],['admin-gallery','Gallery'],['admin-notifications','Notifications'],['admin-settings','Site Settings'],['admin-system-health','System Health']].map(x=>'<button class="btn secondary" onclick="navigateTo(\''+x[0]+'\')">'+x[1]+'</button>').join('')+'</div></div>'}
async function renderAdminMembers(){if(!(await adminGuard()))return '';const r=await supabaseClient.from('ribacom_members').select('*').order('created_at',{ascending:false});const data=r.data||[];return adminList('Members','adminMemberRows',data)}
function adminList(title,fn,data){return page(title)+'<div class="search-row"><input id="adminSearch" placeholder="Search records…" oninput="filterAdminRows()"></div><div id="adminRecordList">'+(data.length?data.map(window[fn]).join(''):empty('No records found.'))+'</div>'}
function adminMemberRows(x){return '<div class="card"><div class="section-head"><div><h3>'+text((x.first_name||'')+' '+(x.last_name||''))+'</h3><div class="small-text muted">'+text(x.membership_number||x.user_id||'')+'</div></div><span class="badge">'+text(x.membership_status||'pending')+'</span></div><p>'+text(x.email||'')+' • '+text(x.phone||'')+'</p><div class="form-actions"><button class="btn small" onclick="editMember(\''+x.id+'\')">Edit</button><button class="btn secondary small" onclick="changeMemberStatus(\''+x.id+'\',\'active\')">Activate</button><button class="btn danger small" onclick="changeMemberStatus(\''+x.id+'\',\'inactive\')">Deactivate</button></div></div>'}
async function editMember(id){const r=await supabaseClient.from('ribacom_members').select('*').eq('id',id).single();if(r.error)return toast(errMsg(r.error),true);const x=r.data;openModal('Edit member','<form onsubmit="saveMember(event,\''+id+'\');return false"><div class="form-grid"><div class="field"><label>First name</label><input name="first_name" value="'+text(x.first_name||'')+'"></div><div class="field"><label>Last name</label><input name="last_name" value="'+text(x.last_name||'')+'"></div><div class="field"><label>Phone</label><input name="phone" value="'+text(x.phone||'')+'"></div><div class="field"><label>Status</label><select name="membership_status"><option '+(x.membership_status==='active'?'selected':'')+'>active</option><option '+(x.membership_status==='inactive'?'selected':'')+'>inactive</option><option '+(x.membership_status==='pending'?'selected':'')+'>pending</option></select></div></div><div class="form-actions"><button class="btn">Save</button></div></form>')}
async function saveMember(ev,id){const f=new FormData(ev.target);try{await safeUpdate('ribacom_members',id,{first_name:sanitize(f.get('first_name'),100),last_name:sanitize(f.get('last_name'),100),phone:sanitize(f.get('phone'),40),membership_status:sanitize(f.get('membership_status'),30)});closeModal();toast('Member updated.');navigateTo('admin-members')}catch(e){toast(errMsg(e),true)}}
async function changeMemberStatus(id,status){try{await safeUpdate('ribacom_members',id,{membership_status:status});toast('Member status updated.');navigateTo('admin-members')}catch(e){toast(errMsg(e),true)}}
async function renderAdminApplications(){if(!(await adminGuard()))return '';const r=await supabaseClient.from('ribacom_membership_applications').select('*').order('created_at',{ascending:false});const data=r.data||[];return page('Membership Applications')+(data.length?data.map(applicationAdminCard).join(''):empty('No applications.'))}
function applicationAdminCard(x){return '<div class="card"><div class="section-head"><div><h3>'+text((x.first_name||'')+' '+(x.last_name||''))+'</h3><div class="muted">'+text(x.email||'')+' • '+text(x.phone||'')+'</div></div><span class="badge '+(x.application_status==='rejected'?'danger':x.application_status==='approved'?'':'warning')+'">'+text(x.application_status||'pending')+'</span></div><p>State: '+text(x.state_of_origin||'—')+' • LGA: '+text(x.local_government_area||'—')+'</p><p>'+text(x.address||'')+'</p><div class="form-actions">'+(x.application_status==='pending'?'<button class="btn" onclick="approveApplication(\''+x.id+'\')">Approve</button><button class="btn danger" onclick="rejectApplication(\''+x.id+'\')">Reject</button>':'')+'</div></div>'}
async function approveApplication(id){try{const r=await supabaseClient.rpc('admin_approve_member',{target_id:id});if(r.error)throw r.error;await notifyUserFromApplication(id,'Membership approved','Your RIBACOM membership application has been approved.');toast('Application approved.');navigateTo('admin-applications')}catch(e){toast(errMsg(e),true)}}
async function rejectApplication(id){try{const r=await supabaseClient.rpc('admin_reject_member',{target_id:id});if(r.error)throw r.error;await notifyUserFromApplication(id,'Membership application update','Your RIBACOM membership application was not approved.');toast('Application rejected.');navigateTo('admin-applications')}catch(e){toast(errMsg(e),true)}}
async function notifyUserFromApplication(id,title,message){try{const r=await supabaseClient.from('ribacom_membership_applications').select('applicant_id').eq('id',id).maybeSingle();if(r.data?.applicant_id)await safeInsert('notifications',{user_id:r.data.applicant_id,title,message,is_read:false})}catch(e){}}
async function renderAdminPayments(){if(!(await adminGuard()))return '';let data=[];try{const r=await supabaseClient.rpc('admin_list_payments');if(r.error)throw r.error;data=r.data||[]}catch(e){const r=await supabaseClient.from('payments').select('*').order('created_at',{ascending:false});data=r.data||[]}return page('Payment Verification')+(data.length?'<div class="table-wrap"><table class="data-table"><thead><tr><th>Date</th><th>User</th><th>Type</th><th>Amount</th><th>Status</th><th>Action</th></tr></thead><tbody>'+data.map(x=>'<tr><td>'+fmtDate(x.created_at)+'</td><td>'+text(x.user_id||x.member_id||'')+'</td><td>'+text(x.payment_type||'')+'</td><td>'+money(x.amount)+'</td><td>'+text(x.status||'pending')+'</td><td>'+(x.status==='pending'?'<button class="btn small" onclick="verifyPayment(\''+x.id+'\')">Verify</button> <button class="btn danger small" onclick="rejectPayment(\''+x.id+'\')">Reject</button>':'—')+'</td></tr>').join('')+'</tbody></table></div>':empty('No payments.'))}
async function verifyPayment(id){try{const r=await supabaseClient.rpc('admin_verify_payment',{payment_id:id});if(r.error)throw r.error;toast('Payment verified.');navigateTo('admin-payments')}catch(e){toast(errMsg(e),true)}}
async function rejectPayment(id){try{const r=await supabaseClient.rpc('admin_reject_payment',{payment_id:id});if(r.error)throw r.error;toast('Payment rejected.');navigateTo('admin-payments')}catch(e){toast(errMsg(e),true)}}
async function renderAdminWelfare(){if(!(await adminGuard()))return '';const r=await supabaseClient.from('welfare_requests').select('*').order('created_at',{ascending:false});const data=r.data||[];return page('Welfare Management')+(data.length?data.map(x=>'<div class="card"><div class="section-head"><h3>'+text(x.subject||'Welfare request')+'</h3><span class="badge">'+text(x.status||'pending')+'</span></div><p>'+text(x.description||'')+'</p><div class="small-text muted">'+fmtDateTime(x.created_at)+' • '+text(x.user_id||'')+'</div><div class="form-actions"><button class="btn small" onclick="reviewWelfare(\''+x.id+'\')">Review</button></div></div>').join(''):empty('No welfare requests.'))}
async function reviewWelfare(id){const r=await supabaseClient.from('welfare_requests').select('*').eq('id',id).single();if(r.error)return toast(errMsg(r.error),true);const x=r.data;openModal('Review welfare request','<form onsubmit="saveWelfareReview(event,\''+id+'\',\''+text(x.user_id||'')+'\');return false"><p><strong>'+text(x.subject||'')+'</strong></p><p>'+text(x.description||'')+'</p><div class="field"><label>Status</label><select name="status"><option>pending</option><option>under_review</option><option>approved</option><option>rejected</option><option>completed</option></select></div><div class="field"><label>Admin notes</label><textarea name="admin_notes">'+text(x.admin_notes||'')+'</textarea></div><div class="form-actions"><button class="btn">Save review</button></div></form>')}
async function saveWelfareReview(ev,id,userId){const f=new FormData(ev.target);try{await safeUpdate('welfare_requests',id,{status:sanitize(f.get('status'),30),admin_notes:sanitize(f.get('admin_notes'),3000),reviewed_at:new Date().toISOString(),reviewed_by:State.user.id});if(userId)await safeInsert('notifications',{user_id:userId,title:'Welfare request update',message:'Your welfare request status is now '+sanitize(f.get('status'),30)+'.',is_read:false});closeModal();toast('Welfare review saved.');navigateTo('admin-welfare')}catch(e){toast(errMsg(e),true)}}

/* CONTENT ADMIN */
async function renderAdminEvents(){if(!(await adminGuard()))return '';const d=await queryPublic('events',200);return page('Event Management','Create, edit and remove community events')+'<button class="btn" onclick="editEvent()">+ Add Event</button><div style="height:12px"></div>'+(d.length?d.map(x=>'<div class="card"><h3>'+text(x.title||'')+'</h3><p>'+text(x.description||'')+'</p><div class="small-text muted">'+fmtDate(x.event_date||x.date)+' • '+text(x.location||'')+'</div><div class="form-actions"><button class="btn small" onclick="editEvent('+JSON.stringify(x).replace(/</g,'\\u003c')+')">Edit</button><button class="btn danger small" onclick="deleteContent(\'events\',\''+x.id+'\',\'admin-events\')">Delete</button></div></div>').join(''):empty('No events.'))}
function editEvent(x=null){openModal(x?'Edit event':'Add event','<form onsubmit="saveEvent(event,'+(x?"'"+x.id+"'":'null')+');return false"><div class="form-grid"><div class="field"><label>Title</label><input name="title" value="'+text(x?.title||'')+'" required></div><div class="field"><label>Date</label><input name="event_date" type="date" value="'+text(x?.event_date||x?.date||'')+'"></div><div class="field"><label>Time</label><input name="time" value="'+text(x?.time||'')+'"></div><div class="field"><label>Location</label><input name="location" value="'+text(x?.location||'')+'"></div><div class="field"><label>Status</label><select name="status"><option>published</option><option>draft</option><option>cancelled</option></select></div><div class="field full"><label>Description</label><textarea name="description">'+text(x?.description||'')+'</textarea></div></div><div class="form-actions"><button class="btn">Save event</button></div></form>')}
async function saveEvent(ev,id){const f=new FormData(ev.target);const p={title:sanitize(f.get('title'),200),event_date:sanitize(f.get('event_date'),30),time:sanitize(f.get('time'),50),location:sanitize(f.get('location'),250),description:sanitize(f.get('description'),5000),status:sanitize(f.get('status'),30)};try{id?await safeUpdate('events',id,p):await safeInsert('events',p);closeModal();toast('Event saved.');navigateTo('admin-events')}catch(e){toast(errMsg(e),true)}}
async function renderAdminAnnouncements(){if(!(await adminGuard()))return '';const d=await queryPublic('announcements',200);return page('Announcement Management')+'<button class="btn" onclick="editAnnouncement()">+ Add Announcement</button><div style="height:12px"></div>'+(d.length?d.map(x=>'<div class="card"><h3>'+text(x.title||'')+'</h3><p>'+text(x.message||x.content||'')+'</p><div class="form-actions"><button class="btn small" onclick="editAnnouncement('+JSON.stringify(x).replace(/</g,'\\u003c')+')">Edit</button><button class="btn danger small" onclick="deleteContent(\'announcements\',\''+x.id+'\',\'admin-announcements\')">Delete</button></div></div>').join(''):empty('No announcements.'))}
function editAnnouncement(x=null){openModal(x?'Edit announcement':'Add announcement','<form onsubmit="saveAnnouncement(event,'+(x?"'"+x.id+"'":'null')+');return false"><div class="field"><label>Title</label><input name="title" value="'+text(x?.title||'')+'" required></div><div class="field"><label>Message</label><textarea name="message">'+text(x?.message||x?.content||'')+'</textarea></div><div class="field"><label>Status</label><select name="status"><option>published</option><option>draft</option></select></div><div class="form-actions"><button class="btn">Save</button></div></form>')}
async function saveAnnouncement(ev,id){const f=new FormData(ev.target);const p={title:sanitize(f.get('title'),200),message:sanitize(f.get('message'),5000),status:sanitize(f.get('status'),30)};try{id?await safeUpdate('announcements',id,p):await safeInsert('announcements',p);closeModal();toast('Announcement saved.');navigateTo('admin-announcements')}catch(e){toast(errMsg(e),true)}}
async function renderAdminPublications(){if(!(await adminGuard()))return '';const d=await queryPublic('publications',200);return page('Publication Management')+'<button class="btn" onclick="editPublication()">+ Add Publication</button><div style="height:12px"></div>'+(d.length?d.map(x=>'<div class="card"><h3>'+text(x.title||'')+'</h3><p>'+text(x.description||'')+'</p><div class="form-actions"><button class="btn small" onclick="editPublication('+JSON.stringify(x).replace(/</g,'\\u003c')+')">Edit</button><button class="btn danger small" onclick="deleteContent(\'publications\',\''+x.id+'\',\'admin-publications\')">Delete</button></div></div>').join(''):empty('No publications.'))}
function editPublication(x=null){openModal(x?'Edit publication':'Add publication','<form onsubmit="savePublication(event,'+(x?"'"+x.id+"'":'null')+');return false"><div class="form-grid"><div class="field"><label>Title</label><input name="title" value="'+text(x?.title||'')+'" required></div><div class="field"><label>Status</label><select name="status"><option>published</option><option>draft</option></select></div><div class="field full"><label>Description</label><textarea name="description">'+text(x?.description||'')+'</textarea></div><div class="field"><label>PDF/document URL</label><input name="file_url" value="'+text(x?.file_url||x?.pdf_url||'')+'"></div><div class="field"><label>Cover image URL</label><input name="cover_image_url" value="'+text(x?.cover_image_url||'')+'"></div><div class="field"><label>Upload PDF</label><input name="pdf" type="file" accept="application/pdf"></div><div class="field"><label>Upload cover</label><input name="cover" type="file" accept="image/*"></div></div><div class="form-actions"><button class="btn">Save publication</button></div></form>')}
async function savePublication(ev,id){const f=new FormData(ev.target);try{let fileUrl=sanitize(f.get('file_url'),1000),cover=sanitize(f.get('cover_image_url'),1000);const pdf=f.get('pdf'),img=f.get('cover');if(pdf?.size){fileUrl=await uploadFile('publications',pdf,'documents')}if(img?.size){cover=await uploadFile('publications',img,'covers')}const p={title:sanitize(f.get('title'),200),description:sanitize(f.get('description'),5000),file_url:fileUrl,cover_image_url:cover,status:sanitize(f.get('status'),30)};id?await safeUpdate('publications',id,p):await safeInsert('publications',p);closeModal();toast('Publication saved.');navigateTo('admin-publications')}catch(e){toast(errMsg(e),true)}}
async function renderAdminGallery(){if(!(await adminGuard()))return '';const d=await queryPublic('gallery',200);return page('Gallery Management')+'<button class="btn" onclick="editGallery()">+ Add Gallery Item</button><div style="height:12px"></div><div class="gallery-grid">'+(d.length?d.map(x=>'<div class="gallery-item">'+(x.image_url?'<img src="'+esc(x.image_url)+'" alt="">':'')+'<div class="gallery-caption">'+text(x.caption||'')+'<div class="form-actions"><button class="btn small" onclick="editGallery('+JSON.stringify(x).replace(/</g,'\\u003c')+')">Edit</button><button class="btn danger small" onclick="deleteContent(\'gallery\',\''+x.id+'\',\'admin-gallery\')">Delete</button></div></div></div>').join(''):empty('No gallery items.'))+'</div>'}
function editGallery(x=null){openModal(x?'Edit gallery item':'Add gallery item','<form onsubmit="saveGallery(event,'+(x?"'"+x.id+"'":'null')+');return false"><div class="field"><label>Caption</label><input name="caption" value="'+text(x?.caption||'')+'"></div><div class="field"><label>Image URL</label><input name="image_url" value="'+text(x?.image_url||'')+'"></div><div class="field"><label>Upload image</label><input name="image" type="file" accept="image/*"></div><div class="form-actions"><button class="btn">Save</button></div></form>')}
async function saveGallery(ev,id){const f=new FormData(ev.target);try{let u=sanitize(f.get('image_url'),1000);const file=f.get('image');if(file?.size)u=await uploadFile('gallery',file,'gallery');const p={caption:sanitize(f.get('caption'),300),image_url:u};id?await safeUpdate('gallery',id,p):await safeInsert('gallery',p);closeModal();toast('Gallery item saved.');navigateTo('admin-gallery')}catch(e){toast(errMsg(e),true)}}
async function deleteContent(table,id,route){if(!confirm('Delete this record?'))return;try{await safeDelete(table,id);toast('Deleted.');navigateTo(route)}catch(e){toast(errMsg(e),true)}}

/* ADMIN NOTIFICATIONS */
async function renderAdminNotifications(){if(!(await adminGuard()))return '';const r=await supabaseClient.from('notifications').select('*').order('created_at',{ascending:false}).limit(200);const d=r.data||[];return page('Notification Management','Send community-wide or targeted notifications')+'<button class="btn" onclick="editNotification()">+ Create Notification</button><div style="height:12px"></div>'+(d.length?d.map(x=>'<div class="card"><div class="section-head"><h3>'+text(x.title||'Notification')+'</h3><span class="badge">'+(x.user_id?'Targeted':'Community-wide')+'</span></div><p>'+text(x.message||x.content||'')+'</p><div class="small-text muted">'+fmtDateTime(x.created_at)+'</div><div class="form-actions"><button class="btn danger small" onclick="deleteContent(\'notifications\',\''+x.id+'\',\'admin-notifications\')">Delete</button></div></div>').join(''):empty('No notifications.'))}
function editNotification(){openModal('Create notification','<form onsubmit="saveNotification(event);return false"><div class="field"><label>Title</label><input name="title" required></div><div class="field"><label>Message</label><textarea name="message" required></textarea></div><div class="field"><label>Recipient user ID (leave blank for everyone)</label><input name="user_id"></div><div class="form-actions"><button class="btn">Send notification</button></div></form>')}
async function saveNotification(ev){const f=new FormData(ev.target);try{await safeInsert('notifications',{user_id:sanitize(f.get('user_id'),100)||null,title:sanitize(f.get('title'),200),message:sanitize(f.get('message'),5000),is_read:false});closeModal();toast('Notification sent.');navigateTo('admin-notifications')}catch(e){toast(errMsg(e),true)}}

/* SETTINGS + HEALTH */
async function renderAdminSettings(){if(!(await adminGuard()))return '';return page('Site Settings')+'<div class="card"><form onsubmit="saveSettings(event);return false"><div class="form-grid"><div class="field"><label>Association name</label><input name="association_name" value="'+text(State.settings.association_name||APP.name)+'"></div><div class="field"><label>Acronym</label><input name="acronym" value="'+text(State.settings.acronym||APP.acronym)+'"></div><div class="field"><label>Motto</label><input name="motto" value="'+text(State.settings.motto||APP.motto)+'"></div><div class="field"><label>Logo URL</label><input name="logo_url" value="'+text(State.settings.logo_url||'')+'"></div><div class="field"><label>Contact email</label><input name="contact_email" value="'+text(State.settings.contact_email||'')+'"></div><div class="field"><label>Contact phone</label><input name="contact_phone" value="'+text(State.settings.contact_phone||'')+'"></div><div class="field full"><label>Welcome message</label><textarea name="welcome_message">'+text(State.settings.welcome_message||'')+'</textarea></div><div class="field"><label>Maintenance mode</label><select name="maintenance_mode"><option value="false">Off</option><option value="true" '+(State.settings.maintenance_mode==='true'?'selected':'')+'>On</option></select></div></div><div class="form-actions"><button class="btn">Save settings</button></div></form></div>'}
async function saveSettings(ev){const f=new FormData(ev.target);try{for(const [k,v] of f.entries()){const value=sanitize(v,3000);const existing=await supabaseClient.from('ribacom_site_settings').select('id').eq('setting_key',k).maybeSingle();if(existing.data?.id)await supabaseClient.from('ribacom_site_settings').update({setting_value:value,active:true}).eq('id',existing.data.id);else await supabaseClient.from('ribacom_site_settings').insert({setting_key:k,setting_value:value,active:true});State.settings[k]=value}await loadSettings();toast('Site settings saved.');navigateTo('admin-settings')}catch(e){toast(errMsg(e),true)}}
async function renderAdminHealth(){if(!(await adminGuard()))return '';const tables=['ribacom_members','ribacom_membership_applications','ribacom_profiles','ribacom_admin_roles','ribacom_digital_ids','ribacom_site_settings','payment_settings','payments','welfare_requests','events','announcements','publications','gallery','notifications'];let html=page('System Health')+'<div class="card"><table class="data-table"><thead><tr><th>Table</th><th>Status</th><th>Count</th></tr></thead><tbody>';for(const t of tables){try{const r=await supabaseClient.from(t).select('*',{count:'exact',head:true});html+='<tr><td>'+text(t)+'</td><td><span class="badge">OK</span></td><td>'+text(r.count??0)+'</td></tr>'}catch(e){html+='<tr><td>'+text(t)+'</td><td><span class="badge danger">Check</span></td><td>—</td></tr>'}}return html+'</tbody></table></div>'}
function filterAdminRows(){const q=String($('adminSearch')?.value||'').toLowerCase();document.querySelectorAll('#adminRecordList .card').forEach(x=>x.style.display=x.textContent.toLowerCase().includes(q)?'':'none')}

/* ROUTER */
async function renderScreen(screen){const main=$('mainContent');main.innerHTML='<div class="loading">Loading…</div>';try{let html='';switch(screen){case'home':html=await renderHome();break;case'about':html=await renderAbout();break;case'constitution':html=await renderConstitution();break;case'leadership':html=await renderLeadership();break;case'youth':html=await renderYouth();break;case'events':html=await renderEvents();break;case'announcements':html=await renderAnnouncements();break;case'publications':html=await renderPublications();break;case'gallery':html=await renderGallery();break;case'login':html=authForm('login');break;case'register':html=authForm('register');break;case'reset':html=page('Password Reset')+'<div class="card" style="max-width:600px;margin:auto">'+resetForm()+'</div>';break;case'dashboard':html=await renderDashboard();break;case'profile':html=await renderProfile();break;case'digital-id':html=await renderDigitalId();break;case'payments':html=await renderPayments();break;case'welfare':html=await renderWelfare();break;case'notifications':html=await renderNotifications();break;case'admin':html=await renderAdmin();break;case'admin-members':html=await renderAdminMembers();break;case'admin-applications':html=await renderAdminApplications();break;case'admin-payments':html=await renderAdminPayments();break;case'admin-welfare':html=await renderAdminWelfare();break;case'admin-events':html=await renderAdminEvents();break;case'admin-announcements':html=await renderAdminAnnouncements();break;case'admin-publications':html=await renderAdminPublications();break;case'admin-gallery':html=await renderAdminGallery();break;case'admin-notifications':html=await renderAdminNotifications();break;case'admin-settings':html=await renderAdminSettings();break;case'admin-system-health':html=await renderAdminHealth();break;default:html=await renderHome()}main.innerHTML=html;updateNavigation()}catch(e){console.error(e);main.innerHTML='<div class="card"><div class="alert error">'+text(errMsg(e))+'</div></div>'}}

/* INITIALIZATION */
async function initialize(){if(State.initialized)return;State.initialized=true;applyBrand();if(!supabaseClient){await navigateTo('home');return}try{await loadSettings();await loadCurrentUser();const maintenance=State.settings.maintenance_mode==='true';if(maintenance&&!State.admin){toast('The site is currently in maintenance mode.')}await navigateTo(State.user?'dashboard':'home')}catch(e){console.error('Initialization:',e);await navigateTo('home')}}
supabaseClient?.auth.onAuthStateChange(async(event,session)=>{State.session=session;State.user=session?.user||null;if(session)await loadCurrentUser();else{State.member=null;State.application=null;State.digitalId=null;State.admin=false}updateNavigation()});
$('menuButton').addEventListener('click',openDrawer);$('drawerBackdrop').addEventListener('click',closeDrawer);$('modalBackdrop').addEventListener('click',closeModal);window.addEventListener('online',()=>$('offlineIndicator').classList.add('hidden'));window.addEventListener('offline',()=>$('offlineIndicator').classList.remove('hidden'));window.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeDrawer()}});
window.addEventListener('error',e=>console.error('RIBACOM error:',e.error||e.message));window.addEventListener('unhandledrejection',e=>console.error('RIBACOM rejection:',e.reason));
window.RIBACOM={APP,State,navigateTo,renderScreen,logout,refresh:()=>loadCurrentUser()};
document.addEventListener('DOMContentLoaded',initialize);
</script>
</body>
</html>
