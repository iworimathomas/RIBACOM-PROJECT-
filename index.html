async function saveEvent(
    event,
    eventId = ""
) {

    event.preventDefault();

    if (!requireAdmin()) return;


    const form =
        event.target;

    const formData =
        new FormData(form);


    const title =
        String(
            formData.get("title") || ""
        ).trim();


    const description =
        String(
            formData.get("description") || ""
        ).trim();


    const eventDate =
        String(
            formData.get("event_date") || ""
        ).trim();


    const location =
        String(
            formData.get("location") || ""
        ).trim();


    if (
        !title ||
        !description ||
        !eventDate ||
        !location
    ) {

        showToast(
            "Title, description, date/time and location are required.",
            "error"
        );

        return;
    }


    const parsedDate =
        new Date(eventDate);


    if (
        Number.isNaN(
            parsedDate.getTime()
        )
    ) {

        showToast(
            "Please enter a valid event date and time.",
            "error"
        );

        return;
    }


    const data = {

        title,

        description,

        event_date:
            parsedDate.toISOString(),

        location,

        image_url:
            String(
                formData.get(
                    "image_url"
                ) || ""
            ).trim()
            || null,

        organizer:
            String(
                formData.get(
                    "organizer"
                ) || ""
            ).trim()
            ||
            "RIBACOM Executive Body",

        is_published:
            String(
                formData.get(
                    "is_published"
                ) || "true"
            ) === "true"

    };


    showLoading(true);


    try {

        if (eventId) {

            await updateRow(
                TABLES.events,
                eventId,
                data
            );


            showToast(
                "Event updated.",
                "success"
            );

        } else {

            await insertRow(
                TABLES.events,
                data
            );


            showToast(
                "Event created.",
                "success"
            );

        }


        state.adminEditingEvent =
            null;


        renderPage();


    } catch (error) {

        console.error(
            "Save event error:",
            error
        );


        showToast(
            error.message ||
            "Unable to save event.",
            "error"
        );


    } finally {

        showLoading(false);

    }
}

<script>

/* =========================================================
   STORAGE HELPERS
   ========================================================= */

function makeStorageFileName(file, prefix = "file") {

    const originalName =
        file?.name || "file";

    const extension =
        originalName.includes(".")
        ? originalName
            .split(".")
            .pop()
            .toLowerCase()
        : "";


    const uniquePart =
        typeof crypto !== "undefined" &&
        crypto.randomUUID
        ? crypto.randomUUID()
        : `${Date.now()}-${Math.random()
            .toString(36)
            .substring(2, 10)}`;


    return `${prefix}-${uniquePart}${
        extension ? "." + extension : ""
    }`;
}


async function uploadToStorage(
    bucket,
    file,
    prefix
) {

    if (!file) {
        return null;
    }


    const fileName =
        makeStorageFileName(
            file,
            prefix
        );


    const filePath =
        `${fileName}`;


    const { error } =
        await supabaseClient
            .storage
            .from(bucket)
            .upload(
                filePath,
                file,
                {
                    cacheControl: "3600",
                    upsert: false
                }
            );


    if (error)
        throw error;


    const {
        data
    } =
        supabaseClient
            .storage
            .from(bucket)
            .getPublicUrl(
                filePath
            );


    return {
        path: filePath,
        url: data?.publicUrl || ""
    };
}


function extractStoragePath(
    bucket,
    fileUrl
) {

    if (!fileUrl) {
        return null;
    }


    try {

        const marker =
            `/storage/v1/object/public/${bucket}/`;


        const index =
            fileUrl.indexOf(marker);


        if (index !== -1) {

            return decodeURIComponent(
                fileUrl.substring(
                    index + marker.length
                )
            );

        }


        return null;


    } catch (error) {

        console.warn(
            "Unable to extract storage path:",
            error
        );


        return null;
    }
}


async function deleteStorageFile(
    bucket,
    fileUrl
) {

    const path =
        extractStoragePath(
            bucket,
            fileUrl
        );


    if (!path) {
        return;
    }


    const {
        error
    } =
        await supabaseClient
            .storage
            .from(bucket)
            .remove([
                path
            ]);


    if (error) {

        console.warn(
            "Storage deletion warning:",
            error
        );

    }
}

async function saveGalleryItem(
    event,
    galleryId = ""
) {

    event.preventDefault();

    if (!requireAdmin()) return;


    const form =
        event.target;

    const formData =
        new FormData(form);


    const title =
        String(
            formData.get(
                "title"
            ) || ""
        ).trim();


    const caption =
        String(
            formData.get(
                "caption"
            ) || ""
        ).trim();


    const manualUrl =
        String(
            formData.get(
                "image_url"
            ) || ""
        ).trim();


    const fileInput =
        form.querySelector(
            'input[name="gallery_file"]'
        );


    const file =
        fileInput?.files?.[0] ||
        null;


    if (!title) {

        showToast(
            "Gallery title is required.",
            "error"
        );

        return;
    }


    if (
        !file &&
        !manualUrl &&
        !galleryId
    ) {

        showToast(
            "Please select an image or provide an image URL.",
            "error"
        );

        return;
    }


    showLoading(true);


    try {

        let imageUrl =
            manualUrl || null;


        let oldImageUrl =
            null;


        if (galleryId) {

            const {
                data: oldItem,
                error: oldError
            } =
                await supabaseClient
                    .from(TABLES.gallery)
                    .select("image_url")
                    .eq("id", galleryId)
                    .single();


            if (!oldError) {

                oldImageUrl =
                    oldItem?.image_url ||
                    null;

            }
        }


        if (file) {

            const uploaded =
                await uploadToStorage(
                    "gallery",
                    file,
                    "gallery"
                );


            imageUrl =
                uploaded.url;

        }


        if (!imageUrl) {

            throw new Error(
                "An image is required."
            );

        }


        const data = {

            title,

            caption:
                caption || null,

            image_url:
                imageUrl,

            is_published:
                String(
                    formData.get(
                        "is_published"
                    ) || "true"
                ) === "true"

        };


        if (!galleryId) {

            data.created_by =
                state.user?.id || null;

        }


        if (galleryId) {

            await updateRow(
                TABLES.gallery,
                galleryId,
                data
            );


            if (
                file &&
                oldImageUrl &&
                oldImageUrl !== imageUrl
            ) {

                await deleteStorageFile(
                    "gallery",
                    oldImageUrl
                );

            }


            showToast(
                "Gallery item updated.",
                "success"
            );

        } else {

            await insertRow(
                TABLES.gallery,
                data
            );


            showToast(
                "Gallery image uploaded.",
                "success"
            );

        }


        state.adminEditingGallery =
            null;


        renderPage();


    } catch (error) {

        console.error(
            "Save gallery error:",
            error
        );


        showToast(
            error.message ||
            "Unable to save gallery item.",
            "error"
        );


    } finally {

        showLoading(false);

    }
}

/* =========================================================
   SAVE PUBLICATION
   ========================================================= */

async function savePublication(
    event,
    publicationId = ""
) {

    event.preventDefault();

    if (!requireAdmin()) return;


    const form =
        event.target;

    const formData =
        new FormData(form);


    const title =
        String(
            formData.get(
                "title"
            ) || ""
        ).trim();


    const description =
        String(
            formData.get(
                "description"
            ) || ""
        ).trim();


    const category =
        String(
            formData.get(
                "category"
            ) || "general"
        ).trim();


    const publicationDate =
        String(
            formData.get(
                "publication_date"
            ) || ""
        ).trim();


    const manualUrl =
        String(
            formData.get(
                "file_url"
            ) || ""
        ).trim();


    const fileInput =
        form.querySelector(
            'input[name="publication_file"]'
        );


    const file =
        fileInput?.files?.[0] ||
        null;


    if (!title) {

        showToast(
            "Publication title is required.",
            "error"
        );

        return;
    }


    if (
        !file &&
        !manualUrl &&
        !publicationId
    ) {

        showToast(
            "Please upload a publication file or provide a file URL.",
            "error"
        );

        return;
    }


    showLoading(true);


    try {

        let fileUrl =
            manualUrl || null;


        let oldFileUrl =
            null;


        if (publicationId) {

            const {
                data: oldPublication,
                error: oldError
            } =
                await supabaseClient
                    .from(TABLES.publications)
                    .select("file_url")
                    .eq(
                        "id",
                        publicationId
                    )
                    .single();


            if (!oldError) {

                oldFileUrl =
                    oldPublication?.file_url ||
                    null;

            }
        }


        if (file) {

            const uploaded =
                await uploadToStorage(
                    "publication",
                    file,
                    "publication"
                );


            fileUrl =
                uploaded.url;

        }


        if (!fileUrl) {

            throw new Error(
                "A publication file is required."
            );

        }


        let finalDate =
            publicationDate ||
            new Date()
                .toISOString()
                .slice(0, 10);


        const dateCheck =
            new Date(
                `${finalDate}T00:00:00`
            );


        if (
            Number.isNaN(
                dateCheck.getTime()
            )
        ) {

            throw new Error(
                "Please enter a valid publication date."
            );

        }


        const data = {

            title,

            description:
                description || null,

            file_url:
                fileUrl,

            category:
                category || "general",

            publication_date:
                finalDate,

            is_published:
                String(
                    formData.get(
                        "is_published"
                    ) || "true"
                ) === "true"

        };


        if (publicationId) {

            await updateRow(
                TABLES.publications,
                publicationId,
                data
            );


            if (
                file &&
                oldFileUrl &&
                oldFileUrl !== fileUrl
            ) {

                await deleteStorageFile(
                    "publication",
                    oldFileUrl
                );

            }


            showToast(
                "Publication updated.",
                "success"
            );

        } else {

            await insertRow(
                TABLES.publications,
                data
            );


            showToast(
                "Publication created.",
                "success"
            );

        }


        state.adminEditingPublication =
            null;


        renderPage();


    } catch (error) {

        console.error(
            "Save publication error:",
            error
        );


        showToast(
            error.message ||
            "Unable to save publication.",
            "error"
        );


    } finally {

        showLoading(false);

    }
}


/* =========================================================
   PUBLICATION STATUS
   ========================================================= */

async function togglePublicationStatus(
    id,
    published
) {

    if (!requireAdmin()) return;


    if (
        !confirm(
            published
            ? "Publish this publication?"
            : "Unpublish this publication?"
        )
    ) {
        return;
    }


    showLoading(true);


    try {

        await updateRow(
            TABLES.publications,
            id,
            {
                is_published: published
            }
        );


        showToast(
            published
            ? "Publication published."
            : "Publication unpublished.",
            "success"
        );


        renderPage();


    } catch (error) {

        console.error(
            "Publication status error:",
            error
        );


        showToast(
            error.message ||
            "Unable to update publication.",
            "error"
        );


    } finally {

        showLoading(false);

    }
}


/* =========================================================
   DELETE PUBLICATION
   ========================================================= */

async function deletePublication(id) {

    if (!requireAdmin()) return;


    if (
        !confirm(
            "Delete this publication permanently?"
        )
    ) {
        return;
    }


    showLoading(true);


    try {

        const {
            data: publication,
            error: fetchError
        } =
            await supabaseClient
                .from(TABLES.publications)
                .select("file_url")
                .eq("id", id)
                .single();


        if (fetchError)
            throw fetchError;


        const {
            error
        } =
            await supabaseClient
                .from(TABLES.publications)
                .delete()
                .eq("id", id);


        if (error)
            throw error;


        if (publication?.file_url) {

            await deleteStorageFile(
                "publication",
                publication.file_url
            );

        }


        showToast(
            "Publication deleted.",
            "success"
        );


        renderPage();


    } catch (error) {

        console.error(
            "Delete publication error:",
            error
        );


        showToast(
            error.message ||
            "Unable to delete publication.",
            "error"
        );


    } finally {

        showLoading(false);

    }
}

/* =========================================================

   ========================================================= */

async function saveYouthContent(
    event,
    youthId = ""
) {

    event.preventDefault();

    if (!requireAdmin()) return;


    const form =
        event.target;

    const formData =
        new FormData(form);


    const sectionTitle =
        String(
            formData.get(
                "section_title"
            ) || ""
        ).trim();


    const bodyContent =
        String(
            formData.get(
                "body_content"
            ) || ""
        ).trim();


    if (
        !sectionTitle ||
        !bodyContent
    ) {

        showToast(
            "Section title and content are required.",
            "error"
        );

        return;
    }


    const data = {

        section_title:
            sectionTitle,

        body_content:
            bodyContent,

        image_url:
            String(
                formData.get(
                    "image_url"
                ) || ""
            ).trim()
            || null

    };


    showLoading(true);


    try {

        if (youthId) {

            await updateRow(
                TABLES.youthContent,
                youthId,
                data
            );


            showToast(
                "Youth content updated.",
                "success"
            );

        } else {

            await insertRow(
                TABLES.youthContent,
                data
            );


            showToast(
                "Youth content created.",
                "success"
            );

        }


        state.adminEditingYouth =
            null;


        renderPage();


    } catch (error) {

        console.error(
            "Save Youth content error:",
            error
        );


        showToast(
            error.message ||
            "Unable to save Youth content.",
            "error"
        );


    } finally {

        showLoading(false);

    }
}


/* =========================================================

   ========================================================= */

async function deleteYouthContent(id) {

    if (!requireAdmin()) return;


    if (
        !confirm(
            "Delete this Youth content permanently?"
        )
    ) {
        return;
    }


    showLoading(true);


    try {

        const {
            error
        } =
            await supabaseClient
                .from(TABLES.youthContent)
                .delete()
                .eq("id", id);


        if (error)

        showToast(
            "Youth content deleted.",

        renderPage();


    } catch (error) {

        console.error(
            "Delete Youth content error:",
            error
        );


        showToast(
            error.message ||
            "Unable to delete Youth content.",
            "error"
        );


    } finally {

        showLoading(false);

    }
}

/* =========================================================

function formatWelfareStatus(
    status
) {

    const labels = {

        pending:
            "Pending",

        under_review:
            "Under Review",

        approved:
            "Approved",

        rejected:
            "Rejected",

        paid:
            "Paid"

    };


    return labels[status] ||
        String(status || "")
            .replaceAll(
                "_",
                " "
            );
}


function getWelfareStatusClass(
    status
) {

    if (status === "approved") {

        return "status-active";

    }


    if (status === "paid") {

        return "status-active";

    }


    if (status === "rejected") {

        return "status-suspended";

    }


    return "";
}

   ========================================================= */

async function saveWelfareDecision(
    event,
    requestId
) {

    event.preventDefault();

    if (!requireAdmin()) return;


    const form =
        event.target;

    const formData =
        new FormData(form);


    const status =
        String(
            formData.get(
                "status"
            ) || "pending"
        );


    const approvedRaw =
        String(
            formData.get(
                "approved_amount"
            ) || ""
        ).trim();


    let approvedAmount =
        null;


    if (approvedRaw !== "") {

        approvedAmount =
            Number(
                approvedRaw
            );


        if (
            !Number.isFinite(
                approvedAmount
            ) ||
            approvedAmount < 0
        ) {

            showToast(
                "Please enter a valid approved amount.",
                "error"
            );

            return;
        }
    }


    const adminNotes =
        String(
            formData.get(
                "admin_notes"
            ) || ""
        ).trim();


    const data = {

        status,

        approved_amount:
            approvedAmount,

        admin_notes:
            adminNotes || null

    };


    showLoading(true);


    try {

        await updateRow(
            TABLES.welfareRequests,
            requestId,
            data
        );


        showToast(
            "Welfare decision saved.",
            "success"
        );


        state.adminEditingWelfare =
            null;


        renderPage();


    } catch (error) {

        console.error(
            "Save welfare decision error:",
            error
        );


        showToast(
            error.message ||
            "Unable to save welfare decision.",
            "error"
        );


    } finally {

        showLoading(false);

    }
}

async function savePaymentMethod(
    event,
    paymentId = ""
) {

    event.preventDefault();

    if (!requireAdmin()) return;


    const form =
        event.target;

    const formData =
        new FormData(form);


    const methodName =
        String(
            formData.get(
                "method_name"
            ) || ""
        ).trim();


    const accountName =
        String(
            formData.get(
                "account_name"
            ) || ""
        ).trim();


    const accountNumber =
        String(
            formData.get(
                "account_number"
            ) || ""
        ).trim();


    const bankName =
        String(
            formData.get(
                "bank_name"
            ) || ""
        ).trim();


    if (
        !methodName ||
        !accountName ||
        !accountNumber
    ) {

        showToast(
            "Payment method, account name and account number are required.",
            "error"
        );

        return;
    }


    const data = {

        method_name:
            methodName,

        account_name:
            accountName,

        account_number:
            accountNumber,

        bank_name:
            bankName || null,

        instructions:
            String(
                formData.get(
                    "instructions"
                ) || ""
            ).trim()
            || null,

        is_active:
            String(
                formData.get(
                    "is_active"
                ) || "true"
            ) === "true"

    };


    showLoading(true);


    try {

        if (paymentId) {

            await updateRow(
                TABLES.paymentSettings,
                paymentId,
                data
            );


            showToast(
                "Payment method updated.",
                "success"
            );

        } else {

            await insertRow(
                TABLES.paymentSettings,
                data
            );


            showToast(
                "Payment method added.",
                "success"
            );

        }


        state.adminEditingPayment =
            null;


        renderPage();


    } catch (error) {

        console.error(
            "Save payment method error:",
            error
        );


        showToast(
            error.message ||
            "Unable to save payment method.",
            "error"
        );


    } finally {

        showLoading(false);

    }
}


/* =========================================================
   TOGGLE PAYMENT METHOD
   ========================================================= */

async function togglePaymentMethod(
    id,
    active
) {

    if (!requireAdmin()) return;


    if (
        !confirm(
            active
            ? "Activate this payment method?"
            : "Deactivate this payment method?"
        )
    ) {
        return;
    }


    showLoading(true);


    try {

        await updateRow(
            TABLES.paymentSettings,
            id,
            {
                is_active: active
            }
        );


        showToast(
            active
            ? "Payment method activated."
            : "Payment method deactivated.",
            "success"
        );


        renderPage();


    } catch (error) {

        console.error(
            "Payment status error:",
            error
        );


        showToast(
            error.message ||
            "Unable to update payment method.",
            "error"
        );


    } finally {

        showLoading(false);

    }
}


/* =========================================================
   DELETE PAYMENT METHOD
   ========================================================= */

async function deletePaymentMethod(id) {

    if (!requireAdmin()) return;


    if (
        !confirm(
            "Delete this payment method permanently?"
        )
    ) {
        return;
    }


    showLoading(true);


    try {

        const {
            error
        } =
            await supabaseClient
                .from(TABLES.paymentSettings)
                .delete()
                .eq("id", id);


        if (error)
            throw error;


        showToast(
            "Payment method deleted.",
            "success"
        );


        renderPage();


    } catch (error) {

        console.error(
            "Delete payment method error:",
            error
        );


        showToast(
            error.message ||
            "Unable to delete payment method.",
            "error"
        );


    } finally {

        showLoading(false);

    }
}

/* =========================================================

async function publicRows(tableName, options = {}) {
    try {
        let query = supabaseClient
            .from(tableName)
            .select(options.select || '*');

        if (options.published === true) {
            query = query.eq('is_published', true);
        }

        if (options.active === true) {
            query = query.eq('is_active', true);
        }

        if (options.orderBy) {
            query = query.order(
                options.orderBy,
                { ascending: options.ascending !== false }
            );
        }

        if (options.limit) {
            query = query.limit(options.limit);
        }

        const { data, error } = await query;

        if (error) {
            console.error('Public query error:', tableName, error);
            return [];
        }

        return data || [];
    } catch (error) {
        console.error('Public data error:', error);
        return [];
    }
}

        if (!chapters[chapter]) {

                title: article.chapter_title,

    return `

function openPublicImage(url, title) {
    const modal = document.getElementById('public-image-modal');
    const image = document.getElementById('public-modal-image');
    const caption = document.getElementById('public-modal-caption');

    if (!modal || !image) return;

    image.src = url;

    if (caption) {
        caption.textContent = title || '';
    }

    modal.classList.add('active');
}


function closePublicImage() {
    const modal = document.getElementById('public-image-modal');

    if (modal) {
        modal.classList.remove('active');
    }
}

/* =========================================================
   FINAL PUBLIC ROUTER
   ========================================================= */

async function renderPage() {

    const app = document.getElementById('app');

    if (!app) {
        console.error('RIBACOM app container not found.');
        return;
    }

    const page = state.page || 'home';

    showLoading(true);

    try {

        let html = '';

        switch (page) {

            case 'home':
                html = await renderHome();
                break;

            case 'about':
                html = await renderAbout();
                break;

            case 'leadership':
                html = await renderLeadership();
                break;

            case 'constitution':
                html = await renderConstitution();
                break;

            case 'announcements':
                html = await renderAnnouncements();
                break;

            case 'events':
                html = await renderEvents();
                break;

            case 'gallery':
                html = await renderGallery();
                break;

            case 'publications':
                html = await renderPublications();
                break;

            case 'youth':
                html = await renderYouth();
                break;

            case 'advisers':
                html = await renderAdvisers();
                break;

            case 'public-welfare':
                html = await renderPublicWelfare();
                break;

            case 'payment-methods':
                html = await renderPaymentMethods();
                break;

            case 'contact':
                html = await renderContact();
                break;

            case 'membership':
                html = await renderMembership();
                break;

            case 'digital-id':
                html = await renderDigitalID();
                break;

            case 'welfare':
                html = await renderWelfare();
                break;

            case 'login':
                html = await renderLogin();
                break;

            case 'account':
                html = await renderAccount();
                break;

            case 'admin':

                if (!requireAdmin()) {
                    return;
                }

                html = await renderAdmin();
                break;

            default:
                state.page = 'home';
                html = await renderHome();
                break;
        }

        app.innerHTML = html;

        window.scrollTo({
            top: 0,
            behavior: 'smooth'
        });

    } catch (error) {

        console.error('Page rendering error:', error);

        app.innerHTML = `
            <section class="error-page">
                <div>
                    <i class="fas fa-exclamation-triangle"></i>

                    <h2>
                        Something went wrong
                    </h2>

                    <p>
                        The page could not be loaded.
                        Please try again.
                    </p>

                    <button
                        class="btn btn-primary"
                        onclick="navigate('home')"
                    >
                        Return Home
                    </button>
                </div>
            </section>
        `;

    } finally {

        showLoading(false);
    }
}


/* =========================================================
   FINAL NAVIGATION
   ========================================================= */

function navigate(page) {

    if (!page) {
        page = 'home';
    }

    state.page = page;

    if (typeof renderPage === 'function') {
        renderPage();
    }

    const menu = document.getElementById('mobile-menu');

    if (menu) {
        menu.classList.remove('active');
    }

    const overlay = document.getElementById('mobile-menu-overlay');

    if (overlay) {
        overlay.classList.remove('active');
    }

    history.replaceState(
        { page: page },
        '',
        '#' + page
    );
}


/* =========================================================
   BROWSER BACK/FORWARD
   ========================================================= */

window.addEventListener('popstate', function () {

    const hash = window.location.hash
        .replace('#', '')
        .trim();

    state.page = hash || 'home';

    renderPage();
});


/* =========================================================
   HASH ROUTING
   ========================================================= */

function initializeRoute() {

    const hash = window.location.hash
        .replace('#', '')
        .trim();

    state.page = hash || 'home';
}


/* =========================================================
   AUTH STATE LISTENER
   ========================================================= */

if (
    typeof supabaseClient !== 'undefined' &&
    supabaseClient &&
    supabaseClient.auth
) {

    supabaseClient.auth.onAuthStateChange(
        async function(event, session) {

            try {

                if (session && session.user) {

                    state.user = session.user;

                    if (
                        typeof refreshCurrentUser === 'function'
                    ) {
                        await refreshCurrentUser();
                    }

                } else {

                    state.user = null;
                    state.profile = null;
                    state.member = null;
                }

                if (
                    state.page === 'account' ||
                    state.page === 'admin' ||
                    state.page === 'login'
                ) {
                    await renderPage();
                }

            } catch (error) {

                console.error(
                    'Authentication state error:',
                    error
                );
            }
        }
    );
}

  <!-- =========================================================
     RIBACOM MASTER APP — SECTION 11
     FINAL INTEGRATION + SYSTEM VERIFICATION
     ========================================================= -->

<script>

/* =========================================================
   FINAL SYSTEM STATE
   ========================================================= */

state.systemCheck = {
    started: false,
    completed: false,
    database: false,
    authentication: false,
    tables: {},
    errors: []
};


/* =========================================================
   SUPABASE CONNECTION CHECK
   ========================================================= */

async function verifySupabaseConnection() {

    const result = {
        connected: false,
        error: null
    };

    try {

        if (
            typeof supabaseClient === 'undefined' ||
            !supabaseClient
        ) {
            throw new Error(
                'Supabase client is not initialized.'
            );
        }

        const { error } = await supabaseClient
            .from(TABLES.profiles)
            .select('id')
            .limit(1);

        if (error) {
            result.error = error.message;
            return result;
        }

        result.connected = true;

    } catch (error) {

        result.error = error.message ||
            'Unknown Supabase connection error.';
    }

    return result;
}


/* =========================================================
   DATABASE TABLE VERIFICATION
   ========================================================= */

async function verifyTable(tableName) {

    try {

        const { error } = await supabaseClient
            .from(tableName)
            .select('*')
            .limit(1);

        if (error) {

            return {
                ok: false,
                error: error.message
            };
        }

        return {
            ok: true,
            error: null
        };

    } catch (error) {

        return {
            ok: false,
            error: error.message
        };
    }
}


async function verifyAllTables() {

    const requiredTables = {

        profiles: TABLES.profiles,
        members: TABLES.members,
        digital_ids: TABLES.digitalIDs,
        leadership: TABLES.leadership,
        constitution: TABLES.constitution,
        welfare_requests: TABLES.welfareRequests,
        payment_settings: TABLES.paymentSettings,
        announcements: TABLES.announcements,
        events: TABLES.events,
        gallery: TABLES.gallery,
        publications: TABLES.publications,
        youth_content: TABLES.youthContent,
        advisers: TABLES.advisers,
        about_content: TABLES.aboutContent

    };

    state.systemCheck.tables = {};

    for (const [key, tableName] of Object.entries(
        requiredTables
    )) {

        if (!tableName) {

            state.systemCheck.tables[key] = {
                ok: false,
                error: 'TABLES mapping is missing.'
            };

            continue;
        }

        state.systemCheck.tables[key] =
            await verifyTable(tableName);
    }

    return state.systemCheck.tables;
}


/* =========================================================
   AUTHENTICATION VERIFICATION
   ========================================================= */

async function verifyAuthentication() {

    try {

        if (
            typeof supabaseClient === 'undefined' ||
            !supabaseClient.auth
        ) {
            return {
                ok: false,
                error: 'Supabase authentication is unavailable.'
            };
        }

        const {
            data,
            error
        } = await supabaseClient.auth.getSession();

        if (error) {

            return {
                ok: false,
                error: error.message
            };
        }

        state.user = data?.session?.user || null;

        return {
            ok: true,
            authenticated: !!state.user
        };

    } catch (error) {

        return {
            ok: false,
            error: error.message
        };
    }
}


/* =========================================================
   COMPLETE SYSTEM CHECK
   ========================================================= */

async function runSystemVerification() {

    state.systemCheck.started = true;
    state.systemCheck.completed = false;
    state.systemCheck.errors = [];

    const connection =
        await verifySupabaseConnection();

    state.systemCheck.database =
        connection.connected;

    if (!connection.connected) {

        state.systemCheck.errors.push(
            'Supabase connection failed: ' +
            connection.error
        );

        return state.systemCheck;
    }

    await verifyAllTables();

    Object.entries(
        state.systemCheck.tables
    ).forEach(([name, result]) => {

        if (!result.ok) {

            state.systemCheck.errors.push(
                `${name}: ${result.error}`
            );
        }

    });

    const authentication =
        await verifyAuthentication();

    state.systemCheck.authentication =
        authentication.ok;

    if (!authentication.ok) {

        state.systemCheck.errors.push(
            'Authentication: ' +
            authentication.error
        );
    }

    state.systemCheck.completed = true;

    return state.systemCheck;
}

/* =========================================================
   ADD SYSTEM CHECK + SETTINGS TO ADMIN ROUTING
   ========================================================= */

const originalRenderPageBeforeSection11 =
    renderPage;

renderPage = async function() {

    const currentPage = state.page || 'home';

    if (currentPage === 'admin-system') {

        const app = document.getElementById('app');

        if (!app) return;

        try {

            app.innerHTML =
                await renderAdminSystemCheck();

            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });

        } catch (error) {

            console.error(error);

            app.innerHTML = `
                <div class="error-page">
                    <h2>
                        System verification failed
                    </h2>
                </div>
            `;
        }

        return;
    }


    if (currentPage === 'admin-settings') {

        const app = document.getElementById('app');

        if (!app) return;

        try {

            app.innerHTML =
                await renderAdminSettings();

            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });

        } catch (error) {

            console.error(error);

            app.innerHTML = `
                <div class="error-page">
                    <h2>
                        Settings could not be loaded
                    </h2>
                </div>
            `;
        }

        return;
    }


    return originalRenderPageBeforeSection11();
};
