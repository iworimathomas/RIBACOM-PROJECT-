   VERIFY PUBLIC DATABASE TABLE ACCESS
   --------------------------------------------------------- */

async function verifyRIBACOMPublicTables() {

    const tablesToCheck = [
        {
            key: "aboutContent",
            label: "About RIBACOM"
        },
        {
            key: "leadership",
            label: "Leadership"
        },
        {
            key: "constitution",
            label: "Constitution"
        },
        {
            key: "announcements",
            label: "Announcements"
        },
        {
            key: "events",
            label: "Events"
        },
        {
            key: "gallery",
            label: "Gallery"
        },
        {
            key: "publications",
            label: "Publications"
        },
        {
            key: "youthContent",
            label: "Youth"
        },
        {
            key: "advisers",
            label: "Advisers"
        },
        {
            key: "paymentSettings",
            label: "Payment Settings"
        }
    ];

    let passed = 0;
    let failed = 0;
    const errors = [];

    for (const item of tablesToCheck) {

        try {

            if (!TABLES[item.key]) {
                throw new Error(
                    "Table mapping missing."
                );
            }

            const result =
                await supabaseClient
                    .from(TABLES[item.key])
                    .select("*")
                    .limit(1);

            if (result.error) {
                throw result.error;
            }

            passed++;

        } catch (error) {

            failed++;

            errors.push({
                table: item.label,
                message:
                    error?.message ||
                    String(error)
            });
        }
    }

    RIBACOM_HEALTH.publicData = {
        checked: true,
        passed: passed,
        failed: failed,
        errors: errors
    };

    return {
        passed,
        failed,
        errors
    };
}


/* ---------------------------------------------------------
   MASTER HEALTH CHECK
   --------------------------------------------------------- */

async function runRIBACOMMasterHealthCheck(options = {}) {

    if (RIBACOM_HEALTH.checking) {
        return RIBACOM_HEALTH;
    }

    RIBACOM_HEALTH.checking = true;
    RIBACOM_HEALTH.checked = false;
    RIBACOM_HEALTH.startedAt =
        new Date().toISOString();

    RIBACOM_HEALTH.messages = [];

    try {

        const functionResult =
            verifyRIBACOMFunctions();

        const tableResult =
            verifyRIBACOMTableMappings();

        let supabaseResult = {
            success: false,
            message: "Not checked."
        };

        if (tableResult.failed === 0) {

            supabaseResult =
                await verifyRIBACOMSupabase();

        } else {

            supabaseResult = {
                success: false,
                message:
                    "Supabase check skipped because table mappings are incomplete."
            };
        }

        let authResult = {
            success: false,
            message: "Not checked."
        };

        if (supabaseResult.success) {

            authResult =
                await verifyRIBACOMAuthentication();

        }

        let publicResult = {
            passed: 0,
            failed: 0,
            errors: []
        };

        if (
            supabaseResult.success &&
            tableResult.failed === 0
        ) {

            publicResult =
                await verifyRIBACOMPublicTables();

        }

        const criticalFailure =
            functionResult.failed > 0 ||
            tableResult.failed > 0 ||
            !supabaseResult.success;

        const overall =
            criticalFailure
                ? "attention_required"
                : (
                    publicResult.failed > 0
                        ? "partial"
                        : "healthy"
                );

        RIBACOM_HEALTH.overall = overall;
        RIBACOM_HEALTH.checked = true;
        RIBACOM_HEALTH.checking = false;
        RIBACOM_HEALTH.completedAt =
            new Date().toISOString();

        RIBACOM_HEALTH.messages.push(
            "JavaScript functions: " +
            functionResult.passed +
            " passed, " +
            functionResult.failed +
            " failed."
        );

        RIBACOM_HEALTH.messages.push(
            "Table mappings: " +
            tableResult.passed +
            " passed, " +
            tableResult.failed +
            " failed."
        );

        RIBACOM_HEALTH.messages.push(
            "Supabase: " +
            (
                supabaseResult.success
                    ? "connected."
                    : supabaseResult.message
            )
        );

        RIBACOM_HEALTH.messages.push(
            "Public database checks: " +
            publicResult.passed +
            " passed, " +
            publicResult.failed +
            " failed."
        );

        if (authResult.session) {

            RIBACOM_HEALTH.messages.push(
                "Authentication: active session detected."
            );

        } else {

            RIBACOM_HEALTH.messages.push(
                "Authentication: no active session detected."
            );
        }

        if (options.toast !== false) {

            if (overall === "healthy") {

                showToast(
                    "RIBACOM system health check passed.",
                    "success"
                );

            } else if (overall === "partial") {

                showToast(
                    "RIBACOM is connected, but some checks need attention.",
                    "warning"
                );

            } else {

                showToast(
                    "RIBACOM system requires attention.",
                    "error"
                );
            }
        }

        return RIBACOM_HEALTH;

    } catch (error) {

        RIBACOM_HEALTH.checking = false;
        RIBACOM_HEALTH.checked = true;
        RIBACOM_HEALTH.overall = "error";
        RIBACOM_HEALTH.completedAt =
            new Date().toISOString();

        RIBACOM_HEALTH.messages.push(
            error?.message ||
            String(error)
        );

        if (options.toast !== false) {

            showToast(
                "Master health check encountered an error.",
                "error"
            );
        }

        return RIBACOM_HEALTH;
    }
}

    try {

        if (
            typeof requireRIBACOMAdmin === "function"

                await requireRIBACOMAdmin();

            return allowed !== false;
        }

        if (
            typeof requireAdmin === "function"

        if (
            typeof isAdmin === "function"
        ) {

            return !!isAdmin();
        }

        return false;

    } catch (error) {

        console.error(
            "RIBACOM admin access error:",
            error

        RIBACOM_ADMIN_ROUTE_INTEGRATION.errors.push(
            error?.message || String(error)
        );

        return false;

        await verifyRIBACOMAdminRouteAccess();

        return;

    /* -----------------------------------------------------

       ----------------------------------------------------- */

    if (
        typeof state === "object" &&
        state

        state.adminSection =
            definition.section;

        state.adminEditingId =
            null;

    RIBACOM_ADMIN_ROUTE_INTEGRATION.lastRoute =
        routeName;

    RIBACOM_ADMIN_ROUTE_INTEGRATION.lastSection =
        definition.section;

        definition.functionName ===
        "renderRIBACOMMasterHealthPage"

        return await renderRIBACOMMasterHealthPage();

                        String(error)
