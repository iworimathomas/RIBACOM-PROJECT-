async function saveEvent(
    event,
    eventId = ""
) {

    event.preventDefault();

    if (!requireAdmin()) return;


    const form =
        event.target;

    const formData =
        new FormData(form);


    const title =
        String(
            formData.get("title") || ""
        ).trim();


    const description =
        String(
            formData.get("description") || ""
        ).trim();


    const eventDate =
        String(
            formData.get("event_date") || ""
        ).trim();


    const location =
        String(
            formData.get("location") || ""
        ).trim();


    if (
        !title ||
        !description ||
        !eventDate ||
        !location
    ) {

        showToast(
            "Title, description, date/time and location are required.",
            "error"
        );

        return;
    }


    const parsedDate =
        new Date(eventDate);


    if (
        Number.isNaN(
            parsedDate.getTime()
        )
    ) {

        showToast(
            "Please enter a valid event date and time.",
            "error"
        );

        return;
    }


    const data = {

        title,

        description,

        event_date:
            parsedDate.toISOString(),

        location,

        image_url:
            String(
                formData.get(
                    "image_url"
                ) || ""
            ).trim()
            || null,

        organizer:
            String(
                formData.get(
                    "organizer"
                ) || ""
            ).trim()
            ||
            "RIBACOM Executive Body",

        is_published:
            String(
                formData.get(
                    "is_published"
                ) || "true"
            ) === "true"

    };


    showLoading(true);


    try {

        if (eventId) {

            await updateRow(
                TABLES.events,
                eventId,
                data
            );


            showToast(
                "Event updated.",
                "success"
            );

        } else {

            await insertRow(
                TABLES.events,
                data
            );


            showToast(
                "Event created.",
                "success"
            );

        }


        state.adminEditingEvent =
            null;


        renderPage();


    } catch (error) {

        console.error(
            "Save event error:",
            error
        );


        showToast(
            error.message ||
            "Unable to save event.",
            "error"
        );


    } finally {

        showLoading(false);

    }
}

<script>

/* =========================================================
   STORAGE HELPERS
   ========================================================= */

function makeStorageFileName(file, prefix = "file") {

    const originalName =
        file?.name || "file";

    const extension =
        originalName.includes(".")
        ? originalName
            .split(".")
            .pop()
            .toLowerCase()
        : "";


    const uniquePart =
        typeof crypto !== "undefined" &&
        crypto.randomUUID
        ? crypto.randomUUID()
        : `${Date.now()}-${Math.random()
            .toString(36)
            .substring(2, 10)}`;


    return `${prefix}-${uniquePart}${
        extension ? "." + extension : ""
    }`;
}


async function uploadToStorage(
    bucket,
    file,
    prefix
) {

    if (!file) {
        return null;
    }


    const fileName =
        makeStorageFileName(
            file,
            prefix
        );


    const filePath =
        `${fileName}`;


    const { error } =
        await supabaseClient
            .storage
            .from(bucket)
            .upload(
                filePath,
                file,
                {
                    cacheControl: "3600",
                    upsert: false
                }
            );


    if (error)
        throw error;


    const {
        data
    } =
        supabaseClient
            .storage
            .from(bucket)
            .getPublicUrl(
                filePath
            );


    return {
        path: filePath,
        url: data?.publicUrl || ""
    };
}


function extractStoragePath(
    bucket,
    fileUrl
) {

    if (!fileUrl) {
        return null;
    }


    try {

        const marker =
            `/storage/v1/object/public/${bucket}/`;


        const index =
            fileUrl.indexOf(marker);


        if (index !== -1) {

            return decodeURIComponent(
                fileUrl.substring(
                    index + marker.length
                )
            );

        }


        return null;


    } catch (error) {

        console.warn(
            "Unable to extract storage path:",
            error
        );


        return null;
    }
}


async function deleteStorageFile(
    bucket,
    fileUrl
) {

    const path =
        extractStoragePath(
            bucket,
            fileUrl
        );


    if (!path) {
        return;
    }


    const {
        error
    } =
        await supabaseClient
            .storage
            .from(bucket)
            .remove([
                path
            ]);


    if (error) {

        console.warn(
            "Storage deletion warning:",
            error
        );

    }
}

async function saveGalleryItem(
    event,
    galleryId = ""
) {

    event.preventDefault();

    if (!requireAdmin()) return;


    const form =
        event.target;

    const formData =
        new FormData(form);


    const title =
        String(
            formData.get(
                "title"
            ) || ""
        ).trim();


    const caption =
        String(
            formData.get(
                "caption"
            ) || ""
        ).trim();


    const manualUrl =
        String(
            formData.get(
                "image_url"
            ) || ""
        ).trim();


    const fileInput =
        form.querySelector(
            'input[name="gallery_file"]'
        );


    const file =
        fileInput?.files?.[0] ||
        null;


    if (!title) {

        showToast(
            "Gallery title is required.",
            "error"
        );

        return;
    }


    if (
        !file &&
        !manualUrl &&
        !galleryId
    ) {

        showToast(
            "Please select an image or provide an image URL.",
            "error"
        );

        return;
    }


    showLoading(true);


    try {

        let imageUrl =
            manualUrl || null;


        let oldImageUrl =
            null;


        if (galleryId) {

            const {
                data: oldItem,
                error: oldError
            } =
                await supabaseClient
                    .from(TABLES.gallery)
                    .select("image_url")
                    .eq("id", galleryId)
                    .single();


            if (!oldError) {

                oldImageUrl =
                    oldItem?.image_url ||
                    null;

            }
        }


        if (file) {

            const uploaded =
                await uploadToStorage(
                    "gallery",
                    file,
                    "gallery"
                );


            imageUrl =
                uploaded.url;

        }


        if (!imageUrl) {

            throw new Error(
                "An image is required."
            );

        }


        const data = {

            title,

            caption:
                caption || null,

            image_url:
                imageUrl,

            is_published:
                String(
                    formData.get(
                        "is_published"
                    ) || "true"
                ) === "true"

        };


        if (!galleryId) {

            data.created_by =
                state.user?.id || null;

        }


        if (galleryId) {

            await updateRow(
                TABLES.gallery,
                galleryId,
                data
            );


            if (
                file &&
                oldImageUrl &&
                oldImageUrl !== imageUrl
            ) {

                await deleteStorageFile(
                    "gallery",
                    oldImageUrl
                );

            }


            showToast(
                "Gallery item updated.",
                "success"
            );

        } else {

            await insertRow(
                TABLES.gallery,
                data
            );


            showToast(
                "Gallery image uploaded.",
                "success"
            );

        }


        state.adminEditingGallery =
            null;


        renderPage();


    } catch (error) {

        console.error(
            "Save gallery error:",
            error
        );


        showToast(
            error.message ||
            "Unable to save gallery item.",
            "error"
        );


    } finally {

        showLoading(false);

    }
}

/* =========================================================
   SAVE PUBLICATION
   ========================================================= */

async function savePublication(
    event,
    publicationId = ""
) {

    event.preventDefault();

    if (!requireAdmin()) return;


    const form =
        event.target;

    const formData =
        new FormData(form);


    const title =
        String(
            formData.get(
                "title"
            ) || ""
        ).trim();


    const description =
        String(
            formData.get(
                "description"
            ) || ""
        ).trim();


    const category =
        String(
            formData.get(
                "category"
            ) || "general"
        ).trim();


    const publicationDate =
        String(
            formData.get(
                "publication_date"
            ) || ""
        ).trim();


    const manualUrl =
        String(
            formData.get(
                "file_url"
            ) || ""
        ).trim();


    const fileInput =
        form.querySelector(
            'input[name="publication_file"]'
        );


    const file =
        fileInput?.files?.[0] ||
        null;


    if (!title) {

        showToast(
            "Publication title is required.",
            "error"
        );

        return;
    }


    if (
        !file &&
        !manualUrl &&
        !publicationId
    ) {

        showToast(
            "Please upload a publication file or provide a file URL.",
            "error"
        );

        return;
    }


    showLoading(true);


    try {

        let fileUrl =
            manualUrl || null;


        let oldFileUrl =
            null;


        if (publicationId) {

            const {
                data: oldPublication,
                error: oldError
            } =
                await supabaseClient
                    .from(TABLES.publications)
                    .select("file_url")
                    .eq(
                        "id",
                        publicationId
                    )
                    .single();


            if (!oldError) {

                oldFileUrl =
                    oldPublication?.file_url ||
                    null;

            }
        }


        if (file) {

            const uploaded =
                await uploadToStorage(
                    "publication",
                    file,
                    "publication"
                );


            fileUrl =
                uploaded.url;

        }


        if (!fileUrl) {

            throw new Error(
                "A publication file is required."
            );

        }


        let finalDate =
            publicationDate ||
            new Date()
                .toISOString()
                .slice(0, 10);


        const dateCheck =
            new Date(
                `${finalDate}T00:00:00`
            );


        if (
            Number.isNaN(
                dateCheck.getTime()
            )
        ) {

            throw new Error(
                "Please enter a valid publication date."
            );

        }


        const data = {

            title,

            description:
                description || null,

            file_url:
                fileUrl,

            category:
                category || "general",

            publication_date:
                finalDate,

            is_published:
                String(
                    formData.get(
                        "is_published"
                    ) || "true"
                ) === "true"

        };


        if (publicationId) {

            await updateRow(
                TABLES.publications,
                publicationId,
                data
            );


            if (
                file &&
                oldFileUrl &&
                oldFileUrl !== fileUrl
            ) {

                await deleteStorageFile(
                    "publication",
                    oldFileUrl
                );

            }


            showToast(
                "Publication updated.",
                "success"
            );

        } else {

            await insertRow(
                TABLES.publications,
                data
            );


            showToast(
                "Publication created.",
                "success"
            );

        }


        state.adminEditingPublication =
            null;


        renderPage();


    } catch (error) {

        console.error(
            "Save publication error:",
            error
        );


        showToast(
            error.message ||
            "Unable to save publication.",
            "error"
        );


    } finally {

        showLoading(false);

    }
}


/* =========================================================
   PUBLICATION STATUS
   ========================================================= */

async function togglePublicationStatus(
    id,
    published
) {

    if (!requireAdmin()) return;


    if (
        !confirm(
            published
            ? "Publish this publication?"
            : "Unpublish this publication?"
        )
    ) {
        return;
    }


    showLoading(true);


    try {

        await updateRow(
            TABLES.publications,
            id,
            {
                is_published: published
            }
        );


        showToast(
            published
            ? "Publication published."
            : "Publication unpublished.",
            "success"
        );


        renderPage();


    } catch (error) {

        console.error(
            "Publication status error:",
            error
        );


        showToast(
            error.message ||
            "Unable to update publication.",
            "error"
        );


    } finally {

        showLoading(false);

    }
}


/* =========================================================
   DELETE PUBLICATION
   ========================================================= */

async function deletePublication(id) {

    if (!requireAdmin()) return;


    if (
        !confirm(
            "Delete this publication permanently?"
        )
    ) {
        return;
    }


    showLoading(true);


    try {

        const {
            data: publication,
            error: fetchError
        } =
            await supabaseClient
                .from(TABLES.publications)
                .select("file_url")
                .eq("id", id)
                .single();


        if (fetchError)
            throw fetchError;


        const {
            error
        } =
            await supabaseClient
                .from(TABLES.publications)
                .delete()
                .eq("id", id);


        if (error)
            throw error;


        if (publication?.file_url) {

            await deleteStorageFile(
                "publication",
                publication.file_url
            );

        }


        showToast(
            "Publication deleted.",
            "success"
        );


        renderPage();


    } catch (error) {

        console.error(
            "Delete publication error:",
            error
        );


        showToast(
            error.message ||
            "Unable to delete publication.",
            "error"
        );


    } finally {

        showLoading(false);

    }
}

/* =========================================================

   ========================================================= */

async function saveYouthContent(
    event,
    youthId = ""
) {

    event.preventDefault();

    if (!requireAdmin()) return;


    const form =
        event.target;

    const formData =
        new FormData(form);


    const sectionTitle =
        String(
            formData.get(
                "section_title"
            ) || ""
        ).trim();


    const bodyContent =
        String(
            formData.get(
                "body_content"
            ) || ""
        ).trim();


    if (
        !sectionTitle ||
        !bodyContent
    ) {

        showToast(
            "Section title and content are required.",
            "error"
        );

        return;
    }


    const data = {

        section_title:
            sectionTitle,

        body_content:
            bodyContent,

        image_url:
            String(
                formData.get(
                    "image_url"
                ) || ""
            ).trim()
            || null

    };


    showLoading(true);


    try {

        if (youthId) {

            await updateRow(
                TABLES.youthContent,
                youthId,
                data
            );


            showToast(
                "Youth content updated.",
                "success"
            );

        } else {

            await insertRow(
                TABLES.youthContent,
                data
            );


            showToast(
                "Youth content created.",
                "success"
            );

        }


        state.adminEditingYouth =
            null;


        renderPage();


    } catch (error) {

        console.error(
            "Save Youth content error:",
            error
        );


        showToast(
            error.message ||
            "Unable to save Youth content.",
            "error"
        );


    } finally {

        showLoading(false);

    }
}


/* =========================================================

   ========================================================= */

async function deleteYouthContent(id) {

    if (!requireAdmin()) return;


    if (
        !confirm(
            "Delete this Youth content permanently?"
        )
    ) {
        return;
    }


    showLoading(true);


    try {

        const {
            error
        } =
            await supabaseClient
                .from(TABLES.youthContent)
                .delete()
                .eq("id", id);


        if (error)

        showToast(
            "Youth content deleted.",

        renderPage();


    } catch (error) {

        console.error(
            "Delete Youth content error:",
            error
        );


        showToast(
            error.message ||
            "Unable to delete Youth content.",
            "error"
        );


    } finally {

        showLoading(false);

    }
}

/* =========================================================

function formatWelfareStatus(
    status
) {

    const labels = {

        pending:
            "Pending",

        under_review:
            "Under Review",

        approved:
            "Approved",

        rejected:
            "Rejected",

        paid:
            "Paid"

    };


    return labels[status] ||
        String(status || "")
            .replaceAll(
                "_",
                " "
            );
}


function getWelfareStatusClass(
    status
) {

    if (status === "approved") {

        return "status-active";

    }


    if (status === "paid") {

        return "status-active";

    }


    if (status === "rejected") {

        return "status-suspended";

    }


    return "";
}

   ========================================================= */

async function saveWelfareDecision(
    event,
    requestId
) {

    event.preventDefault();

    if (!requireAdmin()) return;


    const form =
        event.target;

    const formData =
        new FormData(form);


    const status =
        String(
            formData.get(
                "status"
            ) || "pending"
        );


    const approvedRaw =
        String(
            formData.get(
                "approved_amount"
            ) || ""
        ).trim();


    let approvedAmount =
        null;


    if (approvedRaw !== "") {

        approvedAmount =
            Number(
                approvedRaw
            );


        if (
            !Number.isFinite(
                approvedAmount
            ) ||
            approvedAmount < 0
        ) {

            showToast(
                "Please enter a valid approved amount.",
                "error"
            );

            return;
        }
    }


    const adminNotes =
        String(
            formData.get(
                "admin_notes"
            ) || ""
        ).trim();


    const data = {

        status,

        approved_amount:
            approvedAmount,

        admin_notes:
            adminNotes || null

    };


    showLoading(true);


    try {

        await updateRow(
            TABLES.welfareRequests,
            requestId,
            data
        );


        showToast(
            "Welfare decision saved.",
            "success"
        );


        state.adminEditingWelfare =
            null;


        renderPage();


    } catch (error) {

        console.error(
            "Save welfare decision error:",
            error
        );


        showToast(
            error.message ||
            "Unable to save welfare decision.",
            "error"
        );


    } finally {

        showLoading(false);

    }
}

async function savePaymentMethod(
    event,
    paymentId = ""
) {

    event.preventDefault();

    if (!requireAdmin()) return;


    const form =
        event.target;

    const formData =
        new FormData(form);


    const methodName =
        String(
            formData.get(
                "method_name"
            ) || ""
        ).trim();


    const accountName =
        String(
            formData.get(
                "account_name"
            ) || ""
        ).trim();


    const accountNumber =
        String(
            formData.get(
                "account_number"
            ) || ""
        ).trim();


    const bankName =
        String(
            formData.get(
                "bank_name"
            ) || ""
        ).trim();


    if (
        !methodName ||
        !accountName ||
        !accountNumber
    ) {

        showToast(
            "Payment method, account name and account number are required.",
            "error"
        );

        return;
    }


    const data = {

        method_name:
            methodName,

        account_name:
            accountName,

        account_number:
            accountNumber,

        bank_name:
            bankName || null,

        instructions:
            String(
                formData.get(
                    "instructions"
                ) || ""
            ).trim()
            || null,

        is_active:
            String(
                formData.get(
                    "is_active"
                ) || "true"
            ) === "true"

    };


    showLoading(true);


    try {

        if (paymentId) {

            await updateRow(
                TABLES.paymentSettings,
                paymentId,
                data
            );


            showToast(
                "Payment method updated.",
                "success"
            );

        } else {

            await insertRow(
                TABLES.paymentSettings,
                data
            );


            showToast(
                "Payment method added.",
                "success"
            );

        }


        state.adminEditingPayment =
            null;


        renderPage();


    } catch (error) {

        console.error(
            "Save payment method error:",
            error
        );


        showToast(
            error.message ||
            "Unable to save payment method.",
            "error"
        );


    } finally {

        showLoading(false);

    }
}


/* =========================================================
   TOGGLE PAYMENT METHOD
   ========================================================= */

async function togglePaymentMethod(
    id,
    active
) {

    if (!requireAdmin()) return;


    if (
        !confirm(
            active
            ? "Activate this payment method?"
            : "Deactivate this payment method?"
        )
    ) {
        return;
    }


    showLoading(true);


    try {

        await updateRow(
            TABLES.paymentSettings,
            id,
            {
                is_active: active
            }
        );


        showToast(
            active
            ? "Payment method activated."
            : "Payment method deactivated.",
            "success"
        );


        renderPage();


    } catch (error) {

        console.error(
            "Payment status error:",
            error
        );


        showToast(
            error.message ||
            "Unable to update payment method.",
            "error"
        );


    } finally {

        showLoading(false);

    }
}


/* =========================================================
   DELETE PAYMENT METHOD
   ========================================================= */

async function deletePaymentMethod(id) {

    if (!requireAdmin()) return;


    if (
        !confirm(
            "Delete this payment method permanently?"
        )
    ) {
        return;
    }


    showLoading(true);


    try {

        const {
            error
        } =
            await supabaseClient
                .from(TABLES.paymentSettings)
                .delete()
                .eq("id", id);


        if (error)
            throw error;


        showToast(
            "Payment method deleted.",
            "success"
        );


        renderPage();


    } catch (error) {

        console.error(
            "Delete payment method error:",
            error
        );


        showToast(
            error.message ||
            "Unable to delete payment method.",
            "error"
        );


    } finally {

        showLoading(false);

    }
}

/* =========================================================

async function publicRows(tableName, options = {}) {
    try {
        let query = supabaseClient
            .from(tableName)
            .select(options.select || '*');

        if (options.published === true) {
            query = query.eq('is_published', true);
        }

        if (options.active === true) {
            query = query.eq('is_active', true);
        }

        if (options.orderBy) {
            query = query.order(
                options.orderBy,
                { ascending: options.ascending !== false }
            );
        }

        if (options.limit) {
            query = query.limit(options.limit);
        }

        const { data, error } = await query;

        if (error) {
            console.error('Public query error:', tableName, error);
            return [];
        }

        return data || [];
    } catch (error) {
        console.error('Public data error:', error);
        return [];
    }
}

        if (!chapters[chapter]) {

                title: article.chapter_title,

    return `

function openPublicImage(url, title) {
    const modal = document.getElementById('public-image-modal');
    const image = document.getElementById('public-modal-image');
    const caption = document.getElementById('public-modal-caption');

    if (!modal || !image) return;

    image.src = url;

    if (caption) {
        caption.textContent = title || '';
    }

    modal.classList.add('active');
}


function closePublicImage() {
    const modal = document.getElementById('public-image-modal');

    if (modal) {
        modal.classList.remove('active');
    }
}

/* =========================================================
   FINAL PUBLIC ROUTER
   ========================================================= */

async function renderPage() {

    const app = document.getElementById('app');

    if (!app) {
        console.error('RIBACOM app container not found.');
        return;
    }

    const page = state.page || 'home';

    showLoading(true);

    try {

        let html = '';

        switch (page) {

            case 'home':
                html = await renderHome();
                break;

            case 'about':
                html = await renderAbout();
                break;

            case 'leadership':
                html = await renderLeadership();
                break;

            case 'constitution':
                html = await renderConstitution();
                break;

            case 'announcements':
                html = await renderAnnouncements();
                break;

            case 'events':
                html = await renderEvents();
                break;

            case 'gallery':
                html = await renderGallery();
                break;

            case 'publications':
                html = await renderPublications();
                break;

            case 'youth':
                html = await renderYouth();
                break;

            case 'advisers':
                html = await renderAdvisers();
                break;

            case 'public-welfare':
                html = await renderPublicWelfare();
                break;

            case 'payment-methods':
                html = await renderPaymentMethods();
                break;

            case 'contact':
                html = await renderContact();
                break;

            case 'membership':
                html = await renderMembership();
                break;

            case 'digital-id':
                html = await renderDigitalID();
                break;

            case 'welfare':
                html = await renderWelfare();
                break;

            case 'login':
                html = await renderLogin();
                break;

            case 'account':
                html = await renderAccount();
                break;

            case 'admin':

                if (!requireAdmin()) {
                    return;
                }

                html = await renderAdmin();
                break;

            default:
                state.page = 'home';
                html = await renderHome();
                break;
        }

        app.innerHTML = html;

        window.scrollTo({
            top: 0,
            behavior: 'smooth'
        });

    } catch (error) {

        console.error('Page rendering error:', error);

        app.innerHTML = `
            <section class="error-page">
                <div>
                    <i class="fas fa-exclamation-triangle"></i>

                    <h2>
                        Something went wrong
                    </h2>

                    <p>
                        The page could not be loaded.
                        Please try again.
                    </p>

                    <button
                        class="btn btn-primary"
                        onclick="navigate('home')"
                    >
                        Return Home
                    </button>
                </div>
            </section>
        `;

    } finally {

        showLoading(false);
    }
}


/* =========================================================
   FINAL NAVIGATION
   ========================================================= */

function navigate(page) {

    if (!page) {
        page = 'home';
    }

    state.page = page;

    if (typeof renderPage === 'function') {
        renderPage();
    }

    const menu = document.getElementById('mobile-menu');

    if (menu) {
        menu.classList.remove('active');
    }

    const overlay = document.getElementById('mobile-menu-overlay');

    if (overlay) {
        overlay.classList.remove('active');
    }

    history.replaceState(
        { page: page },
        '',
        '#' + page
    );
}


/* =========================================================
   BROWSER BACK/FORWARD
   ========================================================= */

window.addEventListener('popstate', function () {

    const hash = window.location.hash
        .replace('#', '')
        .trim();

    state.page = hash || 'home';

    renderPage();
});


/* =========================================================
   HASH ROUTING
   ========================================================= */

function initializeRoute() {

    const hash = window.location.hash
        .replace('#', '')
        .trim();

    state.page = hash || 'home';
}


/* =========================================================
   AUTH STATE LISTENER
   ========================================================= */

if (
    typeof supabaseClient !== 'undefined' &&
    supabaseClient &&
    supabaseClient.auth
) {

    supabaseClient.auth.onAuthStateChange(
        async function(event, session) {

            try {

                if (session && session.user) {

                    state.user = session.user;

                    if (
                        typeof refreshCurrentUser === 'function'
                    ) {
                        await refreshCurrentUser();
                    }

                } else {

                    state.user = null;
                    state.profile = null;
                    state.member = null;
                }

                if (
                    state.page === 'account' ||
                    state.page === 'admin' ||
                    state.page === 'login'
                ) {
                    await renderPage();
                }

            } catch (error) {

                console.error(
                    'Authentication state error:',
                    error
                );
            }
        }
    );
}

  <!-- =========================================================
     RIBACOM MASTER APP — SECTION 11
     FINAL INTEGRATION + SYSTEM VERIFICATION
     ========================================================= -->

<script>

/* =========================================================
   FINAL SYSTEM STATE
   ========================================================= */

state.systemCheck = {
    started: false,
    completed: false,
    database: false,
    authentication: false,
    tables: {},
    errors: []
};


/* =========================================================
   SUPABASE CONNECTION CHECK
   ========================================================= */

async function verifySupabaseConnection() {

    const result = {
        connected: false,
        error: null
    };

    try {

        if (
            typeof supabaseClient === 'undefined' ||
            !supabaseClient
        ) {
            throw new Error(
                'Supabase client is not initialized.'
            );
        }

        const { error } = await supabaseClient
            .from(TABLES.profiles)
            .select('id')
            .limit(1);

        if (error) {
            result.error = error.message;
            return result;
        }

        result.connected = true;

    } catch (error) {

        result.error = error.message ||
            'Unknown Supabase connection error.';
    }

    return result;
}


/* =========================================================
   DATABASE TABLE VERIFICATION
   ========================================================= */

async function verifyTable(tableName) {

    try {

        const { error } = await supabaseClient
            .from(tableName)
            .select('*')
            .limit(1);

        if (error) {

            return {
                ok: false,
                error: error.message
            };
        }

        return {
            ok: true,
            error: null
        };

    } catch (error) {

        return {
            ok: false,
            error: error.message
        };
    }
}


async function verifyAllTables() {

    const requiredTables = {

        profiles: TABLES.profiles,
        members: TABLES.members,
        digital_ids: TABLES.digitalIDs,
        leadership: TABLES.leadership,
        constitution: TABLES.constitution,
        welfare_requests: TABLES.welfareRequests,
        payment_settings: TABLES.paymentSettings,
        announcements: TABLES.announcements,
        events: TABLES.events,
        gallery: TABLES.gallery,
        publications: TABLES.publications,
        youth_content: TABLES.youthContent,
        advisers: TABLES.advisers,
        about_content: TABLES.aboutContent

    };

    state.systemCheck.tables = {};

    for (const [key, tableName] of Object.entries(
        requiredTables
    )) {

        if (!tableName) {

            state.systemCheck.tables[key] = {
                ok: false,
                error: 'TABLES mapping is missing.'
            };

            continue;
        }

        state.systemCheck.tables[key] =
            await verifyTable(tableName);
    }

    return state.systemCheck.tables;
}


/* =========================================================
   AUTHENTICATION VERIFICATION
   ========================================================= */

async function verifyAuthentication() {

    try {

        if (
            typeof supabaseClient === 'undefined' ||
            !supabaseClient.auth
        ) {
            return {
                ok: false,
                error: 'Supabase authentication is unavailable.'
            };
        }

        const {
            data,
            error
        } = await supabaseClient.auth.getSession();

        if (error) {

            return {
                ok: false,
                error: error.message
            };
        }

        state.user = data?.session?.user || null;

        return {
            ok: true,
            authenticated: !!state.user
        };

    } catch (error) {

        return {
            ok: false,
            error: error.message
        };
    }
}


/* =========================================================
   COMPLETE SYSTEM CHECK
   ========================================================= */

async function runSystemVerification() {

    state.systemCheck.started = true;
    state.systemCheck.completed = false;
    state.systemCheck.errors = [];

    const connection =
        await verifySupabaseConnection();

    state.systemCheck.database =
        connection.connected;

    if (!connection.connected) {

        state.systemCheck.errors.push(
            'Supabase connection failed: ' +
            connection.error
        );

        return state.systemCheck;
    }

    await verifyAllTables();

    Object.entries(
        state.systemCheck.tables
    ).forEach(([name, result]) => {

        if (!result.ok) {

            state.systemCheck.errors.push(
                `${name}: ${result.error}`
            );
        }

    });

    const authentication =
        await verifyAuthentication();

    state.systemCheck.authentication =
        authentication.ok;

    if (!authentication.ok) {

        state.systemCheck.errors.push(
            'Authentication: ' +
            authentication.error
        );
    }

    state.systemCheck.completed = true;

    return state.systemCheck;
}

   ========================================================= */

window.renewDigitalIDMaster = async function(id) {

    try {

        if (!id) {
            showToast(
                "Digital ID record not found.",
                "error"
            );
            return;
        }

        const { data, error } =
            await supabaseClient
                .from(TABLES.digitalIDs)
                .select("id, expires_at, status")
                .eq("id", id)
                .single();

        if (error) {
            throw error;
        }

        if (!data) {
            throw new Error(
                "Digital ID record could not be located."
            );
        }

        if (data.status === "revoked") {
            showToast(
                "A revoked Digital ID cannot be renewed. Create a new ID instead.",
                "error"
            );
            return;
        }

        const now =
            new Date();

        let baseDate =
            now;

        if (data.expires_at) {

            const existingExpiry =
                new Date(data.expires_at);

            if (
                !Number.isNaN(
                    existingExpiry.getTime()
                ) &&
                existingExpiry > now
            ) {
                baseDate =
                    existingExpiry;
            }
        }

        const newExpiry =
            new Date(baseDate);

        newExpiry.setFullYear(
            newExpiry.getFullYear() + 1
        );

        const { error: updateError } =
            await supabaseClient
                .from(TABLES.digitalIDs)
                .update({
                    expires_at:
                        newExpiry.toISOString(),
                    status: "active"
                })
                .eq("id", id);

        if (updateError) {
            throw updateError;
        }

        showToast(
            "Digital ID renewed successfully.",
            "success"
        );

        if (
            typeof openDigitalIDEditor ===
            "function"
        ) {
            await openDigitalIDEditor(id);
        }

        if (
            typeof renderAdmin ===
            "function"
        ) {
            await renderAdmin();
        }

    } catch (error) {

        console.error(
            "Digital ID renewal error:",
            error
        );

        showToast(
            error.message ||
            "Unable to renew Digital ID.",
            "error"
        );
    }
};

        );

            document.createElement("meta");

        viewport.name =
            "viewport";

    "keydown",
    function(event) {

        if (
            event.key !== "Enter"
        ) {
            return;
        }

        const target =
            event.target;

        if (
            !target ||
            target.tagName !== "INPUT"
        ) {
            return;
        }

        const form =
            target.closest("form");

        if (!form) {
            return;
        }

        const textarea =
            form.querySelector(
                "textarea"
            );

        if (
            textarea &&
            textarea === document.activeElement

<!-- =========================================================
     RIBACOM MASTER APPLICATION
     SECTION 15 — SECURITY, AUTHENTICATION & ROLE CONTROL
     ========================================================= -->

<script>
/* =========================================================
   SECTION 15.1 — ROLE DEFINITIONS
   ========================================================= */

window.RIBACOM_ROLES = {
    visitor: "visitor",
    member: "member",
    admin: "admin",
    super_admin: "super_admin"
};


/* =========================================================
   SECTION 15.2 — ROLE HELPERS
   ========================================================= */

window.getRIBACOMCurrentRole =
    function() {

        return (
            state?.currentUserProfile?.role ||
            "visitor"
        );

    };


window.isRIBACOMMember =
    function() {

        return [
            "member",
            "admin",
            "super_admin"
        ].includes(
            getRIBACOMCurrentRole()
        );

    };


window.isRIBACOMAdministrator =
    function() {

        return [
            "admin",
            "super_admin"
        ].includes(
            getRIBACOMCurrentRole()
        );

    };


window.isRIBACOMSuperAdmin =
    function() {

        return (
            getRIBACOMCurrentRole() ===
            "super_admin"
        );

    };


/* =========================================================
   SECTION 15.3 — AUTHORITATIVE PROFILE REFRESH
   ========================================================= */

window.refreshRIBACOMAuthorization =
    async function() {

        try {

            if (!window.supabaseClient) {
                return null;
            }

            const {
                data: userData,
                error: userError
            } =
                await supabaseClient.auth.getUser();

            if (userError) {
                throw userError;
            }

            const user =
                userData?.user || null;

            state.currentUser =
                user;

            if (!user) {

                state.currentUserProfile =
                    null;

                return null;
            }

            const {
                data: profile,
                error: profileError
            } =
                await supabaseClient
                    .from(TABLES.profiles)
                    .select(
                        "id,email,full_name,phone,avatar_url,role,created_at,updated_at"
                    )
                    .eq("id", user.id)
                    .maybeSingle();

            if (profileError) {
                throw profileError;
            }

            state.currentUserProfile =
                profile || null;

            return profile || null;

        } catch (error) {

            console.error(
                "Authorization refresh error:",
                error
            );

            state.currentUserProfile =
                null;

            return null;
        }

    };


/* =========================================================
   SECTION 15.4 — ENSURE PROFILE
   ========================================================= */

window.ensureRIBACOMProfile =
    async function() {

        try {

            if (!window.supabaseClient) {
                return null;
            }

            const {
                data: userData,
                error: userError
            } =
                await supabaseClient.auth.getUser();

            if (userError) {
                throw userError;
            }

            const user =
                userData?.user;

            if (!user) {
                return null;
            }

            const {
                data: existingProfile,
                error: existingError
            } =
                await supabaseClient
                    .from(TABLES.profiles)
                    .select(
                        "id,email,full_name,phone,avatar_url,role"
                    )
                    .eq("id", user.id)
                    .maybeSingle();

            if (existingError) {
                throw existingError;
            }

            if (existingProfile) {

                state.currentUserProfile =
                    existingProfile;

                return existingProfile;
            }

            /*
             * IMPORTANT:
             * New profiles are created with the safe
             * default role "member".
             *
             * The browser must never allow a user
             * to select admin or super_admin here.
             */

            const fullName =
                user.user_metadata?.full_name ||
                user.email?.split("@")[0] ||
                "RIBACOM Member";

            const {
                data: createdProfile,
                error: createError
            } =
                await supabaseClient
                    .from(TABLES.profiles)
                    .insert({
                        id: user.id,
                        email: user.email || null,
                        full_name: fullName,
                        role: "member"
                    })
                    .select(
                        "id,email,full_name,phone,avatar_url,role"
                    )
                    .single();

            if (createError) {
                throw createError;
            }

            state.currentUserProfile =
                createdProfile;

            return createdProfile;

        } catch (error) {

            console.warn(
                "Profile synchronization:",
                error
            );

            return null;
        }

    };


/* =========================================================
   SECTION 15.5 — AUTHORIZATION GUARDS
   ========================================================= */

window.requireRIBACOMLogin =
    async function() {

        const profile =
            await refreshRIBACOMAuthorization();

        if (!profile) {

            showToast(
                "Please log in to continue.",
                "error"
            );

            navigate("login");

            return false;
        }

        return true;
    };


window.requireRIBACOMMember =
    async function() {

        const allowed =
            await requireRIBACOMLogin();

                    user: null,
                    profile: null,

                };

            }

                    profile?.role ||

            };

            console.error(

window.runRIBACOMSecurityDiagnostic =
    async function() {

        const result = {

            supabaseConfigured:
                !!window.supabaseClient,

            authenticated:
                false,

            profileLoaded:
                false,

            role:
                "visitor",

            admin:
                false,

            superAdmin:
                false,

            secretKeyInClient:
                false

        };

        try {

            if (!window.supabaseClient) {
                return result;
            }

            const sessionStatus =
                await getRIBACOMSessionStatus();

            result.authenticated =
                !!sessionStatus.authenticated;

            result.profileLoaded =
                !!sessionStatus.profile;

            result.role =
                sessionStatus.role ||
                "visitor";

            result.admin =
                [
                    "admin",
                    "super_admin"
                ].includes(
                    result.role
                );

            result.superAdmin =
                result.role ===
                "super_admin";

            /*
             * This frontend check does not prove that a
             * secret key exists nowhere else. It only
             * confirms this application does not define
             * a service-role key variable.
             */

            result.secretKeyInClient =
                !!(
                    window.SUPABASE_SERVICE_ROLE_KEY ||
                    window.SUPABASE_SECRET_KEY
                );

            return result;

        } catch (error) {

            result.error =
                error.message;

            return result;

        }

    };

        };

/* =========================================================
   SECTION 16.6 — DIGITAL ID EXPIRY CHECK
   ========================================================= */

window.getRIBACOMDigitalIDExpiryState =
    function(digitalID) {

        if (!digitalID) {

            return {
                state: "missing",
                label: "Not Issued"
            };

        }

        if (
            digitalID.status ===
            "revoked"
        ) {

            return {
                state: "revoked",
                label: "Revoked"
            };

        }

        if (
            digitalID.status ===
            "suspended"
        ) {

            return {
                state: "suspended",
                label: "Suspended"
            };

        }

        if (!digitalID.expires_at) {

            return {
                state: "active",
                label: "Active"
            };

        }

        const expiry =
            new Date(
                digitalID.expires_at
            );

        const now =
            new Date();

        if (
            Number.isNaN(
                expiry.getTime()
            )
        ) {

            return {
                state: "active",
                label: "Active"
            };

        }

        if (expiry < now) {

            return {
                state: "expired",
                label: "Expired"
            };

        }

        const daysRemaining =
            Math.ceil(
                (
                    expiry.getTime() -
                    now.getTime()
                ) /
                (1000 * 60 * 60 * 24)
            );

        if (
            daysRemaining <= 30
        ) {

            return {
                state: "expiring",
                label:
                    "Expires in " +
                    daysRemaining +
                    " days"
            };

        }

        return {
            state: "active",
            label: "Active"
        };

    };

window.saveRIBACOMProfile =
    async function(event) {

        if (event) {
            event.preventDefault();
        }

        try {

            const allowed =
                await requireRIBACOMLogin();

            if (!allowed) {
                return;
            }

            const form =
                document.getElementById(
                    "ribacomProfileEditForm"
                );

            if (!form) {
                return;
            }

            const formData =
                new FormData(form);

            const fullName =
                String(
                    formData.get("full_name") ||
                    ""
                ).trim();

            const phone =
                String(
                    formData.get("phone") ||
                    ""
                ).trim();

            const avatarURL =
                String(
                    formData.get("avatar_url") ||
                    ""
                ).trim();

            if (!fullName) {

                showToast(
                    "Full name is required.",
                    "error"
                );

                return;
            }

            const {
                data,
                error
            } =
                await supabaseClient
                    .from(TABLES.profiles)
                    .update({
                        full_name: fullName,
                        phone:
                            phone || null,
                        avatar_url:
                            avatarURL || null,
                        updated_at:
                            new Date().toISOString()
                    })
                    .eq(
                        "id",
                        state.currentUser.id
                    )
                    .select(
                        "id,email,full_name,phone,avatar_url,role"
                    )
                    .single();

            if (error) {
                throw error;
            }

            state.currentUserProfile =
                data;

            closeRIBACOMProfileEditor();

            showToast(
                "Profile updated successfully.",
                "success"
            );

            await renderRIBACOMMemberAccount();

        } catch (error) {

            console.error(
                "Profile save error:",
                error
            );

            showToast(
                error.message ||
                "Unable to save profile.",
                "error"
            );

        }

    };

window.validateRIBACOMMembershipData =
    function(data) {

        const errors = [];

        if (!data.full_name?.trim()) {
            errors.push(
                "Full name is required."
            );
        }

        if (!data.email?.trim()) {
            errors.push(
                "Email address is required."
            );
        }

        if (!data.phone?.trim()) {
            errors.push(
                "Phone number is required."
            );
        }

        if (
            ![
                "regular",
                "associate"
            ].includes(data.category)
        ) {

            errors.push(
                "Select a valid membership category."
            );

        }

        /*
         * The database CHECK constraint permits:
         * Rivers / Bayelsa / Other.
         */

        if (
            ![
                "Rivers",
                "Bayelsa",
                "Other"
            ].includes(
                data.state_of_origin
            )
        ) {

            errors.push(
                "Select Rivers, Bayelsa or Other."
            );

        }

        return errors;

    };


/* =========================================================
   SECTION 17.6 — MEMBERSHIP APPLICATION SUBMISSION
   ========================================================= */

window.submitRIBACOMMembershipApplication =
    async function(event) {

        if (event) {
            event.preventDefault();
        }

        try {

            const form =
                document.getElementById(
                    "ribacomMembershipApplicationForm"
                );

            if (!form) {
                return;
            }

            const formData =
                new FormData(form);

            const data = {

                full_name:
                    String(
                        formData.get("full_name") ||
                        ""
                    ).trim(),

                email:
                    String(
                        formData.get("email") ||
                        ""
                    ).trim()
                    .toLowerCase(),

                phone:
                    String(
                        formData.get("phone") ||
                        ""
                    ).trim(),

                date_of_birth:
                    String(
                        formData.get("date_of_birth") ||
                        ""
                    ).trim() || null,

                gender:
                    String(
                        formData.get("gender") ||
                        ""
                    ).trim() || null,

                address:
                    String(
                        formData.get("address") ||
                        ""
                    ).trim() || null,

                nationality:
                    String(
                        formData.get("nationality") ||
                        "Nigerian"
                    ).trim(),

                state_of_origin:
                    String(
                        formData.get("state_of_origin") ||
                        ""
                    ).trim(),

                lga:
                    String(
                        formData.get("lga") ||
                        ""
                    ).trim() || null,

                rivers_bayelsa_connection:
                    String(
                        formData.get(
                            "rivers_bayelsa_connection"
                        ) ||
                        ""
                    ).trim() || null,

                category:
                    String(
                        formData.get("category") ||
                        ""
                    ).trim(),

                emergency_contact_name:
                    String(
                        formData.get(
                            "emergency_contact_name"
                        ) ||
                        ""
                    ).trim() || null,

                emergency_contact_phone:
                    String(
                        formData.get(
                            "emergency_contact_phone"
                        ) ||
                        ""
                    ).trim() || null

            };


            const errors =
                validateRIBACOMMembershipData(
                    data
                );

            if (errors.length) {

                showToast(
                    errors[0],
                    "error"
                );

                return;
            }


            showLoading(true);


            /*
             * Prevent duplicate email membership records.
             */

            const {
                data: existing,
                error: existingError
            } =
                await supabaseClient
                    .from(TABLES.members)
                    .select("id,status")
                    .eq(
                        "email",
                        data.email
                    )
                    .maybeSingle();

            if (existingError) {
                throw existingError;
            }

            if (existing) {

                showToast(
                    "A membership record already exists for this email.",
                    "error"
                );

                return;
            }


            const {
                data: inserted,
                error
            } =
                await supabaseClient
                    .from(TABLES.members)
                    .insert({

                        full_name:
                            data.full_name,

                        email:
                            data.email,

                        phone:
                            data.phone,

                        date_of_birth:
                            data.date_of_birth,

                        gender:
                            data.gender,

                        address:
                            data.address,

                        nationality:
                            data.nationality,

                        state_of_origin:
                            data.state_of_origin,

                        lga:
                            data.lga,

                        rivers_bayelsa_connection:
                            data.rivers_bayelsa_connection,

                        category:
                            data.category,

                        status:
                            "pending",

                        emergency_contact_name:
                            data.emergency_contact_name,

                        emergency_contact_phone:
                            data.emergency_contact_phone

                    })
                    .select("*")
                    .single();


            if (error) {
                throw error;
            }


            form.reset();


            showToast(
                "Membership application submitted successfully.",
                "success"
            );


            /*
             * If the applicant is logged in, link the
             * membership record to their auth account.
             */

            if (
                state.currentUser?.id &&
                inserted?.id
            ) {

                const {
                    error: linkError
                } =
                    await supabaseClient
                        .from(TABLES.members)
                        .update({
                            user_id:
                                state.currentUser.id
                        })
                        .eq(
                            "id",
                            inserted.id
                        );

                if (linkError) {

                    console.warn(
                        "Membership account linking:",
                        linkError
                    );

                }

            }

        } catch (error) {

            console.error(
                "Membership application error:",
                error
            );

            showToast(
                error.message ||
                "Unable to submit membership application.",
                "error"
            );

        } finally {

            showLoading(false);

        }

    };

    function(record, fields = []) {

            .trim()
            .toLowerCase();

        if (!query) {

                return String(
                    value ?? ""

                .toLowerCase()
                .includes(query);

            }
        );

    };

window.validateRIBACOMAdminRecord =
    function(type, data) {

        const errors = [];

        if (!data) {

            errors.push(
                "No record data was supplied."
            );

            return errors;

        }


        if (
            [
                "announcement",
                "event",
                "gallery",
                "publication",
                "leadership",
                "adviser"
            ].includes(type)
        ) {

            if (
                !String(
                    data.title ||
                    data.name ||
                    ""
                ).trim()
            ) {

                errors.push(
                    "A record title or name is required."
                );

            }

        }


        if (
            type === "constitution"
        ) {

            if (
                !Number.isInteger(
                    Number(
                        data.chapter_number
                    )
                )
            ) {

                errors.push(
                    "A valid chapter number is required."
                );

            }

            if (
                !Number.isInteger(
                    Number(
                        data.article_number
                    )
                )
            ) {

                errors.push(
                    "A valid article number is required."
                );

            }

            if (
                !String(
                    data.content ||
                    ""
                ).trim()
            ) {

                errors.push(
                    "Article content is required."
                );

            }

        }


        if (
            type === "youth"
        ) {

            if (
                !String(
                    data.section_title ||
                    ""
                ).trim()
            ) {

                errors.push(
                    "Youth section title is required."
                );

            }

            if (
                !String(
                    data.body_content ||
                    ""
                ).trim()
            ) {

                errors.push(
                    "Youth content is required."
                );

            }

        }


        return errors;

    };

   ========================================================= */

window.saveRIBACOMMemberRecord =
    async function(memberId, updates = {}) {

        if (
            !memberId
        ) {

            showToast(
                "Member record ID is missing.",
                "error"
            );

            return false;

        }


        try {

            if (
                typeof requireRIBACOMAdmin ===
                "function"
            ) {

                const allowed =
                    await requireRIBACOMAdmin();

                if (!allowed) {
                    return false;
                }

            }


            delete updates.id;
            delete updates.created_at;
            delete updates.user_id;


            if (
                updates.state_of_origin &&
                ![
                    "Rivers",
                    "Bayelsa",
                    "Other"
                ].includes(
                    updates.state_of_origin
                )
            ) {

                showToast(
                    "Invalid state of origin.",
                    "error"
                );

                return false;

            }


            if (
                updates.category &&
                ![
                    "regular",
                    "associate"
                ].includes(
                    updates.category
                )
            ) {

                showToast(
                    "Invalid membership category.",
                    "error"
                );

                return false;

            }


            const {
                error
            } =
                await supabaseClient
                    .from(TABLES.members)
                    .update({
                        ...updates,
                        updated_at:
                            new Date().toISOString()
                    })
                    .eq(
                        "id",
                        memberId
                    );


            if (error) {
                throw error;
            }


            showToast(
                "Member record updated successfully.",
                "success"
            );


            if (
                typeof refreshCurrentAdminSection ===
                "function"
            ) {

                await refreshCurrentAdminSection();

            }


            return true;

        } catch (error) {

            console.error(
                "Member update error:",
                error
            );

            showToast(
                error.message ||
                "Unable to update member record.",
                "error"
            );

            return false;

        }

    };

window.setRIBACOMPublicationStatus =
    async function(
        tableName,
        recordId,
        published

        if (
            !tableName ||
            !recordId
        ) {

            return false;

        }


        try {

            if (
                typeof requireRIBACOMAdmin ===
                "function"
            ) {

                const allowed =
                    await requireRIBACOMAdmin();

                if (!allowed) {
                    return false;
                }

            }


            const {
                error
            } =
                await supabaseClient
                    .from(tableName)
                    .update({
                        is_published:
                            Boolean(published)
                    })
                    .eq(
                        "id",
                        recordId
                    );


            if (error) {
                throw error;
            }


            showToast(
                published
                    ? "Record published."
                    : "Record unpublished.",
                "success"
            );


            return true;

        } catch (error) {

            console.error(
                "Publication status error:",

function checkRIBACOMFunction(name) {

}


/* ---------------------------------------------------------

   completed application are checked here.
   --------------------------------------------------------- */

function getRIBACOMRequiredFunctions() {

    return [

/* ---------------------------------------------------------
   VERIFY JAVASCRIPT FUNCTIONS
   --------------------------------------------------------- */

function verifyRIBACOMFunctions() {

    const required = getRIBACOMRequiredFunctions();

    let passed = 0;
    let failed = 0;
    const missing = [];

    required.forEach(function(name) {

        if (checkRIBACOMFunction(name)) {
            passed++;
        } else {
            failed++;
            missing.push(name);
        }

    });

    RIBACOM_HEALTH.functions = {
        checked: true,
        passed: passed,
        failed: failed,
        missing: missing
    };

    return {
        passed,
        failed,
        missing
    };
}


/* ---------------------------------------------------------
   VERIFY TABLE MAPPINGS
   --------------------------------------------------------- */

function verifyRIBACOMTableMappings() {

    const requiredTables = [
        "profiles",
        "members",
        "digitalIDs",
        "leadership",
        "constitution",
        "welfareRequests",
        "paymentSettings",
        "announcements",
        "events",
        "gallery",
        "publications",
        "youthContent",
        "advisers",
        "aboutContent"
    ];

    let passed = 0;
    let failed = 0;
    const errors = [];

    if (!window.TABLES || typeof window.TABLES !== "object") {

        RIBACOM_HEALTH.tables = {
            checked: true,
            passed: 0,
            failed: requiredTables.length,
            errors: ["TABLES object is missing."]
        };

        return {
            passed: 0,
            failed: requiredTables.length,
            errors: ["TABLES object is missing."]
        };
    }

    requiredTables.forEach(function(key) {

        if (
            typeof TABLES[key] === "string" &&
            TABLES[key].trim() !== ""
        ) {

            passed++;

        } else {

            failed++;

            errors.push(
                "Missing TABLES." + key
            );
        }

    });

    RIBACOM_HEALTH.tables = {
        checked: true,
        passed: passed,
        failed: failed,
        errors: errors
    };

    return {
        passed,
        failed,
        errors
    };
}


/* ---------------------------------------------------------
   VERIFY SUPABASE CONNECTION
   --------------------------------------------------------- */

async function verifyRIBACOMSupabase() {

    RIBACOM_HEALTH.supabase.checked = true;
    RIBACOM_HEALTH.supabase.connected = false;
    RIBACOM_HEALTH.supabase.error = null;

    try {

        if (
            typeof supabaseClient === "undefined" ||
            !supabaseClient
        ) {

            throw new Error(
                "Supabase client is not initialized."
            );
        }

        const result = await supabaseClient
            .from(TABLES.aboutContent)
            .select("id")
            .limit(1);

        if (result.error) {
            throw result.error;
        }

        RIBACOM_HEALTH.supabase.connected = true;

        return {
            success: true,
            message: "Supabase connection is working."
        };

    } catch (error) {

        RIBACOM_HEALTH.supabase.error =
            error?.message ||
            String(error);

        return {
            success: false,
            message:
                RIBACOM_HEALTH.supabase.error
        };
    }
}


/* ---------------------------------------------------------
   VERIFY AUTHENTICATION
   --------------------------------------------------------- */

async function verifyRIBACOMAuthentication() {

    RIBACOM_HEALTH.authentication = {
        checked: true,
        session: false,
        userId: null,
        role: null
    };

    try {

        if (
            typeof supabaseClient === "undefined" ||
            !supabaseClient
        ) {

            throw new Error(
                "Supabase client unavailable."
            );
        }

        const result =
            await supabaseClient.auth.getSession();

        if (result.error) {
            throw result.error;
        }

        const session =
            result.data?.session || null;

        if (!session) {

            return {
                success: true,
                session: false,
                message:
                    "Supabase is working, but no user is currently signed in."
            };
        }

        RIBACOM_HEALTH.authentication.session = true;
        RIBACOM_HEALTH.authentication.userId =
            session.user?.id || null;

        let role = null;

        try {

            if (typeof getRIBACOMCurrentRole === "function") {

                role =
                    await getRIBACOMCurrentRole();

            }

        } catch (roleError) {

            console.warn(
                "RIBACOM role check warning:",
                roleError
            );
        }

        RIBACOM_HEALTH.authentication.role =
            role || null;

        return {
            success: true,
            session: true,
            role: role || "unknown",
            message:
                "Authenticated session detected."
        };

    } catch (error) {

        return {
            success: false,
            session: false,
            message:
                error?.message ||
                String(error)
        };
    }
}
