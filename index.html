<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RIBACOM</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f7f5;
    color: #173b2a;
}

.container {
    max-width: 500px;
    margin: auto;
    padding: 25px 20px;
}

.logo {
    width: 80px;
    height: 80px;
    margin: 10px auto 15px;
    border-radius: 50%;
    background: #087f3d;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 38px;
    font-weight: bold;
}

h1 {
    text-align: center;
    margin-bottom: 5px;
}

.subtitle {
    text-align: center;
    font-size: 14px;
    margin-bottom: 30px;
}

.card {
    background: white;
    padding: 20px;
    margin-bottom: 15px;
    border-radius: 15px;
    border: 2px solid #ddd;
}

.card h2 {
    margin-top: 0;
    font-size: 20px;
}

.card p {
    line-height: 1.5;
    color: #555;
}

button {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 10px;
    background: #087f3d;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #05652f;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">R</div>

    <h1>JOIN RIBACOM</h1>

    <div class="subtitle">
        Choose your membership category
    </div>

    <div class="card">
        <h2>① REGULAR MEMBER</h2>

        <p>
            For persons of Rivers or Bayelsa birth, ancestry,
            family or community origin.
        </p>
    </div>

    <div class="card">
        <h2>② ASSOCIATE MEMBER</h2>

        <p>
            For persons who qualify through marriage or who wish
            to identify with and support the Rivers and Bayelsa
            community.
        </p>
    </div>

    <button>
        CONTINUE
    </button>

</div>

</body>
</html>
