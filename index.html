<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RIBACOM - Rivers Bayelsa Community The Gambia</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
    --primary:#075985;
    --secondary:#15803d;
    --light:#f0fdf4;
    --dark:#123;
    --danger:#b91c1c;
    --warning:#b45309;
    --white:#fff;
    --muted:#64748b;
    --border:#e2e8f0;
    --shadow:0 5px 18px rgba(0,0,0,.08);
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f8fafc;
    color:var(--dark);
}

header{
    background:linear-gradient(135deg,var(--primary),var(--secondary));
    color:white;
    padding:18px;
    position:sticky;
    top:0;
    z-index:100;
}

.header-inner{
    max-width:1000px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
}

.logo{
    width:52px;
    height:52px;
    border-radius:50%;
    background:white;
    color:var(--primary);
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    font-size:18px;
}

header h1{
    margin:0;
    font-size:18px;
}

header small{
    opacity:.9;
}

main{
    max-width:1000px;
    margin:auto;
    padding:18px 14px 90px;
}

.screen{
    display:none;
}

.screen.active{
    display:block;
}

.hero{
    background:linear-gradient(135deg,#075985,#15803d);
    color:white;
    padding:28px 20px;
    border-radius:18px;
    margin-bottom:18px;
}

.hero h2{
    margin-top:0;
}

.card{
    background:white;
    border:1px solid var(--border);
    border-radius:15px;
    padding:18px;
    margin-bottom:15px;
    box-shadow:var(--shadow);
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:15px;
}

.stat-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
    margin-bottom:15px;
}

.stat{
    text-align:center;
}

.stat strong{
    display:block;
    font-size:28px;
    color:var(--primary);
}

label{
    display:block;
    font-weight:bold;
    margin:12px 0 6px;
}

input,
select,
textarea{
    width:100%;
    padding:12px;
    border:1px solid #cbd5e1;
    border-radius:9px;
    font-size:15px;
    background:white;
}

textarea{
    min-height:100px;
    resize:vertical;
}

button,
.btn{
    border:0;
    border-radius:9px;
    padding:12px 16px;
    font-weight:bold;
    cursor:pointer;
    background:var(--primary);
    color:white;
}

button:hover,
.btn:hover{
    opacity:.9;
}

.btn-secondary{
    background:#e2e8f0;
    color:#123;
}

.btn-success{
    background:var(--secondary);
}

.btn-danger{
    background:var(--danger);
}

.btn-warning{
    background:var(--warning);
}

.actions{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:12px;
}

.message{
    padding:12px;
    border-radius:9px;
    margin:10px 0;
    display:none;
}

.message.success{
    display:block;
    background:#dcfce7;
    color:#166534;
}

.message.error{
    display:block;
    background:#fee2e2;
    color:#991b1b;
}

.message.info{
    display:block;
    background:#e0f2fe;
    color:#075985;
}

.badge{
    display:inline-block;
    padding:5px 9px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
}

.badge.pending{
    background:#fef3c7;
    color:#92400e;
}

.badge.approved,
.badge.verified{
    background:#dcfce7;
    color:#166534;
}

.badge.rejected{
    background:#fee2e2;
    color:#991b1b;
}

.badge.admin{
    background:#dbeafe;
    color:#1e40af;
}

.bottom-nav{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    background:white;
    border-top:1px solid var(--border);
    display:flex;
    justify-content:center;
    z-index:200;
    box-shadow:0 -3px 15px rgba(0,0,0,.08);
}

.bottom-nav-inner{
    width:100%;
    max-width:1000px;
    display:flex;
    overflow-x:auto;
}

.bottom-nav button{
    flex:1;
    min-width:90px;
    border-radius:0;
    background:white;
    color:#475569;
    font-size:12px;
    padding:10px 5px;
}

.menu-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}

.menu-item{
    background:white;
    border:1px solid var(--border);
    border-radius:14px;
    padding:18px 10px;
    text-align:center;
    cursor:pointer;
    box-shadow:var(--shadow);
}

.menu-item .icon{
    font-size:28px;
    display:block;
    margin-bottom:7px;
}

.payment-method{
    border:2px solid var(--border);
    padding:14px;
    border-radius:12px;
    margin-bottom:10px;
    cursor:pointer;
}

.payment-method.selected{
    border-color:var(--primary);
    background:#f0f9ff;
}

.payment-info{
    background:#f8fafc;
    border-left:4px solid var(--primary);
    padding:12px;
    margin-top:10px;
}

.loading{
    color:var(--muted);
    padding:15px;
    text-align:center;
}

.search-row{
    display:grid;
    grid-template-columns:2fr 1fr auto;
    gap:8px;
}

.member-row,
.payment-row{
    border:1px solid var(--border);
    border-radius:12px;
    padding:14px;
    margin-bottom:10px;
}

.small{
    color:var(--muted);
    font-size:13px;
}

hr{
    border:0;
    border-top:1px solid var(--border);
    margin:18px 0;
}

@media(max-width:600px){

    .search-row{
        grid-template-columns:1fr;
    }

    .stat-grid{
        grid-template-columns:1fr 1fr;
    }

    .header-inner{
        align-items:flex-start;
    }
}
</style>
</head>

<body>

<header>

<div class="header-inner">

    <div style="display:flex;align-items:center;gap:10px">

        <div class="logo">
            RB
        </div>

        <div>
            <h1>RIBACOM</h1>
            <small>
                Rivers Bayelsa Community The Gambia
            </small>
        </div>

    </div>

    <button
        class="btn-secondary"
        onclick="logout()"
        id="logoutBtn"
        style="display:none">

        Logout

    </button>

</div>

</header>


<main>

    </h2>

    <p>
        Rivers Bayelsa Community in Diaspora - The Gambia
    </p>

    <p>
        Peace • Unity • Progress
    </p>

    <div class="actions">

        <button onclick="openScreen('registration')">
            Become a Member
        </button>

        <button

        </button>

    </div>

</div>


<div class="menu-grid">

    <div
        class="menu-item"
        onclick="openScreen('about')">

        <span class="icon">ℹ️</span>

        About RIBACOM

    </div>


    <div
        class="menu-item"
        onclick="openScreen('membershipInfo')">

        <span class="icon">👥</span>

        Membership

    </div>


    <div
        class="menu-item"
        onclick="openScreen('events')">

        <span class="icon">📅</span>

        Events

    </div>


    <div
        class="menu-item"
        onclick="openScreen('announcements')">

        <span class="icon">📢</span>

        Announcements

    </div>


    <div
        class="menu-item"
        onclick="openScreen('leadership')">

        <span class="icon">👔</span>

        Leadership

    </div>


    <div
        class="menu-item"
        onclick="openScreen('youth')">

        <span class="icon">🌱</span>

        RIBACOM Youth

    </div>


    <div
        class="menu-item"
        onclick="openScreen('constitution')">

        <span class="icon">📜</span>

        Constitution

    </div>

</div>

</section>


<!-- ABOUT -->

<section id="about" class="screen">

    class="btn-secondary"
    onclick="openScreen('home')">
