<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#075985">
<meta name="description" content="Rivers Bayelsa Community in Diaspora The Gambia - RIBACOM">

<style>
:root {
    --primary: #075985;
    --primary-dark: #064e73;
    --secondary: #15803d;
    --secondary-dark: #166534;
    --gold: #ca8a04;
    --danger: #b91c1c;
    --warning: #d97706;
    --success: #15803d;
    --light: #f8fafc;
    --white: #ffffff;
    --dark: #0f172a;
    --muted: #64748b;
    --border: #e2e8f0;
    --shadow: 0 4px 20px rgba(15,23,42,.08);
}

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    background: var(--light);
    color: var(--dark);
}

button,
input,
textarea,
select {
    font: inherit;
}

button {
    cursor: pointer;
}

a {
    color: inherit;
    text-decoration: none;
}

img {
    max-width: 100%;
}

.hidden {
    display: none !important;
}

/* ==============================
   LAYOUT
============================== */

.container {
    width: min(1200px, calc(100% - 28px));
    margin: 0 auto;
}

.card {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: var(--shadow);
}

.grid {
    display: grid;
    gap: 18px;
}

.grid-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
}

.grid-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
}

.grid-4 {
    grid-template-columns: repeat(4, minmax(0, 1fr));
}

/* ==============================
   HEADER
============================== */

.site-header {
    position: sticky;
    top: 0;
    z-index: 1000;
    background: rgba(255,255,255,.97);
    border-bottom: 1px solid var(--border);
    backdrop-filter: blur(10px);
}

.header-main {
    min-height: 74px;
    display: flex;
    align-items: center;
    gap: 12px;
}

.brand {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
}

.brand-logo {
    width: 52px;
    height: 52px;
    object-fit: contain;
    border-radius: 50%;
}

.brand-title {
    min-width: 0;
}

.brand-name {
    font-size: 15px;
    font-weight: 900;
    color: var(--primary);
    line-height: 1.2;
}

.brand-motto {
    font-size: 11px;
    font-weight: 800;
    color: var(--secondary);
    margin-top: 3px;
}

.menu-button {
    margin-left: auto;
    border: 0;
    background: var(--primary);
    color: white;
    border-radius: 10px;
    width: 44px;
    height: 42px;
    font-size: 20px;
}

.nav {
    display: flex;
    gap: 4px;
    overflow-x: auto;
    padding: 0 0 9px;
    scrollbar-width: none;
}

.nav::-webkit-scrollbar {
    display: none;
}

.nav-button {
    border: 0;
    background: transparent;
    color: #334155;
    padding: 9px 11px;
    border-radius: 9px;
    font-weight: 700;
    white-space: nowrap;
}

.nav-button:hover,
.nav-button.active {
    background: #e0f2fe;
    color: var(--primary);
}

/* ==============================
   HERO
============================== */

.hero {
    margin-top: 20px;
    padding: 34px;
    border-radius: 22px;
    color: white;
    background:
        linear-gradient(
            135deg,
            var(--primary),
            var(--secondary)
        );
    box-shadow: var(--shadow);
}

.hero-grid {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 30px;
}

.hero h1 {
    margin: 8px 0;
    font-size: clamp(30px, 6vw, 58px);
    line-height: 1.02;
}

.hero p {
    line-height: 1.7;
}

.hero-logo {
    width: 190px;
    height: 190px;
    object-fit: contain;
    background: rgba(255,255,255,.94);
    padding: 10px;
    border-radius: 50%;
}

/* ==============================
   BUTTONS
============================== */

.btn {
    border: 0;
    border-radius: 9px;
    padding: 10px 15px;
    font-weight: 800;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
}

.btn-primary {
    background: var(--primary);
    color: white;
}

.btn-success {
    background: var(--success);
    color: white;
}

.btn-danger {
    background: var(--danger);
    color: white;
}

.btn-warning {
    background: var(--warning);
    color: white;
}

.btn-light {
    background: #e2e8f0;
    color: #334155;
}

.btn-white {
    background: white;
    color: var(--primary);
}

/* ==============================
   FORMS
============================== */

.form-group {
    margin-bottom: 14px;
}

.form-label {
    display: block;
    margin-bottom: 6px;
    font-size: 13px;
    font-weight: 800;
    color: #475569;
}

.form-control {
    width: 100%;
    border: 1px solid #cbd5e1;
    border-radius: 9px;
    padding: 11px 12px;
    background: white;
    color: var(--dark);
    outline: none;
}

.form-control:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(7,89,133,.12);
}

textarea.form-control {
    min-height: 120px;
    resize: vertical;
}

/* ==============================
   SECTIONS
============================== */

.page {
    padding: 24px 0 50px;
}

.page-title {
    margin: 0;
    font-size: 32px;
    font-weight: 900;
}

.page-subtitle {
    color: var(--muted);
    margin-top: 5px;
}

.section {
    margin-top: 24px;
}

.section-title {
    font-size: 24px;
    font-weight: 900;
    margin: 0 0 14px;
}

/* ==============================
   BADGES
============================== */

.badge {
    display: inline-flex;
    align-items: center;
    border-radius: 999px;
    padding: 4px 9px;
    font-size: 11px;
    font-weight: 900;
    background: #e2e8f0;
    color: #334155;
}

.badge-success {
    background: #dcfce7;
    color: #166534;
}

.badge-danger {
    background: #fee2e2;
    color: #991b1b;
}

.badge-warning {
    background: #fef3c7;
    color: #92400e;
}

.badge-primary {
    background: #e0f2fe;
    color: #075985;
}

/* ==============================
   PUBLIC CARDS
============================== */

.public-card {
    overflow: hidden;
}

.public-card-image {
    width: 100%;
    height: 210px;
    object-fit: cover;
    background: #e2e8f0;
}

.public-card-body {
    padding: 17px;
}

.public-card-title {
    margin: 0;
    font-size: 19px;
    font-weight: 900;
}

.public-card-text {
    color: #475569;
    white-space: pre-line;
    line-height: 1.65;
}

/* ==============================
   ADMIN
============================== */

.admin-layout {
    display: grid;
    grid-template-columns: 230px 1fr;
    gap: 20px;
    align-items: start;
}

.admin-sidebar {
    position: sticky;
    top: 95px;
}

.admin-menu {
    display: flex;
    flex-direction: column;
    gap: 4px;
}

.admin-menu button {
    text-align: left;
    border: 0;
    background: transparent;
    padding: 10px 12px;
    border-radius: 8px;
    font-weight: 700;
}

.admin-menu button:hover,
.admin-menu button.active {
    background: #e0f2fe;
    color: var(--primary);
}

.admin-content {
    min-width: 0;
}

.admin-table-wrap {
    overflow-x: auto;
}

.admin-table {
    width: 100%;
    border-collapse: collapse;
}

.admin-table th,
.admin-table td {
    padding: 10px;
    border-bottom: 1px solid var(--border);
    text-align: left;
    vertical-align: top;
    font-size: 13px;
}

.admin-table th {
    background: #f8fafc;
    font-weight: 900;
}

.action-row {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
}

/* ==============================
   DIGITAL ID
============================== */

.digital-id {
    max-width: 480px;
    margin: 0 auto;
    overflow: hidden;
    border: 2px solid var(--primary);
}

.digital-id-header {
    background: linear-gradient(135deg,var(--primary),var(--secondary));
    color: white;
    padding: 18px;
    text-align: center;
}

.digital-id-body {
    padding: 20px;
}

.digital-id-photo {
    width: 120px;
    height: 120px;
    border-radius: 12px;
    object-fit: cover;
    border: 4px solid white;
    box-shadow: var(--shadow);
}

/* ==============================
   FOOTER
============================== */

.site-footer {
    margin-top: 40px;
    background: #0f172a;
    color: white;
    padding: 30px 0;
}

.footer-grid {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 20px;
}

.footer-title {
    font-weight: 900;
    margin-bottom: 8px;
}

/* ==============================
   TOAST / MODAL
============================== */

.toast {
    position: fixed;
    z-index: 5000;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: #0f172a;
    color: white;
    padding: 12px 18px;
    border-radius: 10px;
    box-shadow: var(--shadow);
    max-width: calc(100% - 30px);
}

.toast.error {
    background: var(--danger);
}

.modal-backdrop {
    position: fixed;
    inset: 0;
    z-index: 4000;
    background: rgba(15,23,42,.65);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 15px;
}

.modal {
    width: min(760px,100%);
    max-height: 92vh;
    overflow-y: auto;
    background: white;
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,.25);
}

.modal-header {
    padding: 17px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.modal-body {
    padding: 18px;
}

/* ==============================
   LOADING
============================== */

.loading {
    padding: 50px;
    text-align: center;
    color: var(--muted);
}

.spinner {
    width: 34px;
    height: 34px;
    border: 4px solid #e2e8f0;
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin .8s linear infinite;
    margin: 0 auto 12px;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

/* ==============================
   MOBILE
============================== */

@media (max-width: 850px) {
    .grid-4 {
        grid-template-columns: repeat(2, minmax(0,1fr));
    }

    .admin-layout {
        grid-template-columns: 1fr;
    }

    .admin-sidebar {
        position: static;
    }

    .admin-menu {
        display: grid;
        grid-template-columns: repeat(2,1fr);
    }

    .footer-grid {
        grid-template-columns: 1fr;
    }
}

@media (max-width: 650px) {
    .container {
        width: min(100% - 20px,1200px);
    }

    .hero {
        padding: 23px;
    }

    .hero-grid {
        grid-template-columns: 1fr;
    }

    .hero-logo {
        width: 145px;
        height: 145px;
    }

    .grid-2,
    .grid-3,
    .grid-4 {
        grid-template-columns: 1fr;
    }

    .admin-menu {
        grid-template-columns: 1fr;
    }

    .brand-name {
        font-size: 12px;
    }

    .brand-motto {
        font-size: 9px;
    }
}
</style>
</head>

<body>

<div id="app">
    <div class="loading">
        <div class="spinner"></div>
        Loading RIBACOM…
    </div>
</div>

<div id="toast-container"></div>

<script>

/* ============================================================
   RIBACOM MASTER APPLICATION
   ============================================================ */

/* ------------------------------------------------------------
   1. SUPABASE CONFIGURATION
   ------------------------------------------------------------ */

const SUPABASE_URL =
    "https://pvgdcqzglafkhqvzxxbi.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_z3fMAHBZyR4zKT1oBVMJZQ_NeIGzD1m";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


/* ------------------------------------------------------------
   2. OFFICIAL RIBACOM CONFIGURATION
   ------------------------------------------------------------ */

const RIBACOM = {
    name: "RIVERS BAYELSA COMMUNITY THE GAMBIA",
    shortName: "RIBACOM",
    fullName: "Rivers Bayelsa Community in Diaspora The Gambia",
    motto: "TRUTH • UNITY • SERVICE",
    crest: "assets/ribacom-crest.png"
};


/* ------------------------------------------------------------
   3. APPLICATION STATE
   ------------------------------------------------------------ */

const state = {
    user: null,
    profile: null,
    member: null,
    isAdmin: false,
    section: "home",
    adminSection: "dashboard",
    editingId: null,
    editingTable: null
};


/* ------------------------------------------------------------
   4. DATABASE TABLE DEFINITIONS
   ------------------------------------------------------------ */

const TABLES = {

    profiles: "profiles",

    members: "members",

    digital_ids: "digital_ids",

    leadership: "leadership",

    advisers: "advisers",

    constitution: "constitution",

    announcements: "announcements",

    events: "events",

    gallery: "gallery",

    publications: "publications",

    youth_content: "youth_content",

    welfare_requests: "welfare_requests",

    payment_settings: "payment_settings",

    ribacom_about_content: "ribacom_about_content",

    ribacom_content: "ribacom_content"
};


/* ------------------------------------------------------------
   5. ENUM VALUES FROM VERIFIED SUPABASE SCHEMA
   ------------------------------------------------------------ */

const ENUMS = {

    membershipCategory: [
        "regular",
        "associate"
    ],

    memberStatus: [
        "pending",
        "approved",
        "rejected",
        "suspended"
    ],

    digitalStatus: [
        "active",
        "suspended",
        "revoked",
        "expired"
    ],

    welfareCategory: [
        "wedding",
        "birth",
        "loss_parent",
        "loss_spouse",
        "loss_child",
        "other"
    ],

    welfareStatus: [
        "pending",
        "under_review",
        "approved",
        "rejected",
        "paid"
    ],

    publicationCategory: [
        "constitution",
        "notice",
        "report",
        "election",
        "meeting",
        "general"
    ],

    adviserCategory: [
        "Legal Adviser",
        "Protocol Adviser",
        "Youth Adviser",
        "Cultural Adviser",
        "Patron",
        "General Adviser"
    ],

    stateOfOrigin: [
        "Rivers",
        "Bayelsa",
        "Other"
    ]
};


/* ------------------------------------------------------------
   6. UTILITY FUNCTIONS
   ------------------------------------------------------------ */

function escapeHTML(value) {

    if (value === null || value === undefined) {
        return "";
    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function formatDate(value) {

    if (!value) {
        return "—";
    }

    try {

        return new Date(value).toLocaleDateString(
            undefined,
            {
                year: "numeric",
                month: "short",
                day: "numeric"
            }
        );

    } catch {

        return value;
    }
}


function formatDateTime(value) {

    if (!value) {
        return "—";
    }

    try {

        return new Date(value).toLocaleString();

    } catch {

        return value;
    }
}


function showToast(message, error = false) {

    const container =
        document.getElementById("toast-container");

    if (!container) return;

    const toast =
        document.createElement("div");

    toast.className =
        "toast" + (error ? " error" : "");

    toast.textContent = message;

    container.appendChild(toast);

    setTimeout(() => {

        toast.remove();

    }, 3500);
}


function showLoading() {

    return `
        <div class="loading">
            <div class="spinner"></div>
            Loading…
        </div>
    `;
}


function humanize(value) {

    return String(value || "")
        .replace(/_/g, " ")
        .replace(/\b\w/g, c => c.toUpperCase());
}


function escapeAttribute(value) {

    return escapeHTML(value)
        .replace(/`/g, "&#096;");
}


function arrayToText(value) {

    if (!Array.isArray(value)) {
        return value || "";
    }

    return value.join("\n");
}


function textToArray(value) {

    if (!value) {
        return [];
    }

    return String(value)
        .split(/\r?\n|,/)
        .map(v => v.trim())
        .filter(Boolean);
}


function generateIDNumber() {

    const year =
        new Date().getFullYear();

    const random =
        Math.floor(
            100000 +
            Math.random() * 900000
        );

    return `RIBACOM-${year}-${random}`;
}


function isLoggedIn() {

    return !!state.user;
}


function isAdmin() {

    return (
        state.profile &&
        (
            state.profile.role === "admin" ||
            state.profile.role === "super_admin"
        )
    );
}


function requireLogin() {

    if (!isLoggedIn()) {

        navigate("login");

        return false;
    }

    return true;
}


function requireAdmin() {

    if (!isAdmin()) {

        showToast(
            "Administrator access required.",
            true
        );

        navigate("login");

        return false;
    }

    return true;
}


/* ------------------------------------------------------------
   7. NAVIGATION
   ------------------------------------------------------------ */

const PUBLIC_NAV = [
    ["home", "Home"],
    ["about", "About"],
    ["leadership", "Leadership"],
    ["constitution", "Constitution"],
    ["announcements", "News"],
    ["events", "Events"],
    ["publications", "Publications"],
    ["gallery", "Gallery"],
    ["youth", "Youth"],
    ["advisers", "Advisers"],
    ["welfare", "Welfare"],
    ["membership", "Membership"],
    ["digital-id", "Digital ID"],
    ["payments", "Payments"]
];


function navigate(section) {

    state.section = section;

    renderApplication();

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


function navigateAdmin(section) {

    state.adminSection = section;

    renderApplication();

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


/* ------------------------------------------------------------
   8. HEADER
   ------------------------------------------------------------ */

function renderHeader() {

    const publicButtons =
        PUBLIC_NAV.map(item => {

            const active =
                state.section === item[0]
                    ? "active"
                    : "";

            return `
                <button
                    class="nav-button ${active}"
                    onclick="navigate('${item[0]}')">
                    ${escapeHTML(item[1])}
                </button>
            `;

        }).join("");

    let accountButton = "";

    if (isLoggedIn()) {

        accountButton = `
            <button
                class="nav-button"
                onclick="navigate('account')">
                Account
            </button>

            ${
                isAdmin()
                ? `
                    <button
                        class="nav-button"
                        onclick="navigate('admin')">
                        Admin
                    </button>
                `
                : ""
            }

            <button
                class="nav-button"
                onclick="logoutUser()">
                Sign Out
            </button>
        `;

    } else {

        accountButton = `
            <button
                class="nav-button"
                onclick="navigate('login')">
                Login
            </button>
        `;
    }

    return `
        <header class="site-header">

            <div class="container header-main">

                <button
                    class="brand"
                    style="border:0;background:none;padding:0;text-align:left"
                    onclick="navigate('home')">

                    <img
                        class="brand-logo"
                        src="${RIBACOM.crest}"
                        alt="RIBACOM Crest"
                        onerror="this.style.display='none'">

                    <div class="brand-title">

                        <div class="brand-name">
                            ${RIBACOM.name}
                        </div>

                        <div class="brand-motto">
                            ${RIBACOM.motto}
                        </div>

                    </div>

                </button>

                <button
                    class="menu-button"
                    onclick="toggleMobileNavigation()">
                    ☰
                </button>

            </div>

            <nav
                id="main-navigation"
                class="container nav">

                ${publicButtons}

                ${accountButton}

            </nav>

        </header>
    `;
}


function toggleMobileNavigation() {

    const nav =
        document.getElementById(
            "main-navigation"
        );

    if (!nav) return;

    if (nav.style.display === "none") {

        nav.style.display = "flex";

    } else {

        nav.style.display = "";
    }
}


/* ------------------------------------------------------------
   9. FOOTER
   ------------------------------------------------------------ */

function renderFooter() {

    return `
        <footer class="site-footer">

            <div class="container footer-grid">

                <div>
                    <div class="footer-title">
                        ${RIBACOM.name}
                    </div>

                    <div>
                        ${RIBACOM.fullName}
                    </div>

                    <div style="margin-top:8px;font-weight:800">
                        ${RIBACOM.motto}
                    </div>
                </div>

                <div>
                    <div class="footer-title">
                        Community
                    </div>

                    <div>Membership</div>
                    <div>Digital ID</div>
                    <div>Welfare</div>
                    <div>Leadership</div>
                </div>

                <div>
                    <div class="footer-title">
                        Official Platform
                    </div>

                    <div>
                        This website is the official
                        digital platform of RIBACOM.
                    </div>

                    <div style="margin-top:10px;font-size:12px;color:#cbd5e1">
                        © ${new Date().getFullYear()}
                        RIBACOM. All rights reserved.
                    </div>
                </div>

            </div>

        </footer>
    `;
}


/* ------------------------------------------------------------
   10. APPLICATION RENDERER
   ------------------------------------------------------------ */

async function renderApplication() {

    const app =
        document.getElementById("app");

    if (!app) return;

    app.innerHTML =
        renderHeader() +
        `<main id="page-content" class="container page">
            ${showLoading()}
        </main>` +
        renderFooter();

    try {

        if (state.section === "home") {
            await renderHome();
        }

        else if (state.section === "about") {
            await renderAbout();
        }

        else if (state.section === "leadership") {
            await renderLeadership();
        }

            `;
        }

}


/* ------------------------------------------------------------
   11. DATABASE HELPERS
   ------------------------------------------------------------ */

async function selectRows(
    table,
    options = {}
) {

    let query =
        supabaseClient
            .from(table)
            .select(options.select || "*");

    if (options.eq) {

        for (
            const [column, value]
            of Object.entries(options.eq)
        ) {

            query =
                query.eq(
                    column,
                    value
                );
        }
    }

    if (options.order) {

        query =
            query.order(
                options.order,
                {
                    ascending:
                        options.ascending ?? false
                }
            );
    }

    if (options.limit) {

        query =
            query.limit(options.limit);
    }

    return query;
}


async function getSingle(
    table,
    id
) {

    return await supabaseClient
        .from(table)
        .select("*")
        .eq("id", id)
        .single();
}


async function insertRow(
    table,
    data
) {

    return await supabaseClient
        .from(table)
        .insert(data)
        .select()
        .single();
}


async function updateRow(
    table,
    id,
    data
) {

    return await supabaseClient
        .from(table)
        .update(data)
        .eq("id", id)
        .select()
        .single();
}


async function deleteRow(
    table,
    id
) {

    return await supabaseClient
        .from(table)
        .delete()
        .eq("id", id);
}


async function getPublished(
    table,
    limit = 100
) {

    return await supabaseClient
        .from(table)
        .select("*")
        .eq("is_published", true)
        .order(
            "created_at",
            {
                ascending: false
            }
        )
        .limit(limit);
}

function formField(
    label,
    name,
    value = "",
    type = "text",
    required = false
) {

    return `

        <div class="form-group">

            <label class="form-label">
                ${escapeHTML(label)}
            </label>

            <input
                class="form-control"
                type="${escapeAttribute(type)}"
                name="${escapeAttribute(name)}"
                value="${escapeAttribute(value)}"
                ${required ? "required" : ""}
            >

        </div>
    `;
}


function formTextarea(
    label,
    name,
    value = "",
    required = false
) {

    return `

        <div class="form-group">

            <label class="form-label">
                ${escapeHTML(label)}
            </label>

            <textarea
                class="form-control"
                name="${escapeAttribute(name)}"
                ${required ? "required" : ""}
            >${escapeHTML(value)}</textarea>

        </div>
    `;
}


function formSelect(
    label,
    name,
    values,
    selected = ""
) {

    return `

        <div class="form-group">

            <label class="form-label">
                ${escapeHTML(label)}
            </label>

            <select
                class="form-control"
                name="${escapeAttribute(name)}">

                ${values.map(
                    value => `

                    <option
                        value="${escapeAttribute(value)}"
                        ${
                            value === selected
                            ? "selected"
                            : ""
                        }>

                        ${escapeHTML(
                            value || "Select"
                        )}

                    </option>
                `
                ).join("")}

            </select>

        </div>
    `;
}


async function submitMembershipForm(event) {

    event.preventDefault();

    if (!requireLogin()) {
        return;
    }


    const form =
        event.target;

    const data =
        Object.fromEntries(
            new FormData(form).entries()
        );


    data.user_id =
        state.user.id;

    data.nationality =
        data.nationality ||
        "Nigerian";

    /*
      New applications begin as pending.
      Existing approved/suspended records are not
      silently changed to another status.
    */

    if (!state.member) {

        data.status =
            "pending";

    }


    try {

        let result;


        if (state.member) {

            /*
              Existing member:
              update the existing record.
            */

            result =
                await updateRow(
                    TABLES.members,
                    state.member.id,
                    data
                );

        } else {

            /*
              New member:
              create a new record.
            */

            result =
                await insertRow(
                    TABLES.members,
                    data
                );
        }


        if (result.error) {
            throw result.error;
        }


        showToast(
            state.member
            ? "Membership record updated successfully."
            : "Membership application submitted successfully."
        );


        await refreshCurrentUser();


        navigate("account");


    } catch (error) {

        console.error(error);

        showToast(
            error.message ||
            "Unable to save membership record.",
            true
        );
    }
}

async function handleLogin(event) {

    event.preventDefault();


    const data =
        Object.fromEntries(
            new FormData(event.target)
                .entries()
        );


    try {

        const result =
            await supabaseClient.auth
                .signInWithPassword({
                    email: data.email,
                    password: data.password
                });


        if (result.error) {
            throw result.error;
        }


        await refreshCurrentUser();


        showToast(
            "Login successful."
        );


        navigate("account");


    } catch (error) {

        showToast(
            error.message ||
            "Login failed.",
            true
        );
    }
}


async function handleSignup(event) {

    event.preventDefault();


    const data =
        Object.fromEntries(
            new FormData(event.target)
                .entries()
        );


    if (
        !data.password ||
        data.password.length < 6
    ) {

        showToast(
            "Password must be at least 6 characters.",
            true
        );

        return;
    }


    try {

        const result =
            await supabaseClient.auth
                .signUp({

                    email: data.email,

                    password: data.password,

                    options: {
                        data: {
                            full_name:
                                data.full_name
                        }
                    }

                });


        if (result.error) {
            throw result.error;
        }


        if (
            result.data.session
        ) {

            await refreshCurrentUser();

            showToast(
                "Account created successfully."
            );

            navigate("membership");

        } else {

            showToast(
                "Account created. Please check your email if email confirmation is enabled."
            );
        }


    } catch (error) {

        showToast(
            error.message ||
            "Unable to create account.",
            true
        );
    }
}

async function submitWelfareRequest(
    event
) {

    event.preventDefault();


    if (!state.member) {

        showToast(
            "Membership record required.",
            true
        );

        return;
    }


    const data =
        Object.fromEntries(
            new FormData(event.target)
                .entries()
        );


    data.member_id =
        state.member.id;

    data.amount_requested =
        Number(
            data.amount_requested
        );


    try {

        const result =
            await insertRow(
                TABLES.welfare_requests,
                data
            );


        if (result.error) {
            throw result.error;
        }


        showToast(
            "Welfare request submitted successfully."
        );


        await renderWelfare();


    } catch (error) {

        showToast(
            error.message ||
            "Unable to submit welfare request.",
            true
        );
    }
}


/* ------------------------------------------------------------
   28. SESSION / PROFILE / MEMBER LOADING
------------------------------------------------------------ */

async function refreshCurrentUser() {

    const sessionResult =
        await supabaseClient.auth
            .getSession();


    state.user =
        sessionResult.data.session?.user ||
        null;


    state.profile = null;
    state.member = null;
    state.isAdmin = false;


    if (!state.user) {
        return;
    }


    const profileResult =
        await supabaseClient
            .from(TABLES.profiles)
            .select("*")
            .eq(
                "id",
                state.user.id
            )
            .maybeSingle();


    if (
        !profileResult.error &&
        profileResult.data
    ) {

        state.profile =
            profileResult.data;

    }


    const memberResult =
        await supabaseClient
            .from(TABLES.members)
            .select("*")
            .eq(
                "user_id",
                state.user.id
            )
            .maybeSingle();


    if (
        !memberResult.error &&
        memberResult.data
    ) {

        state.member =
            memberResult.data;

    }


    state.isAdmin =
        isAdmin();
}


async function logoutUser() {

    try {

        await supabaseClient.auth.signOut();

        state.user = null;
        state.profile = null;
        state.member = null;
        state.isAdmin = false;

        showToast(
            "You have been signed out."
        );

        navigate("home");

    } catch (error) {

        showToast(
            error.message ||
            "Unable to sign out.",
            true
        );
    }
}

/* =========================================================
   SAVE ADMIN MEMBER
   ========================================================= */

async function saveAdminMember(event, memberId = "") {

    event.preventDefault();

    if (!requireAdmin()) return;

    const form = event.target;

    const formData = new FormData(form);

    const data = {

        full_name:
            String(formData.get("full_name") || "").trim(),

        email:
            String(formData.get("email") || "").trim(),

        phone:
            String(formData.get("phone") || "").trim(),

        membership_number:
            String(formData.get("membership_number") || "").trim()
            || null,

        date_of_birth:
            String(formData.get("date_of_birth") || "")
            || null,

        gender:
            String(formData.get("gender") || "")
            || null,

        category:
            String(formData.get("category") || "regular"),

        state_of_origin:
            String(formData.get("state_of_origin") || "")
            || null,

        lga:
            String(formData.get("lga") || "")
            || null,

        nationality:
            String(formData.get("nationality") || "Nigerian")
            || "Nigerian",

        address:
            String(formData.get("address") || "")
            || null,

        rivers_bayelsa_connection:
            String(
                formData.get("rivers_bayelsa_connection") || ""
            ) || null,

        photo_url:
            String(formData.get("photo_url") || "")
            || null,

        emergency_contact_name:
            String(
                formData.get("emergency_contact_name") || ""
            ) || null,

        emergency_contact_phone:
            String(
                formData.get("emergency_contact_phone") || ""
            ) || null,

        status:
            String(formData.get("status") || "pending"),

        dues_paid_until:
            String(formData.get("dues_paid_until") || "")
            || null
    };


    if (!data.full_name || !data.email) {

        showToast(
            "Full name and email are required.",
            "error"
        );

        return;
    }


    showLoading(true);

    try {

        if (memberId) {

            await updateRow(
                TABLES.members,
                memberId,
                data
            );

            showToast(
                "Member updated successfully.",
                "success"
            );

        } else {

            await insertRow(
                TABLES.members,
                data
            );

            showToast(
                "Member created successfully.",
                "success"
            );
        }

        state.adminEditingId = null;

        renderPage();

    } catch (error) {

        console.error("Save member error:", error);

        showToast(
            error.message || "Unable to save member.",
            "error"
        );

    } finally {

        showLoading(false);

    }
}

/* =========================================================
   DELETE MEMBER
   ========================================================= */

async function deleteMember(memberId) {

    if (!requireAdmin()) return;

    const confirmed = confirm(
        "Delete this member record? This action cannot be undone."
    );

    if (!confirmed) return;

    showLoading(true);

    try {

        /*
         * Digital IDs may reference this member.
         * We first check whether a digital ID exists.
         */

        const digitalIDs = await selectRows(
            TABLES.digitalIDs,
            "*",
            {
                member_id: memberId
            },
            "created_at",
            false
        );

        if (digitalIDs.length) {

            showToast(
                "This member has a Digital ID. Revoke or remove the Digital ID before deleting the member.",
                "warning"
            );

            return;
        }


        await supabaseClient
            .from(TABLES.members)
            .delete()
            .eq("id", memberId)
            .select();


        showToast(
            "Member deleted successfully.",
            "success"
        );

        state.adminEditingId = null;

        renderPage();

    } catch (error) {

        console.error(
            "Delete member error:",
            error
        );

        showToast(
            error.message ||
            "Unable to delete member.",
            "error"
        );

    } finally {

        showLoading(false);

    }
}

/* =========================================================

   ========================================================= */

function generateDigitalIDNumber() {

    const year =
        new Date().getFullYear();

    const random =
        Math.floor(
            100000 +
            Math.random() * 900000
        );

    return `RBC-${year}-${random}`;
}


/* =========================================================
   CREATE DIGITAL ID
   ========================================================= */

async function createDigitalID(event) {

    event.preventDefault();

    if (!requireAdmin()) return;


    const form =
        event.target;

    const formData =
        new FormData(form);


    const memberId =
        String(
            formData.get("member_id") || ""
        ).trim();


    if (!memberId) {

        showToast(
            "Please select a member.",
            "error"
        );

        return;
    }


    showLoading(true);


    try {

        /*
         * Confirm that the member exists
         * and is approved.
         */

        const { data: member, error: memberError } =
            await supabaseClient
                .from(TABLES.members)
                .select("*")
                .eq("id", memberId)
                .maybeSingle();


        if (memberError)
            throw memberError;


        if (!member) {

            throw new Error(
                "Selected member could not be found."
            );

        }


        if (member.status !== "approved") {

            throw new Error(
                "A Digital ID can only be issued to an approved member."
            );

        }


        /*
         * Check whether this member already has
         * a Digital ID.
         */

        const { data: existingID, error: existingError } =
            await supabaseClient
                .from(TABLES.digitalIDs)
                .select("id,id_card_number,status")
                .eq("member_id", memberId)
                .maybeSingle();


        if (existingError)
            throw existingError;


        if (existingID) {

            throw new Error(
                "This member already has a Digital ID."
            );

        }


        const issuedDate =
            String(
                formData.get("issued_at") || ""
            );


        const expiryDate =
            String(
                formData.get("expires_at") || ""
            );


        const idNumber =
            String(
                formData.get("id_card_number") || ""
            ).trim()
            || generateDigitalIDNumber();


        const status =
            String(
                formData.get("status") || "active"
            );


        const qrData = JSON.stringify({

            type: "RIBACOM_DIGITAL_ID",

            id_card_number: idNumber,

            member_id: member.id,

            membership_number:
                member.membership_number || null,

            member_name:
                member.full_name,

            organization:
                RIBACOM.name,

            motto:
                "TRUTH • UNITY • SERVICE",

            verification:
                `${window.location.origin}${window.location.pathname}#digital-id`

        });


        const payload = {

            member_id: memberId,

            id_card_number: idNumber,

            qr_code_data: qrData,

            status: status,

            issued_at:
                issuedDate
                ? new Date(
                    `${issuedDate}T00:00:00`
                ).toISOString()
                : new Date().toISOString(),

            expires_at:
                expiryDate
                ? new Date(
                    `${expiryDate}T23:59:59`
                ).toISOString()
                : null

        };


        await insertRow(
            TABLES.digitalIDs,
            payload
        );


        showToast(
            "Digital ID created and issued successfully.",
            "success"
        );


        state.adminEditingDigitalID = null;

        renderPage();


    } catch (error) {

        console.error(
            "Create Digital ID error:",
            error
        );


        showToast(
            error.message ||
            "Unable to create Digital ID.",
            "error"
        );


    } finally {

        showLoading(false);

    }
}

   ========================================================= */

async function saveDigitalID(event, digitalIDId) {

    event.preventDefault();

    if (!requireAdmin()) return;


    const form =
        event.target;

    const formData =
        new FormData(form);


    showLoading(true);


    try {

        /*
         * Get current Digital ID + member.
         */

        const { data: currentID, error: currentError } =
            await supabaseClient
                .from(TABLES.digitalIDs)
                .select(`
                    *,
                    members (
                        id,
                        full_name,
                        email,
                        membership_number
                    )
                `)
                .eq("id", digitalIDId)
                .single();


        if (currentError)
            throw currentError;


        const member =
            currentID.members || {};


        const idNumber =
            String(
                formData.get(
                    "id_card_number"
                ) || ""
            ).trim();


        if (!idNumber) {

            throw new Error(
                "Digital ID number is required."
            );

        }


        const issued =
            String(
                formData.get(
                    "issued_at"
                ) || ""
            );


        const expires =
            String(
                formData.get(
                    "expires_at"
                ) || ""
            );


        const status =
            String(
                formData.get(
                    "status"
                ) || "active"
            );


        const qrData =
            JSON.stringify({

                type:
                    "RIBACOM_DIGITAL_ID",

                id_card_number:
                    idNumber,

                member_id:
                    member.id,

                membership_number:
                    member.membership_number ||
                    null,

                member_name:
                    member.full_name,

                organization:
                    RIBACOM.name,

                motto:
                    "TRUTH • UNITY • SERVICE",

                verification:
                    `${window.location.origin}${window.location.pathname}#digital-id`

            });


        await updateRow(
            TABLES.digitalIDs,
            digitalIDId,
            {

                id_card_number:
                    idNumber,

                qr_code_data:
                    qrData,

                status:
                    status,

                issued_at:
                    issued
                    ? new Date(
                        `${issued}T00:00:00`
                    ).toISOString()
                    : currentID.issued_at,

                expires_at:
                    expires
                    ? new Date(
                        `${expires}T23:59:59`
                    ).toISOString()
                    : null

            }
        );


        showToast(
            "Digital ID updated successfully.",
            "success"
        );


        state.adminEditingDigitalID =
            null;

        renderPage();


    } catch (error) {

        console.error(
            "Save Digital ID error:",
            error
        );


        showToast(
            error.message ||
            "Unable to save Digital ID.",
            "error"
        );


    } finally {

        showLoading(false);

    }
}


/* =========================================================
   RENEW DIGITAL ID
   ========================================================= */

async function renewDigitalID(digitalIDId) {

    if (!requireAdmin()) return;


    const current =
        new Date();


    const currentYear =
        current.getFullYear();


    /*
     * Default renewal period:
     * 1 year from today.
     */

    const renewalDate =
        new Date(
            currentYear + 1,
            current.getMonth(),
            current.getDate()
        );


    const expiry =
        renewalDate
            .toISOString()
            .substring(0, 10);


    const confirmed = confirm(
        `Renew this Digital ID until ${expiry}?`
    );


    if (!confirmed) return;


    showLoading(true);


    try {

        const { data: digitalID, error } =
            await supabaseClient
                .from(TABLES.digitalIDs)
                .select(`
                    *,
                    members (
                        id,
                        full_name,
                        membership_number
                    )
                `)
                .eq("id", digitalIDId)
                .single();


        if (error)
            throw error;


        const member =
            digitalID.members || {};


        const qrData =
            JSON.stringify({

                type:
                    "RIBACOM_DIGITAL_ID",

                id_card_number:
                    digitalID.id_card_number,

                member_id:
                    member.id,

                membership_number:
                    member.membership_number ||
                    null,

                member_name:
                    member.full_name,

                organization:
                    RIBACOM.name,

                motto:
                    "TRUTH • UNITY • SERVICE",

                verification:
                    `${window.location.origin}${window.location.pathname}#digital-id`

            });


        await updateRow(
            TABLES.digitalIDs,
            digitalIDId,
            {

                expires_at:
                    new Date(
                        `${expiry}T23:59:59`
                    ).toISOString(),

                status:
                    "active",

                qr_code_data:
                    qrData

            }
        );


        showToast(
            "Digital ID renewed successfully.",
            "success"
        );


        renderPage();


    } catch (error) {

        console.error(
            "Renew Digital ID error:",
            error
        );


        showToast(
            error.message ||
            "Unable to renew Digital ID.",
            "error"
        );


    } finally {

        showLoading(false);

    }
}


/* =========================================================
   CHANGE DIGITAL ID STATUS
   ========================================================= */

async function changeDigitalIDStatus(
    digitalIDId,
    status
) {

    if (!requireAdmin()) return;


    const labels = {

        active:
            "activate",

        suspended:
            "suspend",

        revoked:
            "revoke",

        expired:
            "mark as expired"

    };


    const action =
        labels[status] ||
        "change the status of";


    const confirmed =
        confirm(
            `Are you sure you want to ${action} this Digital ID?`
        );


    if (!confirmed) return;


    showLoading(true);


    try {

        await updateRow(
            TABLES.digitalIDs,
            digitalIDId,
            {
                status: status
            }
        );


        showToast(
            `Digital ID ${status} successfully.`,
            "success"
        );


        renderPage();


    } catch (error) {

        console.error(
            "Digital ID status error:",
            error
        );


        showToast(
            error.message ||
            "Unable to change Digital ID status.",
            "error"
        );


    } finally {

        showLoading(false);

    }
}

/* =========================================================
   GENERATE DIGITAL ID NUMBER
   ========================================================= */

function generateDigitalIDNumber() {

    const year =
        new Date().getFullYear();

    const random =
        Math.floor(
            100000 +
            Math.random() * 900000
        );

    return `RBC-${year}-${random}`;
}


/* =========================================================
   CREATE DIGITAL ID
   ========================================================= */

async function createDigitalID(event) {

    event.preventDefault();

    if (!requireAdmin()) return;


    const form =
        event.target;

    const formData =
        new FormData(form);


    const memberId =
        String(
            formData.get("member_id") || ""
        ).trim();


    if (!memberId) {

        showToast(
            "Please select a member.",
            "error"
        );

        return;
    }


    showLoading(true);


    try {

        /*
         * Confirm that the member exists
         * and is approved.
         */

        const { data: member, error: memberError } =
            await supabaseClient
                .from(TABLES.members)
                .select("*")
                .eq("id", memberId)
                .maybeSingle();


        if (memberError)
            throw memberError;


        if (!member) {

            throw new Error(
                "Selected member could not be found."
            );

        }


        if (member.status !== "approved") {

            throw new Error(
                "A Digital ID can only be issued to an approved member."
            );

        }


        /*
         * Check whether this member already has
         * a Digital ID.
         */

        const { data: existingID, error: existingError } =
            await supabaseClient
                .from(TABLES.digitalIDs)
                .select("id,id_card_number,status")
                .eq("member_id", memberId)
                .maybeSingle();


        if (existingError)
            throw existingError;


        if (existingID) {

            throw new Error(
                "This member already has a Digital ID."
            );

        }


        const issuedDate =
            String(
                formData.get("issued_at") || ""
            );


        const expiryDate =
            String(
                formData.get("expires_at") || ""
            );


        const idNumber =
            String(
                formData.get("id_card_number") || ""
            ).trim()
            || generateDigitalIDNumber();


        const status =
            String(
                formData.get("status") || "active"
            );


        const qrData = JSON.stringify({

            type: "RIBACOM_DIGITAL_ID",

            id_card_number: idNumber,

            member_id: member.id,

            membership_number:
                member.membership_number || null,

            member_name:
                member.full_name,

            organization:
                RIBACOM.name,

            motto:
                "TRUTH • UNITY • SERVICE",

            verification:
                `${window.location.origin}${window.location.pathname}#digital-id`

        });


        const payload = {

            member_id: memberId,

            id_card_number: idNumber,

            qr_code_data: qrData,

            status: status,

            issued_at:
                issuedDate
                ? new Date(
                    `${issuedDate}T00:00:00`
                ).toISOString()
                : new Date().toISOString(),

            expires_at:
                expiryDate
                ? new Date(
                    `${expiryDate}T23:59:59`
                ).toISOString()
                : null

        };


        await insertRow(
            TABLES.digitalIDs,
            payload
        );


        showToast(
            "Digital ID created and issued successfully.",
            "success"
        );


        state.adminEditingDigitalID = null;

        renderPage();


    } catch (error) {

        console.error(
            "Create Digital ID error:",
            error
        );


        showToast(
            error.message ||
            "Unable to create Digital ID.",
            "error"
        );


    } finally {

        showLoading(false);

    }
}

/* =========================================================
   SAVE EXISTING DIGITAL ID
   ========================================================= */

async function saveDigitalID(event, digitalIDId) {

    event.preventDefault();

    if (!requireAdmin()) return;


    const form =
        event.target;

    const formData =
        new FormData(form);


    showLoading(true);


    try {

        /*
         * Get current Digital ID + member.
         */

        const { data: currentID, error: currentError } =
            await supabaseClient
                .from(TABLES.digitalIDs)
                .select(`
                    *,
                    members (
                        id,
                        full_name,
                        email,
                        membership_number
                    )
                `)
                .eq("id", digitalIDId)
                .single();


        if (currentError)
            throw currentError;


        const member =
            currentID.members || {};


        const idNumber =
            String(
                formData.get(
                    "id_card_number"
                ) || ""
            ).trim();


        if (!idNumber) {

            throw new Error(
                "Digital ID number is required."
            );

        }


        const issued =
            String(
                formData.get(
                    "issued_at"
                ) || ""
            );


        const expires =
            String(
                formData.get(
                    "expires_at"
                ) || ""
            );


        const status =
            String(
                formData.get(
                    "status"
                ) || "active"
            );


        const qrData =
            JSON.stringify({

                type:
                    "RIBACOM_DIGITAL_ID",

                id_card_number:
                    idNumber,

                member_id:
                    member.id,

                membership_number:
                    member.membership_number ||
                    null,

                member_name:
                    member.full_name,

                organization:
                    RIBACOM.name,

                motto:
                    "TRUTH • UNITY • SERVICE",

                verification:
                    `${window.location.origin}${window.location.pathname}#digital-id`

            });


        await updateRow(
            TABLES.digitalIDs,
            digitalIDId,
            {

                id_card_number:
                    idNumber,

                qr_code_data:
                    qrData,

                status:
                    status,

                issued_at:
                    issued
                    ? new Date(
                        `${issued}T00:00:00`
                    ).toISOString()
                    : currentID.issued_at,

                expires_at:
                    expires
                    ? new Date(
                        `${expires}T23:59:59`
                    ).toISOString()
                    : null

            }
        );


        showToast(
            "Digital ID updated successfully.",
            "success"
        );


        state.adminEditingDigitalID =
            null;

        renderPage();


    } catch (error) {

        console.error(
            "Save Digital ID error:",
            error
        );


        showToast(
            error.message ||
            "Unable to save Digital ID.",
            "error"
        );


    } finally {

        showLoading(false);

    }
}


/* =========================================================
   RENEW DIGITAL ID
   ========================================================= */

async function renewDigitalID(digitalIDId) {

    if (!requireAdmin()) return;


    const current =
        new Date();


    const currentYear =
        current.getFullYear();


    /*
     * Default renewal period:
     * 1 year from today.
     */

    const renewalDate =
        new Date(
            currentYear + 1,
            current.getMonth(),
            current.getDate()
        );


    const expiry =
        renewalDate
            .toISOString()
            .substring(0, 10);


    const confirmed = confirm(
        `Renew this Digital ID until ${expiry}?`
    );


    if (!confirmed) return;


    showLoading(true);


    try {

        const { data: digitalID, error } =
            await supabaseClient
                .from(TABLES.digitalIDs)
                .select(`
                    *,
                    members (
                        id,
                        full_name,
                        membership_number
                    )
                `)
                .eq("id", digitalIDId)
                .single();


        if (error)
            throw error;


        const member =
            digitalID.members || {};


        const qrData =
            JSON.stringify({

                type:
                    "RIBACOM_DIGITAL_ID",

                id_card_number:
                    digitalID.id_card_number,

                member_id:
                    member.id,

                membership_number:
                    member.membership_number ||
                    null,

                member_name:
                    member.full_name,

                organization:
                    RIBACOM.name,

                motto:
                    "TRUTH • UNITY • SERVICE",

                verification:
                    `${window.location.origin}${window.location.pathname}#digital-id`

            });


        await updateRow(
            TABLES.digitalIDs,
            digitalIDId,
            {

                expires_at:
                    new Date(
                        `${expiry}T23:59:59`
                    ).toISOString(),

                status:
                    "active",

                qr_code_data:
                    qrData

            }
        );


        showToast(
            "Digital ID renewed successfully.",
            "success"
        );


        renderPage();


    } catch (error) {

        console.error(
            "Renew Digital ID error:",
            error
        );


        showToast(
            error.message ||
            "Unable to renew Digital ID.",
            "error"
        );


    } finally {

        showLoading(false);

    }
}


/* =========================================================
   CHANGE DIGITAL ID STATUS
   ========================================================= */

async function changeDigitalIDStatus(
    digitalIDId,
    status
) {

    if (!requireAdmin()) return;


    const labels = {

        active:

        suspended:

   ========================================================= */

async function saveLeadership(
    event,
    leaderId = ""
) {

    event.preventDefault();

    if (!requireAdmin()) return;


    const form =
        event.target;

    const formData =
        new FormData(form);


    const name =
        String(
            formData.get("name") || ""
        ).trim();


    const position =
        String(
            formData.get("position") || ""
        ).trim();


    if (!name || !position) {

        showToast(
            "Name and position are required.",
            "error"
        );

        return;
    }


    const data = {

        name: name,

        position: position,

        photo_url:
            String(
                formData.get("photo_url") || ""
            ).trim() || null,

        biography:
            String(
                formData.get("biography") || ""
            ).trim() || null,

        phone:
            String(
                formData.get("phone") || ""
            ).trim() || null,

        email:
            String(
                formData.get("email") || ""
            ).trim() || null,

        display_order:
            Number(
                formData.get("display_order") || 0
            ),

        is_active:
            String(
                formData.get("is_active") || "true"
            ) === "true",

        term_start:
            String(
                formData.get("term_start") || ""
            ) || null,

        term_end:
            String(
                formData.get("term_end") || ""
            ) || null

    };


    showLoading(true);


    try {

        if (leaderId) {

            await updateRow(
                TABLES.leadership,
                leaderId,
                data
            );

            showToast(
                "Leadership record updated successfully.",
                "success"
            );

        } else {

            await insertRow(
                TABLES.leadership,
                data
            );

            showToast(
                "Leader added successfully.",
                "success"
            );

        }


        state.adminEditingLeadership =
            null;

        renderPage();


    } catch (error) {

        console.error(
            "Save leadership error:",
            error
        );


        showToast(
            error.message ||
            "Unable to save leadership record.",
            "error"
        );


    } finally {

        showLoading(false);

    }
}

/* =========================================================
   SAVE ADVISER
   ========================================================= */

async function saveAdviser(
    event,
    adviserId = ""
) {

    event.preventDefault();

    if (!requireAdmin()) return;


    const form =
        event.target;

    const formData =
        new FormData(form);


    const name =
        String(
            formData.get("name") || ""
        ).trim();


    if (!name) {

        showToast(
            "Adviser name is required.",
            "error"
        );

        return;
    }


    const data = {

        name: name,

        category:
            String(
                formData.get("category") ||
                "General Adviser"
            ),

        photo_url:
            String(
                formData.get("photo_url") || ""
            ).trim() || null,

        biography:
            String(
                formData.get("biography") || ""
            ).trim() || null,

        phone:
            String(
                formData.get("phone") || ""
            ).trim() || null,

        is_active:
            String(
                formData.get("is_active") ||
                "true"
            ) === "true"

    };


    showLoading(true);


    try {

        if (adviserId) {

            await updateRow(
                TABLES.advisers,
                adviserId,
                data
            );


            showToast(
                "Adviser updated successfully.",
                "success"
            );

        } else {

            await insertRow(
                TABLES.advisers,
                data
            );


            showToast(
                "Adviser added successfully.",
                "success"
            );

        }


        state.adminEditingAdviser =
            null;


        renderPage();


    } catch (error) {

        console.error(
            "Save adviser error:",
            error
        );


        showToast(
            error.message ||
            "Unable to save adviser.",
            "error"
        );


    } finally {

        showLoading(false);

    }
}

async function saveConstitutionArticle(
    event,
    articleId = ""
) {

    event.preventDefault();

    if (!requireAdmin()) return;


    const form =
        event.target;

    const formData =
        new FormData(form);


    const chapterNumber =
        Number(
            formData.get(
                "chapter_number"
            )
        );


    const articleNumber =
        Number(
            formData.get(
                "article_number"
            )
        );


    const chapterTitle =
        String(
            formData.get(
                "chapter_title"
            ) || ""
        ).trim();


    const articleTitle =
        String(
            formData.get(
                "article_title"
            ) || ""
        ).trim();


    const content =
        String(
            formData.get(
                "content"
            ) || ""
        ).trim();


    if (
        !chapterNumber ||
        !articleNumber ||
        !chapterTitle ||
        !articleTitle ||
        !content
    ) {

        showToast(
            "Chapter number, chapter title, article number, article title and content are required.",
            "error"
        );

        return;
    }


    const data = {

        chapter_number:
            chapterNumber,

        chapter_title:
            chapterTitle,

        article_number:
            articleNumber,

        article_title:
            articleTitle,

        content:
            content,

        is_published:
            String(
                formData.get(
                    "is_published"
                ) || "true"
            ) === "true"

    };


    showLoading(true);


    try {

        if (articleId) {

            await updateRow(
                TABLES.constitution,
                articleId,
                data
            );


            showToast(
                "Constitution article updated.",
                "success"
            );

        } else {

            await insertRow(
                TABLES.constitution,
                data
            );


            showToast(
                "Constitution article added.",
                "success"
            );

        }


        state.adminEditingConstitution =
            null;


        renderPage();


    } catch (error) {

        console.error(
            "Save Constitution error:",
            error
        );


        showToast(
            error.message ||
            "Unable to save Constitution article.",
            "error"
        );


    } finally {

        showLoading(false);

    }
}

function addObjectiveRow() {

    `;

function addCoreValueRow() {

    const container =
        document.getElementById(
            "values-container"
        );


    if (!container) return;


    const row =
        document.createElement("div");


    row.className =
        "array-row";


    row.innerHTML = `

        <input
            type="text"
            name="core_value"
            placeholder="RIBACOM core value">


        <button
            type="button"
            class="danger-btn"
            onclick="removeArrayRow(this)">

            Remove

        </button>
    `;


    container.appendChild(row);

}


function removeArrayRow(button) {

    const row =
        button?.parentElement;


    if (!row) return;


    const container =
        row.parentElement;


    if (
        container &&
        container.children.length > 1
    ) {

        row.remove();

    } else {

        const input =
            row.querySelector("input");

        if (input)
            input.value = "";

    }

}


/* =========================================================
   SAVE ABOUT RIBACOM
   ========================================================= */

async function saveAboutRIBACOM(
    event,
    aboutId = ""
) {

    event.preventDefault();

    if (!requireAdmin()) return;


    const form =
        event.target;

    const formData =
        new FormData(form);


    const objectives =
        Array.from(
            form.querySelectorAll(
                'input[name="objective"]'
            )
        )
        .map(
            input =>
                input.value.trim()
        )
        .filter(Boolean);


    const coreValues =
        Array.from(
            form.querySelectorAll(
                'input[name="core_value"]'
            )
        )
        .map(
            input =>
                input.value.trim()
        )
        .filter(Boolean);


    const data = {

        org_name:
            String(
                formData.get(
                    "org_name"
                ) || ""
            ).trim()
            ||
            "RIVERS BAYELSA COMMUNITY THE GAMBIA (RIBACOM)",


        motto:
            String(
                formData.get(
                    "motto"
                ) || ""
            ).trim()
            ||
            "TRUTH • UNITY • SERVICE",


        history:
            String(
                formData.get(
                    "history"
                ) || ""
            ).trim()
            || null,


        vision:
            String(
                formData.get(
                    "vision"
                ) || ""
            ).trim()
            || null,


        mission:
            String(
                formData.get(
                    "mission"
                ) || ""
            ).trim()
            || null,


        objectives:
            objectives.length
            ? objectives
            : null,


        core_values:
            coreValues.length
            ? coreValues
            : null,


        contact_email:
            String(
                formData.get(
                    "contact_email"
                ) || ""
            ).trim()
            || null,


        contact_phone:
            String(
                formData.get(
                    "contact_phone"
                ) || ""
            ).trim()
            || null,


        address:
            String(
                formData.get(
                    "address"
                ) || ""
            ).trim()
            || null,


        updated_by:
            state.user?.id || null

    };


    showLoading(true);


    try {

        if (aboutId) {

            await updateRow(
                TABLES.about,
                aboutId,
                data
            );


            showToast(
                "About RIBACOM information updated.",
                "success"
            );

        } else {

            await insertRow(
                TABLES.about,
                data
            );


            showToast(
                "About RIBACOM information created.",
                "success"
            );

        }


        renderPage();


    } catch (error) {

        console.error(
            "Save About error:",
            error
        );


        showToast(
            error.message ||
            "Unable to save About RIBACOM information.",
            "error"
        );


    } finally {

        showLoading(false);

    }
}

/* =========================================================
   ANNOUNCEMENT EDITOR
   ========================================================= */

function openAnnouncementEditor(id = null) {

    if (!requireAdmin()) return;


    state.adminEditingAnnouncement =
        id || "new";


    renderPage();


    setTimeout(() => {

        document
            .getElementById(
                "announcement-editor"
            )
            ?.scrollIntoView({
                behavior: "smooth",
                block: "start"
            });

    }, 100);
}


function closeAnnouncementEditor() {

    state.adminEditingAnnouncement =
        null;

    renderPage();

}


function renderAnnouncementEditor(id) {

    if (id === "new") {

        return buildAnnouncementForm(null);

    }


    setTimeout(
        () => loadAnnouncementEditor(id),
        0
    );


    return `
        <div
            class="admin-panel editor-panel"
            id="announcement-editor">

            <div class="loading-inline">

                Loading announcement...

            </div>

        </div>
    `;
}


async function loadAnnouncementEditor(id) {

    const editor =
        document.getElementById(
            "announcement-editor"
        );


    if (!editor) return;


    try {

        const { data, error } =
            await supabaseClient
                .from(TABLES.announcements)
                .select("*")
                .eq("id", id)
                .single();


        if (error)
            throw error;


        editor.outerHTML =
            buildAnnouncementForm(data);


    } catch (error) {

        console.error(
            "Announcement editor error:",
            error
        );


        editor.innerHTML = `
            <div class="error-box">

                Unable to load announcement.

                <br><br>

                ${escapeHTML(
                    error.message || ""
                )}

            </div>
        `;
    }
}

    const isEdit =
        !!item;


    return `

            class="admin-panel editor-panel"
            id="announcement-editor">

/* =========================================================
   SAVE ANNOUNCEMENT
   ========================================================= */

async function saveAnnouncement(
    event,
    announcementId = ""
) {

    event.preventDefault();

    if (!requireAdmin()) return;


    const form =
        event.target;

    const formData =
        new FormData(form);


    const title =
        String(
            formData.get("title") || ""
        ).trim();


    const content =
        String(
            formData.get("content") || ""
        ).trim();


    if (!title || !content) {

        showToast(
            "Title and announcement content are required.",
            "error"
        );

        return;
    }


    const data = {

        title,

        content,

        image_url:
            String(
                formData.get(
                    "image_url"
                ) || ""
            ).trim()
            || null,

        is_published:
            String(
                formData.get(
                    "is_published"
                ) || "true"
            ) === "true"

    };


    if (!announcementId &&
        state.user?.id) {

        data.author_id =
            state.user.id;

    }


    showLoading(true);


    try {

        if (announcementId) {

            await updateRow(
                TABLES.announcements,
                announcementId,
                data
            );


            showToast(
                "Announcement updated.",
                "success"
            );

        } else {

            await insertRow(
                TABLES.announcements,
                data
            );


            showToast(
                "Announcement created.",
                "success"
            );

        }


        state.adminEditingAnnouncement =
            null;


        renderPage();


    } catch (error) {

        console.error(
            "Save announcement error:",
            error
        );


        showToast(
            error.message ||
            "Unable to save announcement.",
            "error"
        );


    } finally {

        showLoading(false);

    }
}


/* =========================================================
   ANNOUNCEMENT PUBLICATION
   ========================================================= */

async function toggleAnnouncementPublication(
    id,
    published
) {

    if (!requireAdmin()) return;


    if (
        !confirm(
            published
            ? "Publish this announcement?"
            : "Unpublish this announcement?"
        )
    ) {
        return;
    }


    showLoading(true);


    try {

        await updateRow(
            TABLES.announcements,
            id,
            {
                is_published: published
            }
        );


        showToast(
            published
            ? "Announcement published."
            : "Announcement unpublished.",
            "success"
        );


        renderPage();


    } catch (error) {

        console.error(error);


        showToast(
            error.message ||
            "Unable to update announcement.",
            "error"
        );


    } finally {

        showLoading(false);

    }
}


/* =========================================================
   DELETE ANNOUNCEMENT
   ========================================================= */

async function deleteAnnouncement(id) {

    if (!requireAdmin()) return;


    if (
        !confirm(
            "Delete this announcement permanently?"
        )
    ) {
        return;
    }


    showLoading(true);


    try {

        const { error } =
            await supabaseClient
                .from(TABLES.announcements)
                .delete()
                .eq("id", id);


        if (error)
            throw error;


        showToast(
            "Announcement deleted.",
            "success"
        );


        renderPage();


    } catch (error) {

        console.error(error);


        showToast(
            error.message ||
            "Unable to delete announcement.",
            "error"
        );


    } finally {

        showLoading(false);

    }
}
